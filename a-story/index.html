async function bonusLevel(S, stg = 'explore'){
  let fails = 0;
  S.ghosts = S.ghosts || []; S.runs = S.runs || [];
  levelNow = S;
  while (true){
    newTry();
    try {
      if (panelMode === 'speedP') stg = 'explore'; else if (panelMode === 'speedN') stg = 'calc';
      if (stg === 'explore'){                   // 7-03
        board(null);
        if (panelMode !== 'speedP') showPanel('speedP', { v:null }, true);
        S.onParam(pval);
        lockPanel(false);
        mark('7-03'); say('ryuka', '“เลือกความเร็วดีๆ นะ… ขอร้อง”', { wait:false });
        const { v } = await waitPlay();
        lockPanel(true);
        S.start(v);
        const land = await waitEvent('landed');
        track.attempt({ v }, 'explore', land.err);
        S.ghosts = S.ghosts.filter(g => g.v !== v).concat([{ v, x:land.x, dots:S.dots.slice() }]);
        S.runs = S.runs.filter(r => r.v !== v).concat([{ v, label:`v = ${v} m/s`, lines:[`ตกห่างขอบ ≈ ${(land.x - S.edge).toFixed(2)} m`, `เวลาลอย ${S.tFlight().toFixed(2)} s`] }]);
        if (!MODES.speedP.presets.every(x => S.runs.some(r => r.v === x))) continue;
        await say('yuan', '“ครบ 3 รอบแล้ว ลองเทียบดูว่าแต่ละรอบตกไกลแค่ไหน แล้วเวลาลอยบนแผงเป็นเท่าไหร่”');
        // 7-04: the board says what was just seen: t is the same every time, so x grows with v
        mark('7-04'); showPanel(null); S.runs = []; S.ticksTo = 4;
        const t = S.tFlight(), xs = [2, 4, 6].map(u => (u*t).toFixed(2));
        board(`<span class="tag">ระยะตก x = v × t</span>
          <div class="eqMid">เวลาลอย <i>t</i> ≈ ${t.toFixed(2)} s ทุกรอบ</div>
          ${[2, 4, 6].map((u, i) => `<div class="row ${u === v ? 'on' : 'done'}"><i class="math">v</i> = ${u} m/s → <i class="math">x</i> = ${u} × <i class="math">t</i> ≈ <b>${xs[i]} m</b></div>`).join('')}
          <div class="small">v เป็น 2 เท่า (2 → 4 m/s) x ก็เป็น 2 เท่า (${xs[0]} → ${xs[1]} m)</div>`);
        await say('yuan', '“เร็วเป็น 2 เท่า ก็ตกไกลเป็น 2 เท่า แต่เวลาลอยเท่าเดิมทุกรอบ ประมาณ 0.62 s เพราะความสูงเท่าเดิม”', { pop:POP.xvt });
        stg = 'calc'; S.ghosts = []; S.ghost = null; S.ticksTo = null;
        continue;
      }
      // คำนวณ (7-05, 7-06)
      if (panelMode !== 'speedN') showPanel('speedN', { v:null }, true);
      S.onParam(pval);
      if (!memo.bonusBoard){
        lockPanel(true);
        mark('7-05'); board(`<span class="tag">ลองตั้งสมการ</span>
          <div class="q">ริวกะหลุดจากขอบที่ความสูง h = 1.9 m และต้องลงเบาะที่ห่างขอบ D = 3.0 m กล่องต้องเร็วเท่าไหร่ ?</div>
          <div class="eqMid"><i>h</i> = ½ <i>g t</i>² → <i>t</i> = √(2<i>h</i>/<i>g</i>)</div>
          <div class="fillrow">เวลาลอย <i class="math">t</i> = ${fillBox('t', 'เวลาลอย')} s</div>
          <div class="fillrow"><i class="math">v</i> = <i class="math">D</i> / <i class="math">t</i> = 3.0 / <i class="math">t</i> = ${fillBox('v', 'ความเร็วกล่อง')} m/s</div>
          <div class="small">ได้ v แล้ว ใส่ลงในช่องความเร็วบนแผง แล้วกด ปล่อยกล่อง/เล่น</div>`, true, 'wide');
        const B = blanks(), t = S.tFlight();
        say('yuan', '“คราวนี้ไม่มีปุ่มให้เลือกแล้ว ตั้งสมการบนกระดานก่อน แล้วค่อยใส่ความเร็วที่คิดได้”', { wait:false });
        await solve(B, 't', t, async (v, ok, n, given) => {
          if (ok) return say('yuan', '“ใช่ t ≈ 0.62 s ตรงกับเวลาลอยที่นายเห็นบนแผงทุกรอบเลย”');
          if (given) return say('yuan', '“t = √(2 × 1.9 / 9.81) ≈ 0.62 s ตรงกับเวลาลอยที่นายเห็นบนแผงทุกรอบเลย”');
          if (near(v, 2*1.9/G, 0.03)) return say('yuan', '“0.39 คือ 2h/g ยังไม่ได้ถอดรากที่สองนะ √0.39 เท่ากับเท่าไหร่ลองดู”');
          return say('yuan', '“t = √(2h/g) ลองแทน h = 1.9 m และ g = 9.81 m/s² แล้วถอดรากที่สองดู”');
        }, { id:'b-bonus-time' });
        await solve(B, 'v', 3/t, async (v, ok, n, given) => {
          if (ok) return say('yuan', '“ถูก 3.0 ÷ 0.62 ≈ 4.8 m/s ลองใส่ความเร็วนี้ในช่องบนแผงแล้วปล่อยกล่องดู”');
          if (given) return say('yuan', '“3.0 ÷ 0.62 ≈ 4.8 m/s ลองใส่ความเร็วนี้ในช่องบนแผงแล้วปล่อยกล่องดู”');
          if (near(v, 3*t, 0.03)) return say('yuan', '“นายเอา D ไปคูณ t แต่ D = v × t ถ้าจะหา v ต้องเอา D หารด้วย t”');
          return say('yuan', '“D = v × t ถ้าจะหา v ต้องเอา D หารด้วย t”');
        }, { id:'b-bonus-speed', dec:1 });
        memo.bonusBoard = snapBoard().html;
      } else if ($('board').hidden) board(memo.bonusBoard, true, 'wide');
      lockPanel(false);
      mark('7-06'); say('ryuka', '“เลือกความเร็วดีๆ นะ… ขอร้อง”', { wait:false });
      const { v } = await waitPlay();
      lockPanel(true);
      board(null);
      S.start(v);
      if (v === 0){
        await waitEvent('still');
        track.attempt({ v }, 'nomove');
        await say('ryuka', '“กล่องไม่ขยับ เค้าก็ไม่ไปไหน (ΣF = 0 และนิ่งอยู่ ก็นิ่งต่อไป) ตั้งความเร็วหน่อยสิ”');
        S.reset(); continue;
      }
      const land = await waitEvent('landed');
      track.attempt({ v }, land.ok ? 'success' : land.err < 0 ? 'short' : 'long', land.err);
      if (land.ok){
        const th = document.createElement('div'); th.id = 'thumb'; th.textContent = '👍'; stage.append(th);
        await say('yuan', `“เยี่ยม! ใช้ความเร็ว ${v.toFixed(1)} m/s ริวกะตกห่างธงแค่ ${Math.abs(land.err).toFixed(2)} m ลงเบาะพอดี”`);
        th.remove();
        break;
      }
      fails++;
      const msg = land.err < 0 ? `ตกก่อนถึงธง ${(-land.err).toFixed(2)} m` : `เลยธงไป ${land.err.toFixed(2)} m`;   // how far off, not which way
      if (fails >= 2){
        track.hint();
        await say('yuan', `${msg} ใบ้ให้: เมื่อพุ่งออกในแนวราบ เวลาที่ลอยอยู่กลางอากาศขึ้นกับความสูงอย่างเดียว t = √(2h/g) = √(2×1.9/9.81) ≈ 0.62 s แล้ว D = v·t`);
      } else {
        await say('ryuka', `“${msg}… โอ๊ย”`);
      }
    } catch (e){ await retried(e, S); }
  }
  endLevel();
  board(null);
  showPanel(null);
  await projectileLesson(S);
}

// End-of-game survey for the teacher (once per session), on three pages: the six aspects in FB_RATE, then the
// overall questions, then the two boxes to type in. Every answer is optional. ข้าม ends the survey: answers on the
// pages already left with ต่อไป are saved, the current page's are not, and with none at all the row is just
// "skipped". Each FB_RATE key is a Feedback column in the sheet.
const FB_RATE = [['theme', 'ความน่าสนใจของธีมเกมและโทนสี'], ['clarity', 'ความเข้าใจของคำอธิบาย'], ['flow', 'ความต่อเนื่องของเนื้อเรื่องและคำอธิบาย'],
  ['ui', 'ความง่ายของการใช้ UI'], ['teaching', 'เข้าใจการสอนมั้ย'], ['visual', 'องค์ประกอบ visual โดยรวม']];
function feedback(){
  const parts = track.visited.filter(k => k !== 'end');
  // LEVEL: what each step of the six ratings means, shown over the five columns of the first page
  const LEVEL = ['น้อยที่สุด', 'น้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];
  const scale = (k, label, lo, hi) => `<div class="scale lv" data-k="${k}" role="group" aria-label="${label}">${[1, 2, 3, 4, 5].map(n =>
      `<button data-v="${n}" aria-pressed="false"${lo ? '' : ` aria-label="${n} ${LEVEL[n - 1]}" title="${LEVEL[n - 1]}"`}>${n}</button>`).join('')}</div>${lo ? `<small>1 = ${lo}; 5 = ${hi}</small>` : ''}`;
  const ans = {}, num = k => +ans[k] || '';
  const pages = [
    { html:`<div class="fb rate"><div class="fbRow" aria-hidden="true"><span></span><div class="scaleHead">${LEVEL.map(w => `<span>${w}</span>`).join('')}</div></div>
          ${FB_RATE.map(([k, label]) => `<div class="fbRow"><span>${label}</span>${scale(k, label)}</div>`).join('')}</div>`,
      read:() => Object.fromEntries(FB_RATE.map(([k]) => [k, num(k)])) },
    { html:`<div class="fb">
          <div class="fbRow"><span>เกมนี้ยากแค่ไหน</span>${scale('difficulty', 'เกมนี้ยากแค่ไหน', 'ง่ายมาก', 'ยากมาก')}</div>
          <div class="fbRow"><span>สนุกแค่ไหน</span>${scale('enjoyment', 'สนุกแค่ไหน', 'ไม่สนุกเลย', 'สนุกมาก')}</div>
          <div class="fbRow"><span>ส่วนไหนยากที่สุด</span><div class="scale" data-k="hardest" role="group" aria-label="ส่วนไหนยากที่สุด">${parts.map(k =>
            `<button data-v="${k}" aria-pressed="false">${PART_NAME[k]}</button>`).join('')}</div></div></div>`,
      read:() => ({ difficulty:num('difficulty'), enjoyment:num('enjoyment'), hardest:ans.hardest ? PART_NAME[ans.hardest] : '' }) },
    { html:`<div class="fb type">
          <div class="fbRow"><label for="fbQ">ยังสงสัยอะไรอยู่ไหม</label><textarea id="fbQ" maxlength="300" placeholder="ส่วนที่ยังไม่เข้าใจ หรือสิ่งที่อยากถาม (ไม่บังคับ)"></textarea></div>
          <div class="fbRow"><label for="fbC">คิดยังไงกับเกมนี้</label><textarea id="fbC" maxlength="500" placeholder="คอมเมนต์มาได้เต็มที่เลยน้า พวกเรายินดีน้อมรับ และจะนำทุก ๆ คำแนะนำไปพัฒนาต่อนะ&#10;ขอบคุณครับ/ค่ะ"></textarea></div></div>`,
      read:() => ({ question:$('fbQ').value.trim(), comment:$('fbC').value.trim() }) }
  ];
  return new Promise(res => {
    const kept = {};                                   // answers from the pages left with ต่อไป
    const done = row => { track.feedback(row); res(); };
    const show = i => {
      const P = pages[i], last = i === pages.length - 1;
      overlay(`<h2>ก่อนดูสรุป ช่วยตอบสั้นๆ หน่อยนะ</h2>${P.html}
        <div class="startRow"><button class="btnDark" id="fbNext">${last ? 'ส่ง แล้วดูสรุป' : 'ต่อไป'}</button><button class="btnGhost" id="fbSkip">ข้าม</button></div>`);
      $('overlay').querySelectorAll('.scale').forEach(g => g.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        ans[g.dataset.k] = b.dataset.v;
      }));
      $('fbNext').onclick = () => { Object.assign(kept, P.read()); if (last) done({ ...kept, skipped:false }); else show(i + 1); };
      $('fbSkip').onclick = () => done(Object.values(kept).some(v => v !== '') ? { ...kept, skipped:false } : { skipped:true });
    };
    show(0);
  });
}

const STEPS = { ch1:chapter1, basicsLong, basics, lesson, fric:frictionLevel, fricLesson:frictionLesson, sandbox, bonus, end:ending };
async function run(list, entry = 'replay', o = {}){
  CUT.stop(); overlay(null); waiters = {}; endLevel(); runId++; snd.hush();
  DBG.title = !!o.title;                       // the debug mode replays a part the way it was opened
  const th = $('thumb'); if (th) th.remove();
  if (o.resume){                               // back into an earlier level from the back view (tracking was armed there)
    rewinding = true; playQueued = !!o.play; track.keepArm = true;
  } else { clearLines(); track.begin(entry); }
  $('backBtn').hidden = lines.length < 2;
  for (const [n, k] of list.entries()){
    if (skipStep(k) && !o.title) continue;
    const quiet = ['basicsLong', 'basics', 'lesson', 'fricLesson'].includes(k);
    if (DBG.part) DBG.part(k);
    stepNow = k; snd.part(); snd.music(k === 'end' ? 'title' : quiet ? 'lesson' : 'play', quiet ? 0.6 : 1);
    track.enter(k);
    await STEPS[k](n === 0 ? o : {});
    track.leave(true);
    if (!o.title) track.saveProgress(nextStep(k));   // ปูพื้นฐานแบบเต็ม from the title screen leaves เล่นต่อ as it was
  }
}

      <label>ชั้น <input id="whoRoom" maxlength="12" autocomplete="off" placeholder="เช่น ม.4/2"></label>
    </div>
    <div class="whoHint" id="whoHint" aria-live="polite"></div>
    <div class="startRow"><button class="btnDark" id="start">เริ่มเล่น</button><button class="btnGhost btnBasics" id="basicsLong">ปูพื้นฐาน</button></div>
    <button class="btnGhost" id="resume" hidden></button>
    <div class="chapters"><button class="more" id="chapToggle" aria-controls="chapList"></button>
      <div class="list" id="chapList">${FULL_RUN.filter(k => !['end', 'basics', 'basicsLong'].includes(k)).map(k => `<button data-from="${k}">${PART_NAME[k]}</button>`).join('')}</div></div>`, 'ts');
  // The chapter list starts folded away, so a new player sees one way in. It is not opened for a device with
  // saved progress: on a shared computer that would be every student after the first, and เล่นต่อ covers them.
  // The cast shrinks (--k) just enough for everything to fit in 720px: with a long เล่นต่อ and the list open there is
  // less room for it.
  const fitTitle = () => {
    const o = $('overlay'); if (!o.classList.contains('ts')) return;
    o.style.removeProperty('--k');
    const k = parseFloat(getComputedStyle(o).getPropertyValue('--k')), over = o.scrollHeight - o.clientHeight;
    if (over > 0) o.style.setProperty('--k', Math.max(0.35, k - (over + 4)/192).toFixed(3));
  };
  const setChapters = open => {
    $('chapList').hidden = !open; $('overlay').classList.toggle('open', open);
    $('chapToggle').setAttribute('aria-expanded', open);
    $('chapToggle').textContent = open ? 'เลือกบท ▴' : 'เลือกบท ▾';
    fitTitle();
  };
  $('chapToggle').onclick = () => setChapters($('chapList').hidden);
  setChapters(false);
  // The boxes start empty even when someone has played on this device before: on a shared computer the
  // next student would otherwise play, and be logged, under the previous student's name. The last player
  // can still carry on with the เล่นต่อ button, which says whose progress it is.
  const nameEl = $('whoName'), roomEl = $('whoRoom'), last = track.student;
  const clean = s => s.replace(/\s+/g, ' ').trim();
  const who = () => ({ name:clean(nameEl.value), room:clean(roomEl.value) });
  const NOTE = 'เกมนี้บันทึกชื่อ ชั้น และการเล่นของคุณ เพื่อใช้ในวิชาเรียนและปรับปรุงเกม · ใช้ชื่อเล่นแทนชื่อจริงได้';
  const hint = msg => { const h = $('whoHint'); h.textContent = msg || NOTE; h.classList.toggle('note', !msg); };
  const short = t => t.length > 18 ? t.slice(0, 17) + '…' : t;
  let resumeAs = null;                      // whose saved progress the เล่นต่อ button continues
  const showResume = () => {
    const w = who(), b = $('resume'), typing = !!(w.name || w.room);
    const st = typing ? w : last, p = track.progressOf(st);
    resumeAs = p && p.next && p.next !== 'ch1' ? st : null;
    b.hidden = !resumeAs;
    if (resumeAs) b.textContent = typing ? `เล่นต่อ: ${PART_NAME[p.next]}`
      : `เล่นต่อของ ${short(st.name)} (${short(st.room)}): ${PART_NAME[p.next]}`;
    fitTitle();
  };
  [nameEl, roomEl].forEach(el => el.addEventListener('input', () => {
    el.classList.remove('err'); hint(''); showResume();
  }));
  hint(''); showResume();
  document.fonts.ready.then(fitTitle);
  // title: ปูพื้นฐานแบบเต็ม on its own (the ปูพื้นฐาน button), after the same name and class check as เริ่มเล่น
  const go = (from, entry, as, title) => {
    const w = as || who();
    nameEl.classList.toggle('err', !w.name); roomEl.classList.toggle('err', !w.room);
    if (!w.name || !w.room){
      hint('กรอกชื่อและชั้นก่อนเริ่มเล่นนะ');
      (w.name ? roomEl : nameEl).focus();
      return;
    }
    track.student = w; store.set('student', w);
    snd.fx('start');
    if (title) run(['basicsLong'], entry, { title:true });
    else run(FULL_RUN.slice(FULL_RUN.indexOf(from)), entry);
  };

  $('basicsLong').onclick = () => go('basicsLong', 'start:basicsLong', null, true);
  // Enter does what เริ่มเล่น does; after a name with no class yet, it moves on to the class box.
  // stopPropagation: the same key press must not also reach the page's handler and skip the first line.
  [nameEl, roomEl].forEach(el => el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.repeat) return;
    e.preventDefault(); e.stopPropagation();

    else go('ch1', 'start');

  $('resume').onclick = () => {
    const st = resumeAs, p = track.progressOf(st);
    if (!p || !p.next) return;
    Object.assign(memo, p.memo || {});      // the lessons reuse the student's own numbers from earlier levels
    go(p.next, 'resume:' + p.next, st);
  };
  $('overlay').querySelectorAll('[data-from]').forEach(b => b.onclick = () => go(b.dataset.from, b.dataset.from === 'ch1' ? 'start' : 'skip:' + b.dataset.from));

}

ึ่งหน่วยเวลา ไม่บอกทิศ"]],["S1-04","ความเร่ง",[["yuan","“ใบล่างความเร็วไม่คงตัว แต่เพิ่มขึ้น 1 m/s ทุก 1 วินาที ความเร็วที่เปลี่ยนไปในหนึ่งหน่วยเวลาแบบนี้เรียกว่าความเร่ง ใบล่างจึงมีความเร่งคงตัว 1 m/s²”",""]],["นิยาม · ความเร่ง (a) · ความเร็วที่เปลี่ยนไปในหนึ่งหน่วยเวลา · a = Δv/Δt"]],["S1-05","สามตัวนี้ต่อกันเป็นทอด",[["yuan","“สังเกตว่านิยามสองข้อนี้หน้าตาเหมือนกันเลย ความเร็วบอกว่าตำแหน่งเปลี่ยนไปเท่าไหร่ใน 1 วินาที ส่วนความเร่งบอกว่าความเร็วเปลี่ยนไปเท่าไหร่ใน 1 วินาที สามตัวนี้จึงต่อกันเป็นทอดๆ”",""]],[]],["S1-06","จากความเร่งไปหาความเร็ว",[["yuan","“ความเร่ง 1 m/s² แปลว่าทุก 1 วินาทีความเร็วเพิ่ม 1 m/s กล่องเริ่มจากนิ่ง ผ่านไป 1 วินาทีจึงเร็ว 1 m/s ผ่านไป 2 วินาทีเร็ว 2 m/s กราฟความเร็วกับเวลาเลยเป็นเส้นตรง”","จังหวะ a"],["yuan","“ความชันของกราฟ v–t คือ Δv/Δt ซึ่งก็คือความเร่งนั่นเอง ส่วนพื้นที่ใต้กราฟ a–t จาก 0 ถึง 2 วินาที คือ 1 × 2 = 2 m/s เท่ากับความเร็วที่เปลี่ยนไปในช่วงนั้นพอดี”","จังหวะ b"]],[]],["S1-07","จากความเร็วไปหาตำแหน่ง",[["yuan","“ทีนี้ดูตำแหน่งบ้าง เพราะความเร็วเพิ่มขึ้นเรื่อยๆ แต่ละวินาทีกล่องจึงไปได้ไกลกว่าวินาทีก่อน กราฟตำแหน่งกับเวลาเลยไม่เป็นเส้นตรง แต่โค้งชันขึ้นเรื่อยๆ”","จังหวะ a"],["yuan","“ความชันของกราฟ x–t คือ Δx/Δt ซึ่งก็คือความเร็ว ยิ่งชันยิ่งเร็ว ส่วนพื้นที่ใต้กราฟ v–t จาก 0 ถึง 2 วินาที คือ ½ × 2 × 2 = 2 m เท่ากับการกระจัดของกล่องพอดี”","จังหวะ b"]],[]],["S1-08","สรุปฉาก 1",[["yuan","“สรุปก็คือ ความชันพาเราจากตำแหน่งไปหาความเร็ว และจากความเร็วไปหาความเร่ง ส่วนพื้นที่ใต้กราฟพาย้อนกลับจากความเร่งมาหาความเร็วและตำแหน่ง แล้วอะไรล่ะที่ทำให้ความเร็วเปลี่ยนได้”",""]],[]],["S2-01","แรงคืออะไร",[["yuan","“คำตอบคือแรง แรงก็คือการผลักหรือดึงนั่นเอง เราวาดแรงเป็นลูกศร ยิ่งออกแรงมาก ลูกศรยิ่งยาว และหัวลูกศรชี้ไปทางที่ออกแรง แรงมีหน่วยเป็นนิวตัน (N)”",""]],["นิยาม · แรง (F) · สิ่งที่ทำให้สภาพการเคลื่อนที่ของวัตถุเปลี่ยน หน่วยนิวตัน (N)"]],["S2-02","แรงผลัก F",[["yuan","“ลองดูตอนกล่องถูกผลักค้างไว้ด้วยแรงเท่าเดิม ลูกศรแรงสีแดงยาวเท่าเดิม แต่ลูกศรความเร็วสีน้ำเงินยาวขึ้นเรื่อยๆ แปลว่าแรงผลักทำให้กล่องมีความเร่ง”",""]],[]],["S2-03","น้ำหนัก mg",[["yuan","“แรงบางแรงไม่ต้องมีใครผลัก โลกดึงของทุกชิ้นลงหาพื้นตลอดเวลา แรงนี้คือน้ำหนัก มีขนาดเท่ากับ mg กล่องทั้งสองฝั่งจึงมีลูกศร mg ชี้ลงเหมือนกัน”",""]],["นิยาม · น้ำหนัก (mg) · แรงที่โลกดึงดูดวัตถุ"]],["S2-04","แรงแนวฉาก N",[["yuan","“ฝั่งซ้ายไม่มีพื้นรองรับ มีแต่ mg ดึงลงอย่างเดียว กล่องเลยร่วงลงไปเรื่อยๆ และเร็วขึ้นเรื่อยๆ ด้วย”","จังหวะ a"],["yuan","“ฝั่งขวามีพื้น พื้นดันกล่องขึ้นในแนวตั้งฉากกับพื้น แรงนี้คือแรงแนวฉาก N ซึ่งหักล้างกับ mg พอดี กล่องจึงวางอยู่นิ่งๆ ได้”","จังหวะ b"]],["นิยาม · แรงแนวฉาก (N) · แรงที่ผิวสัมผัสดันวัตถุ ตั้งฉากกับผิว"]],["S2-05","แรงเสียดทาน f",[["yuan","“แรงสุดท้ายคือแรงเสียดทาน f พอมือหลุดจากกล่อง กล่องที่ไถลอยู่บนพื้นฝืดจะช้าลงจนหยุด เพราะพื้นออกแรงสวนทางกับการไถล เดี๋ยวตอนท้ายเราจะกลับมาดูแรงนี้อีกที”",""]],["นิยาม · แรงเสียดทาน (f) · แรงที่ผิวสัมผัสต้านการเคลื่อนที่ ขนานกับผิว"]],["S3-01","กฎข้อ 1",[["yuan","“นิวตันสรุปเรื่องแรงกับการเคลื่อนที่ไว้ 3 ข้อ ข้อ 1 ดูกล่องที่ลอยนิ่งอยู่สองใบนี้ ใบซ้ายไม่มีแรงมากระทำ มันก็นิ่งอยู่อย่างนั้น ใบขวาถูกผลัก ความเร็วจึงเปลี่ยน”","จังหวะ a"],["yuan","“พอแรงผลักหมดไป กล่องใบขวาไม่ได้หยุดนะ มันไปต่อด้วยความเร็วคงตัว เพราะไม่มีแรงมากระทำแล้ว สมบัติที่วัตถุรักษาสภาพการเคลื่อนที่เดิมไว้แบบนี้เรียกว่าความเฉื่อย”","จังหวะ b"]],["กฎข้อที่ 1 · เมื่อไม่มีแรงมากระทำ วัตถุจะอยู่นิ่งหรือเคลื่อนที่ด้วยความเร็วคงตัวต่อไป","นิยาม · ความเฉื่อย · สมบัติของวัตถุที่ต้านการเปลี่ยนสภาพการเคลื่อนที่"]],["S3-02","แรงลัพธ์",[["yuan","“บนโลกกล่องใบเดียวโดนหลายแรงพร้อมกัน ถ้าเอาทุกแรงมารวมกันจะได้แรงลัพธ์ เขียนว่า ΣF ตอนกล่องถูกผลักบนน้ำแข็ง N กับ mg หักล้างกัน แรงลัพธ์จึงเหลือแค่แรงผลัก F”",""]],["นิยาม · แรงลัพธ์ (ΣF) · ผลรวมของแรงทุกแรงที่กระทำต่อวัตถุ"]],["S3-03","กฎข้อ 2",[["yuan","“ข้อ 2 ถ้าแรงลัพธ์ไม่เป็นศูนย์ วัตถุจะมีความเร่งไปทางเดียวกับแรงลัพธ์ ผลักแรงขึ้นเป็น 2 เท่า ลูกศรยาวขึ้น 2 เท่า ความเร่งก็เพิ่มเป็น 2 เท่า”","จังหวะ a"],["yuan","“แต่ถ้าแรงเท่าเดิมแล้วมวลมากขึ้นเป็น 2 เท่า ความเร่งจะเหลือแค่ครึ่งเดียว ของที่มวลมากจึงเร่งยากกว่า”","จังหวะ b"],["yuan","“เขียนรวมกันได้ว่า ΣF = ma กล่องมวล 40 kg ถูกผลักด้วยแรง 40 N จึงมีความเร่ง a = 40 ÷ 40 = 1 m/s² ส่วนถ้าแรงลัพธ์เป็นศูนย์ ความเร่งก็เป็นศูนย์ด้วย”","จังหวะ c"]],["นิยาม · มวล (m) · ปริมาณที่บอกว่าวัตถุมีความเฉื่อยมากแค่ไหน หน่วยกิโลกรัม (kg)","กฎข้อที่ 2 · ความเร่งแปรผันตรงกับแรงลัพธ์ และแปรผกผันกับมวล · ΣF = ma"]],["S3-04","จากแรงถึงการเคลื่อนที่",[["yuan","“พอรู้ความเร่ง ก็บอกได้ว่าความเร็วจะเป็นเท่าไหร่ กล่องเริ่มจากนิ่ง ความเร็วเพิ่มวินาทีละ 1 m/s ผ่านไป 4 วินาทีจึงเร็ว 4 m/s ตรงกับสูตร v = u + at”",""]],[]],["S3-05","กฎข้อ 3",[["yuan","“ข้อ 3 แรงเกิดเป็นคู่เสมอ ดูตอนกล่องไถลไปชนที่กั้น กล่องดันที่กั้น ในจังหวะเดียวกันที่กั้นก็ดันกล่องกลับด้วยแรงขนาดเท่ากันในทิศตรงข้าม กล่องจึงหยุด”","จังหวะ a"],["yuan","“แรงสองแรงนี้เรียกว่าแรงคู่กิริยา-ปฏิกิริยา สังเกตว่ามันกระทำกับวัตถุคนละชิ้น ลูกศรหนึ่งอยู่บนที่กั้น อีกลูกศรอยู่บนกล่อง จึงเอามาหักล้างกันไม่ได้”","จังหวะ b"]],["กฎข้อที่ 3 · แรงที่วัตถุสองก้อนกระทำต่อกัน มีขนาดเท่ากัน ทิศตรงข้าม"]],["S4-01","ไถลจนหยุด",[["yuan","“กลับมาที่กล่องบนพื้นฝืดอีกที มือหลุดจากกล่องตอนเร็ว 4 m/s ดูภาพกล่องที่ทิ้งไว้สิ ระยะห่างสั้นลงเรื่อยๆ กล่องกำลังช้าลง แล้วก็หยุดนิ่ง”",""]],[]],["S4-02","ระหว่างไถล: แผนภาพวัตถุอิสระ",[["yuan","“หยุดภาพตอนกล่องกำลังไถลไว้ก่อน N กับ mg หักล้างกัน แรงลัพธ์จึงเหลือแค่แรงเสียดทาน f ที่ชี้สวนทางการเคลื่อนที่ ความเร่งเลยชี้สวนทางด้วย กล่องจึงช้าลง ตามกฎข้อ 2”",""]],[]],["S4-03","หยุดแล้ว",[["yuan","“พอกล่องหยุด พื้นก็ไม่มีการไถลให้ต้านอีก แรงเสียดทานจึงหายไป เหลือแค่ N กับ mg ที่หักล้างกัน แรงลัพธ์เป็นศูนย์ ความเร่งจึงเป็นศูนย์ กล่องที่หยุดแล้วก็อยู่นิ่งต่อไป”",""]],[]],["S4-04","แล้วบนลานน้ำแข็งล่ะ",[["yuan","“แล้วถ้าเปลี่ยนพื้นฝืดเป็นลานน้ำแข็งที่แทบไม่มีแรงเสียดทานเลยล่ะ กล่องที่ถูกผลักแล้วปล่อยมือจะเป็นยังไง คำตอบรออยู่ที่ลานน้ำแข็งของริวกะ”",""]],[]],["OUT-1","จบ (เข้ามาจากหน้าแรก)",[["yuan","“จบปูพื้นฐานแล้ว พร้อมเมื่อไหร่ก็ไปช่วยริวกะกันเลย”",""]],["เริ่มเล่น · ดูอีกรอบ · กลับหน้าหลัก"]],["OUT-2","จบ (เข้ามาจากด่านที่ 1)",[["yuan","“ครบแล้ว ทีนี้มาทบทวนสั้นๆ อีกรอบ แล้วกลับไปดูกล่องของริวกะกัน”",""]],[]]]],[2,[["2-01","แรงคืออะไร",[["yuan","“ลองกดปุ่มบนกระดานดู แล้วสังเกตว่าลูกศรเปลี่ยนไปยังไง”",""]],["แรงคืออะไร","แรง = การผลักหรือดึง ที่ทำให้ความเร็วของวัตถุเปลี่ยน","ลูกศรแทนแรง: ยิ่งยาว แรงยิ่งมาก (หน่วย นิวตัน, N) หัวลูกศรชี้ทิศของแรง","ผลักเบา · ผลักแรง · ผลักไปทางซ้าย"]],["2-02","แรงมีแบบไหนบ้าง",[["yuan","“กล่องของริวกะโดนแรงได้หลายแบบ ลองกดการ์ดทีละใบดู”",""]],["แรงที่จะเจอในเกม","น้ำหนัก mg: โลกดึงกล่องลง","แรงแนวฉาก N: พื้นดันกล่องขึ้น","แรงผลัก F: มือดันกล่อง","แรงเสียดทาน f: พื้นฝืดต้านการไถล"]],["2-03","กฎ 3 ข้อของนิวตัน",[["yuan","“ยังไม่ต้องจำนะ เดี๋ยวจะเจอทีละข้อในเกม”",""]],["กฎการเคลื่อนที่ 3 ข้อของนิวตัน","ข้อ 1 · กล่องบนน้ำแข็งไปต่อเอง: แรงลัพธ์เป็นศูนย์ ความเร็วไม่เปลี่ยน","ข้อ 2 · ผลักแล้วเร็วขึ้น: แรงลัพธ์ทำให้เกิดความเร่ง","ข้อ 3 · กล่องชนที่กั้น: ที่กั้นดันกลับด้วยแรงเท่ากัน"]],["2-04","กลับเข้าเรื่อง",[["yuan","“ทีนี้กลับไปดูกล่องของริวกะกัน”",""]],[]]]],[3,[["3-01","เหมือนจะมีอะไรหายไป",[["ryuka","“เหมือนจะมีอะไรหายไปสักอย่างนะ ?”",""],["ryuka","“ช่วยเค้าก่อน👉👈”",""]],[]],["3-02","ตอบคำถามของริวกะทันที",[["yuan","“ที่หายไปคือแรงที่จะมาหยุดกล่อง บนน้ำแข็งไม่มีอะไรมาต้านมันเลย”",""],["yuan","“ตอนแรกนายทายว่ากล่องจะหยุด”","ทายไว้ว่าหยุด (ตอบ ก หรือ ข ที่ 1-02)"],["yuan","ถ้าจริงแบบนั้น กล่องคงหยุดไปตั้งนานแล้ว นี่แหละจุดที่เข้าใจผิด มาแยกดูทีละแรงกัน","ทายไว้ว่าหยุด (ตอบ ก หรือ ข ที่ 1-02)"],["yuan","“นายทายไว้ถูกแล้วว่ากล่องจะไปต่อ มาแยกดูทีละแรงกันว่าทำไม”","ทายถูก (ตอบ ค ที่ 1-02)"],["yuan","“มาแยกดูทีละแรงกัน ว่าตอนนี้มีแรงอะไรกระทำต่อกล่องบ้าง”","ไม่แน่ใจ (ตอบ ง ที่ 1-02) หรือเข้าบทนี้จากเมนูเลือกบท จึงไม่มีคำทาย"]],[]],["3-03","เลือกแรงที่กระทำต่อกล่อง",[["yuan","“บนน้ำแข็งแทบไม่มีแรงเสียดทาน นี่แหละสิ่งที่หายไป”","เลือก แรงเสียดทาน f"],["yuan","“ครบแล้ว ตอนผลักมี 3 แรง คือน้ำหนัก แรงที่พื้นดันขึ้น และแรงผลัก”","เลือกครบ 3 แรงที่ถูก"]],["แรงที่กระทำต่อกล่อง","ตอนที่ก้านกำลังผลัก มีแรงอะไรกระทำต่อกล่องบ้าง ? (เลือกทุกข้อที่มี)","น้ำหนัก mg · แรงที่พื้นดันขึ้น N · แรงผลัก F · แรงเสียดทาน f"]],["3-04","นิยามแรงลัพธ์",[["yuan","“เอาแรงทั้ง 3 แรงนี้มารวมกัน เรียกว่าแรงลัพธ์ เขียนย่ ลือครึ่งเดียว","ง. ไม่แน่ใจ"]],["3-09","ทำไมยังเคลื่อนที่ต่อได้",[["ryuka","“ในเมื่อไม่มีใครผลักมันแล้ว ทำไมกล่องยังเคลื่อนที่ต่อไปได้ล่ะ!?”",""],["yuan","“วัตถุไม่ต้องมีแรงมาคอยดันถึงจะเคลื่อนที่ต่อได้ และแรงผลักก็ไม่ได้ถูกเก็บไว้ในกล่องด้วย ก้านหลุดเมื่อไหร่ แรงก็หมดเมื่อนั้น”",""],["yuan","“สิ่งที่แรงทิ้งไว้คือความเร็วที่เปลี่ยนไปแล้ว พอ ΣF = 0 ก็ไม่มีอะไรมาเปลี่ยนความเร็วนั้นอีก กล่องเลยไปต่อด้วยความเร็วคงที่ นี่แหละความเฉื่อย”",""]],[]],["3-10","ตำแหน่ง: จากภาพกล่องสู่กราฟ x–t",[["yuan","“ตำแหน่ง x คือกล่องอยู่ห่างจากจุดเริ่มเท่าไหร่ อย่างตอน 1.2 s กล่องอยู่ที่ x = 1.6 m”",""],["yuan","“กราฟ x–t ก็คือภาพเมื่อกี้นี่แหละ แค่เอาตำแหน่งของกล่องแต่ละภาพมาเรียงตามเวลา ลองแตะกล่องทีละกล่องดู”",""],["yuan","“ตอนผลัก แต่ละจุดสูงกว่าจุดก่อนหน้ามากขึ้นเรื่อยๆ เส้นเลยโค้งชันขึ้น หลังก้านหลุด แต่ละจุดสูงขึ้นเท่ากันทุกช่วง เส้นเลยเป็นเส้นตรง”",""],["yuan","“จำไว้ง่ายๆ เส้นยิ่งชัน กล่องยิ่งเร็ว”",""]],["ตำแหน่ง x = กล่องอยู่ห่างจากจุดเริ่มเท่าไหร่ วัดไปตามพื้น หน่วยเป็นเมตร (m)","กราฟ x–t","แกนตั้งเขียนว่า การกระจัด = ตำแหน่งที่เปลี่ยนไป · เราวัด x จากจุดเริ่ม x จึงเป็นการกระจัดจากจุดเริ่มด้วย"]],["3-11","ความเร็ว: ความชันของกราฟ x–t",[["yuan","“ความเร็วคือตำแหน่งเปลี่ยนไปเท่าไหร่ในหนึ่งวินาที เขียนว่า v = Δx/Δt (Δ อ่านว่า เดลตา แปลว่าส่วนที่เปลี่ยนไป) ลองหาความเร็วหลังก้านหลุดดู”",""],["yuan","“นายเอา 0.8 ไปคูณ 0.4 ความเร็วคือตำแหน่งที่เปลี่ยนไปหารด้วยเวลาที่ใช้ ลองหารดูใหม่”","กรอกผิด (เช่น 0.32)"],["yuan","“ใช่ 2 m/s เท่ากันทุกช่วง กราฟ v–t ช่วงนี้เลยเป็นเส้นแนวนอน”","กรอกถูก (2)"],["yuan","“ส่วนตอนผลัก แต่ละช่วงไปได้ไกลขึ้นเรื่อยๆ ความเร็วเลยค่อยๆ เพิ่มจาก 0 ขึ้นไปถึง 2”",""]],["ความเร็ว v = ตำแหน่งที่เปลี่ยนไปใน 1 วินาที v = Δx / Δt หน่วย m/s · เครื่องหมาย + / − บอกทิศ","กราฟ x–t, v–t","หลังก้านหลุด กล่องไปได้ 0.8 m ทุก 0.4 s v = Δx / Δt = 0.8 ÷ 0.4 = [ ] m/s"]],["3-12","ความเร่ง: ความชันของกราฟ v–t",[["yuan","“ความเร่งคือความเร็วเปลี่ยนไปเท่าไหร่ในหนึ่งวินาที a = Δv/Δt ก็คือความชันของกราฟ v–t นั่นเอง ลองหาดูว่าตอนผลักเท่าไหร่”",""],["yuan","“นายเอา 2 ไปคูณ 0.8 ความเร่งค ุด แรงลัพธ์เป็น 0 ความเร่งก็เป็น 0 สังเกตไหมว่าแรงลัพธ์เปลี่ยนเมื่อไหร่ ความเร่งก็เปลี่ยนตามทันที”",""]],[]],["4-05","สรุปสิ่งที่เห็น + ตรวจความเข้าใจ",[["yuan","“50 N ไปได้ 1.02 m, 100 N ไปได้ 2.04 m, 150 N ไปได้ 3.06 m ผลักแรงเป็น 2 เท่า ก็ไปได้ไกลเป็น 2 เท่า”",""],["yuan","“ตรงกับที่นายทายไว้เลย”","ทายไว้ ข ที่ 4-02"],["yuan","“ต่างจากที่นายทายไว้ใช่ไหม ไม่เป็นไร ตัวเลขบนพื้นบอกเราแล้ว”","ทายไว้ ก หรือ ค ที่ 4-02"],["yuan","“ตอนนี้รู้แล้วนะ ดูจากตัวเลขบนพื้นได้เลย”","ทายไว้ ง (ไม่แน่ใจ)"],["yuan","“ทีนี้ลองตอบอีกข้อบนกระดาน”",""],["yuan","“ใช่ ตอนไถลเหลือแค่แรงเสียดทาน a = −f/m = −0.98 m/s² ทุกรอบ ไม่ว่าจะผลักแรงแค่ไหน”","ตอบ ข (ถูก)"],["yuan","“ดูแถบสมการตอนไถลอีกทีนะ ตอนนั้นไม่มีแรงผลักแล้ว เหลือแค่แรงเสียดทาน 39.24 N เท่ากันทุกรอบ ความเร่งจึงเป็น −0.98 m/s² ทุกรอบ ผลักแรงกว่าแค่ทำให้กล่องเร็วกว่าตอนมือหลุด เลยไถลได้ไกลกว่า”","ตอบ ก หรือ ค"]],["ตรวจความเข้าใจ","ตอนกล่องไถลหลังมือหลุด ความเร่งขึ้นกับแรงที่ผลักไหม ?","ก. ขึ้น ผลักแรงกว่าก็ช้าลงเร็วกว่า","ข. ไม่ขึ้น ช้าลงด้วยความเร่งเท่ากันทุกรอบ","ค. ไม่แน่ใจ"]],["4-06","คำนวณ: ตั้งสมการก่อนผลัก",[["yuan","“รอบนี้ไม่มีปุ่มให้กดลองแล้ว ต้องคิดแรงผลักให้ได้ก่อนผลัก มาตั้งสมการกันบนกระดานทีละช่อง”",""],["yuan","“4.0 m คือระยะทั้งหมด แต่ 0.8 m แรกนายยังผลักอยู่ ที่กล่องต้องไถลเองคือ 4.0 − 0.8”","ช่องที่ 1 ผิด (เช่น 4.0)"],["yuan","“ใช่ 4.0 − 0.8 = 3.2 m ช่วงนี้มีแต่แรงเสียดทานคอยเบรก”","ช่องที่ 1 ถูก (3.2)"],["yuan","“จากสมการได้ F − f = 4f นายลืมบวก f กลับเข้าไปหรือเปล่า”","ช่องที่ 2 ผิด (เช่น 156.96 คือ 4f)"],["yuan","“ใช่ F − f = 4f ดังนั้น F = 5f = 5 × 39.24 ≈ 196 N กดผลักเพื่อพิสูจน์เลย”","ช่องที่ 2 ถูก (196)"]],["ตั้งสมการก่อนผลัก","จุดจอดอยู่ห่างจุดเริ่ม 4.0 m นายผลักได้แค่ 0.8 m แรก","หลังมือหลุด กล่องต้องไถลต่ออีก [ ] m","ช่วงผลัก: v² = 2 × (F − f)/m × 0.8","ช่วงไถล: v² = 2 × f/m × 3.2","ความเร็วตอนมือหลุดเป็นค่าเดียวกัน → (F − f) × 0.8 = f × 3.2","F = [ ] N"]],["4-07","ผลักตามที่คำนวณ",[["ryuka","“คราวนี้ต้องจอดหน้าธงให้ได้นะ”",""],["ryuka","“ไม่ผลักเลย ก็ไม่ขยับสิ”","ผลัก 0 N"],["ryuka","“ผลักตั้ง 30 N แต่กล่องไม่ขยับเลย!”","ผลักไม่เกิน 39.24 N (เช่น 30 N)"],["yuan","“แรงผลัก 30 N ยังไม่มากกว่าแรงเสียดทาน 39.24 N พื้นเลยออกแรงเสียดทานต้านเท่ากับแรงผลักพอดี ΣF = 0 กล่องจึงนิ่งอยู่”","ผลักไม่เกิน 39.24 N (เช่น 30 N)"],["ryuka","“ไถลเลยธงไปไกลมาก”","พลาด: ไถลเลยธงจนหลุดฉาก"],["ryuka","“จอดก่อนถึงจุดจอด 0.35 m”","พลาด: จอดก่อนถึง (เช่น 179 N)"],["ryuka","“จอดเลยจุดจอดไป 0.42 m”","พลาด: จอดเลย (เช่น 217 N)"],["ryuka","“ลองกลับไปดูสมการบนกระดานอีกทีนะ”","หลังพลาดทุกแบบ"]],[]],["4-08","พลาด 2 ครั้ง: ตัวอย่างที่ทำให้ดู",[["yuan","“จอดเลยจุดจอดไป 0.42 m ลองลดแรงผลัก ใบ้ให้: หลังปล่อยมือ กล่องต้องไถลต่ออีก 3.2 m และช้าลงด้วย a = f/m = 0.981 m/s² ตอนปล่อยมือจึงควรมีความเร็ว v = √(2 × 0.981 × 3.2) ≈ 2.5 m/s ลองดูค่า v ในแผงด้านขวา”",""],["yuan","“จอดก่อนถึงจุดจอด 0.35 m ลองเพิ่มแรงผลัก ใบ้ให้: ช่วงผลัก (F − f)/m × 0.8 ต้องเท่ากับช่วงไถล f/m × 3.2 โดย f = 39.24 N ลองแก้สมการหา F ดูสิ”",""],["yuan","“ดูตัวอย่างนี้ก่อน: ถ้าจุดจอดอยู่ห่างแค่ 2.4 m ผลัก 0.8 m แล้วไถลต่ออีก 1.6 m ได้ (F − f) × 0.8 = f × 1.6 → F − f = 2f → F = 3f = 117.72 N ทีนี้ลองทำแบบเดียวกันกับ 4.0 m”","พลาดครั้งที่ 2"],["yuan","“จอดเลยจุดจอดไป 0.42 m ตัด m ออกจาก (F − f) × 0.8 = f × 3.2 จะได้ F = 5f = 5 × 39.24 ≈ 196 N”","พลาดครั้งที่ 5 ขึ้นไป"]],["ดูตัวอย่างก่อน","ถ้าจุดจอดอยู่ห่างจุดเริ่มแค่ 2.4 m","ผลัก 0.8 m แรก แล้วไถลต่ออีก 2.4 − 0.8 = 1.6 m","(F − f) × 0.8 = f × 1.6","F − f = 2f → F = 3f = 117.72 N","ทีนี้ลองทำแบบเดียวกันกับ 4.0 m"]],["4-09","สำเร็จ",[["yuan","“เยี่ยม! ผลัก 196 N กล่องค่อยๆ ช้าลงแล้วจอดคลาดจากจุดจอดแค่ 0.00 m”",""]],[]]]],[5,[["5-01","แรงเสียดทาน f = μmg",[["yuan","“แรงเสียดทานเกิดจากผิวกล่องไถลถูกับพื้น ขนาด f = μN และบนพื้นราบ N = mg จึงได้ f = μmg”",""]],["แรงเสียดทาน","f = μN = μmg","= 0.10 × 40 × 9.81 = 39.24 N","เกิดจากผิวกล่องไถลถูกับพื้น มีทิศตรงข้ามกับการเคลื่อนที่ของกล่องเทียบกับพื้น","จากแรงเสียดทานจลน์ f = μN และ N = mg ในแกน y (ΣFy = 0)"]],["5-02","แรงลัพธ์ในแต่ละช่วง",[["yuan","“ตอนผลัก ต้องออกแรงมากกว่าแรงเสียดทาน แรงลัพธ์ถึงจะชี้ไปข้างหน้า กล่องจึงเร็วขึ้น”",""],["yuan","“พอปล่อยมือ เหลือแค่แรงเสียดทานที่ชี้ถอยหลัง แรงลัพธ์จึงสวนทางการเคลื่อนที่ ความเร็วลดลงวินาทีละ 0.98 m/s จนเหลือ 0”",""],["yuan","“พอกล่องหยุด ผิวไม่ได้ไถลกันแล้ว แรงเสียดทานจลน์ก็หมดไป ΣF = 0 กล่องจึงนิ่งอยู่ตรงนั้น ไม่ได้ถอยหลังกลับ”",""]],["แรงลัพธ์ในแต่ละช่วง","แกน x : ΣFx = ?","ช่วงผลัก: ΣFx = F − f = 196 − 39.24 = 156.76 N a = +3.92 m/s² → เร็วขึ้น","ปล่อยมือ: ΣFx = −f = −39.24 N a = −0.98 m/s² → ช้าลง","หยุดแล้ว: ไม่ไถลแล้ว แรงเสียดทานจลน์หายไป ΣFx = 0 → นิ่งอยู่กับที่","จากการรวมแรงในแกน x: แรงผลักไปข้างหน้า แรงเสียดทานต้านกลับ"]],["5-03","ภาพกล่องทีละช่วงเวลา",[["yuan","“ภาพนี้คือกล่องที่ถ่ายไว้ทุกๆ 0.32 s ตอนผลัก ระยะห่างยาวขึ้นเพราะกล่องเร็วขึ้น พอไถล ระยะห่างสั้นลงเรื่อยๆ เพราะช้าลง จนสุดท้ายกล่องหยุด”",""],["ryuka","“สรุปว่ากล่องหยุดเพราะแรงเสียดทาน ไม่ใช่เพราะเลิกผลัก!”",""]],[]],["5-04","กราฟของรอบที่มีแรงเสียดทาน",[["yuan","“ก่อนดูกราฟ ทายดูก่อนนะ เลือกคำตอบบนกระดานได้เลย”",""],["yuan","“ใช่ ตอนไถลความเร่งคงที่ −0.98 m/s² ความเร็วเลยลดลงเท่ากันทุกวินาที เส้นจึงเอียงลงตรงๆ จนถึง 0”","ตอบ ข (ถูก)"],["yuan","“ดูกราฟนะ แรงเสียดทานคอยเบรกตลอดช่วงไถล ความเร็วเลยลดลงวินาทีละ 0.98 m/s เท่ากันทุกวินาที เส้นจึงเอียงลงตรงๆ จนถึง 0”","ตอบ ก ค หรือ ง"],["yuan","“ลองกดดูกราฟ x–t ด้วย ช่วงไถลเส้นจะค่อยๆ แบนลง เพราะความเร็ว (ความชัน) ลดลงจนเป็น 0 แล้วก็เป็นเส้นแนวนอนตอนหยุด”",""]],["ทายก่อน","ช่วงไถล กราฟ v–t จะเป็นแบบไหน ?","ก. เส้นแนวนอน","ข. เส้นตรงเอียงลงจนถึง 0","ค. ตกลงเป็น 0 ทันที","ง. ไม่แน่ใจ","กราฟการเคลื่อนที่: กราฟ v–t / a–t / x–t"]],["5-05","หาจุดจอดของกล่อง",[["yuan","“ใช้สูตร v² = u² + 2as ทีละช่วง ก็คำนวณได้ก่อนเลยว่ากล่องจะไปจอดตรงไหน ไม่ต้องเดา”",""]],["หาจุดจอดของกล่อง","ใช้ v² = u² + 2as ทีละช่วง","ช่วงผลัก: v² = 0 + 2(3.92)(0.8) → v = 2.50 m/s ตอนปล่อยมือ","ช่วงไถล: 0 = v² − 2(0.98)s → s = 3.20 m","รวม 0.8 + 3.20 = 4.00 m (จุดจอดอยู่ห่างจุดเริ่ม 4.0 m)","จากสมการการเคลื่อนที่เมื่อความเร่งคงที่"]],["5-06","ควิซข้อ 2",[["yuan","ตอบคำถามบนกระดานหน่อย",""],["yuan","ถูกต้อง! แรงลัพธ์คือแรงเสียดทานที่ชี้ถอยหลัง ความเร่งจึงสวนทางกับความเร็ว กล่องเลยช้าลง","ตอบ ข (ถูก)"],["yuan","กล่องกำลังเคลื่อนที่ไปข้างหน้าก็จริง แต่ไม่มีแรงไหนดันไปข้างหน้าแล้ว การเคลื่อนที่ไม่จำเป็นต้องมีแรงในทิศนั้น ลองใหม่นะ","ตอบ ก"],["yuan","ถ้าแรงลัพธ์เป็นศูนย์ ความเร็วจะคงที่ แต่กล่องกำลังช้าลง แปลว่ายังมีแรงลัพธ์อยู่ ลองใหม่นะ","ตอบ ค"],["yuan","แรงเสียดทานจลน์ f = μmg มีขนาดคงที่ ไม่ขึ้นกับความเร็ว และมีทิศตรงข้ามกับการเคลื่อนที่ของกล่อง ลองใหม่นะ","ตอบ ง"]],["ขณะที่กล่องกำลังไถลช้าลงหลังปล่อยมือ แรงลัพธ์ที่กระทำต่อกล่องมีทิศทางใด ?","ก. ไปข้างหน้า ทิศเดียวกับที่กล่องเคลื่อนที่","ข. ถอยหลัง สวนทางกับที่กล่องเคลื่อนที่","ค. เป็นศูนย์ เพราะไม่มีใครผลักแล้ว","ง. เปลี่ยนไปเรื่อยๆ ตามความเร็วของกล่อง"]]]],[6,[["6-01","ตั้งเป้า: พื้นฝืดและกล่องที่หนักขึ้น",[["kay","“คราวนี้ขนของใส่กล่องเพิ่ม แล้วเปลี่ยนเป็นพื้นที่ฝืดกว่าเดิมดีกว่า”",""],["yuan","“ก่อนอื่นมาดูทีละอย่างว่ามวลกับความฝืดของพื้นเปลี่ยนอะไรบ้าง เริ่มที่มวลก่อน”",""],["yuan","“แรงผลักจะตั้งไว้ที่ 130 N เท่ากันทุกรอบ ให้จับตาดูว่ากล่องไถลไปได้ไกลแค่ไหน”",""]],[]],["6-02","ทาย: ถ้ามวลมากขึ้น",[["yuan","“ก่อนลอง ทายก่อนนะ เลือกคำตอบบนกระดานได้เลย”",""],["yuan","“โอเค จำคำตอบไว้ แล้วไปลองผลักดูกัน”","เลือกข้อไหนก็ได้"]],["ทายก่อน","แรงผลักเท่าเดิม พื้นเดิม ถ้ามวลมากขึ้น กล่องจะไปได้…","ก. ไกลขึ้น","ข. ใกล้ลง","ค. เท่าเดิม","ง. ไม่แน่ใจ","แรงผลัก F = 130 N · μ = 0.15 เท่ากันทุกรอบ"]],["6-03","สำรวจที่ 1: มวล",[["ryuka","“ตั้งค่าเสร็จแล้วกดผลักได้เลย”",""],["yuan","“เห็นมั้ย กล่องยิ่งหนัก แรงเสียดทาน f = μmg ก็ยิ่งมาก กล่องเลยไถลได้สั้นลง มวลเป็น 2 เท่า ระยะทางก็เหลือครึ่งเดียว”","ผลักครบทั้ง 3 ค่า"]],[]],["6-04","ทาย: ถ้าพื้นฝืดขึ้น",[["yuan","“คราวนี้เปลี่ยนพื้นแทน มวลกับแรงผลักเท่าเดิม ลองทายก่อนนะ”",""],["yuan","“โอเค จำคำตอบไว้ แล้วไปลองผลักดูกัน”","เลือกข้อไหนก็ได้"]],["ทายก่อน","มวลเท่าเดิม แรงผลักเท่าเดิม ถ้าพื้นฝืดขึ้น (μ มากขึ้น) กล่องจะไปได้…","ก. ไกลขึ้น","ข. ใกล้ลง","ค. เท่าเดิม","ง. ไม่แน่ใจ","แรงผลัก F = 130 N · มวล m = 40 kg เท่ากันทุกรอบ"]],["6-05","สำรวจที่ 2: ความฝืดของพื้น",[["ryuka","“ตั้งค่าเสร็จแล้วกดผลักได้เลย”",""],["yuan","“พื้นยิ่งฝืด แรงเสียดทาน f = μmg ก็ยิ่งมาก กล่องเลยไถลได้สั้นลงเหมือนตอนเพิ่มมวล μ เป็น 2 เท่า ระยะทางก็เหลือครึ่งเดียว”","ผลักครบทั้ง 3 ค่า"]],[]],["6-06","คำนวณ: ตั้งสมการก่อนผลัก",[["yuan","“คราวนี้ไม่มีปุ่มให้เลือกแล้ว m = 60 kg, μ = 0.15 ตั้งสมการบนกระดานก่อน แล้วค่อยใส่แรงผลักที่คิดได้”",""],["yuan","“นายเอา μ คูณ m แล้วลืมคูณ g แรงเสียดทาน f = μmg ต้องคูณ g = 9.81 ด้วย เพราะ mg คือน้ำหนักที่กดลงบนพื้น”","ช่อง f ผิด (เช่น 9)"],["yuan","“ถูก 0.15 × 60 × 9.81 = 88.29 N นี่คือแรงที่พื้นต้านกล่องไว้ตลอดทาง”","ช่อง f ถูก (88.29)"],["yuan","“353.16 N คือ F − f นะ จากสมการ F − f = 4f นายยังไม่ได้บวก f กลับเข้าไป”","ช่อง F ผิด (เช่น 353.16)"],["yuan","“ใช่ F = 4f + f = 5f ≈ 441 N ลองใส่ค่านี้ในช่องแรงผลักแล้วกดผลักดู”","ช่อง F ถูก (441)"]],["ลองตั้งสมการ","กล่องกับริวกะ 60 kg บนพื้น μ = 0.15 ผลักได้ 0.8 m แล้วต้องไถลต่ออีก 3.2 m ให้ถึงจุดจอด ต้องผลักแรงเท่าไหร่ ?","f = μmg = 0.15 × 60 × 9.81 = [ ] N","(F − f) × 0.8 = f × 3.2","F = [ ] N","ได้ F แล้ว ใส่ลงในช่องแรงผลักบนแผง แล้วกด ผลัก/เล่น"]],["6-07","ผลักตามที่คำนวณ",[["ryuka","“ตั้งค่าเสร็จแล้วกดผลักได้เลย”",""],["yuan","“จอดได้! m = 60 kg, μ = 0.15 ได้ f = 88.3 N ส่วนแรงผลัก 441 N ≈ 4.99 เท่าของ f”","จอดในช่อง"],["ryuka","“จอดก่อนถึงจุดจอด 0.38 m”","จอดก่อนถึง (เช่นผลัก 400 N)"],["ryuka","“จอดเลยจุดจอดไป 0.35 m”","จอดเลย (เช่นผลัก 480 N)"],["ryuka","“ไถลเลยธงไปไกลมาก”","ไถลออกนอกจอ"],["yuan","“จอดก่อนถึงจุดจอด 0.38 m ใบ้ให้: ตอนนี้ f = μmg = 88.3 N ลองใช้สูตรจากพาร์ทสอน (F − f) × 0.8 = f × 3.2”","พลาดครบ 3 ครั้ง"]],[]],["6-08","เลข 5 มาจากไหน",[["yuan","“มวลกับความฝืดเปลี่ยนไปหลายรอบแล้ว แต่แรงผลักที่พอดีก็ยังเป็น 5 เท่าของ f ทุกครั้ง แปลว่าเลข 5 ไม่ได้มาจากสองอย่างนี้”","ตอบ ก หรือ ข"],["yuan","“ใช่เลย เลข 5 มาจากระยะทาง มาดูกันว่าทำไม”","ตอบ ค (ถูก)"],["yuan","“ไม่เป็นไร มาดูกันว่ามาจากไหน”","ตอบ ง"],["yuan","“สังเกตมั้ย ในด่านนี้แรงผลักที่พอดีจะประมาณ 5 เท่าของ f เพราะผลัก 0.8 m แล้วไถลต่อ 3.2 m: (F − f)/m × 0.8 = f/m × 3.2 ตัด m ออก เหลือ F = 5f (ถ้าระยะเปลี่ยน เลข 5 ก็เปลี่ยน)”",""],["yuan","“มวลมากขึ้นหรือพื้นฝืดขึ้น แรงเสียดทาน f = μmg ก็มากขึ้น เลยต้องผลักแรงขึ้นตามไปด้วย”",""]],["ลองคิดดู","ด่านก่อนก็ต้องผลักประมาณ 5 เท่าของ f ด่านนี้ก็ 5 เท่าอีก เลข 5 มาจากไหน ?","ก. จากมวลของกล่อง","ข. จากความฝืดของพื้น","ค. จากระยะทาง: ผลัก 0.8 m แล้วไถลต่อ 3.2 m","ง. ไม่แน่ใจ"]],["6-09","เล่นอิสระ",[["yuan","จะลองค่าอื่นอีก หรือไปต่อ?",""],["yuan","“ปรับมวล m กับสัมประสิทธิ์ความเสียดทาน μ ได้ตามใจเลย แล้วหาแรงผลักที่ทำให้กล่องจอดในช่องหน้าธงอีกครั้ง”","เลือก ลองค่าอื่นอีก"],["ryuka","“ตั้งค่าเสร็จแล้วกดผลักได้เลย”","เลือก ลองค่าอื่นอีก"]],[]]]],[7,[["7-01","ตั้งเป้า: ที่กั้นกับริวกะ",[["scene","ด่านพิเศษ การเคลื่อนที่แบบโพรเจกไทล์ ไปต่อ",""],["kay","“กลับไปที่ลานน้ำแข็งกันอีกที คราวนี้ไม่มีแรงเสียดทานช่วย… ผมรู้ละ ก็เอาที่กั้นไปวางขวางหน้ากล่องไว้เลยละกัน กล่องจะได้หยุดแน่ๆ”",""],["ryuka","“ห๊ะ???????????? แล้วคนที่ยืนอยู่บนกล่องล่ะ !?”",""],["yuan","“งั้นจะย้อนเวลาให้ก่อนละกัน”",""],["yuan","“คราวนี้เปลี่ยนจากตั้งแรงผลัก มาตั้งความเร็วของกล่องตอนไถลเข้าหาที่กั้นแทน บนแท่นก็เป็นน้ำแข็ง กล่องเลยไถลด้วยความเร็วคงที่จนชนที่กั้น”",""],["yuan","“กล่องหยุดที่ที่กั้นก็จริง แต่ริวกะไม่ได้ติดกับกล่อง… หาความเร็วที่ทำให้ริวกะลอยไปลงเบาะที่ธงพอดีสิ”",""],["yuan","“ก่อนจะหาคำตอบ ลองดูก่อนว่าความเร็วของกล่องเปลี่ยนอะไรบ้าง ให้จับตาดูสองอย่าง: ริวกะตกไกลแค่ไหน กับลอยอยู่กลางอากาศนานเท่าไหร่”",""]],[]],["7-02","ทาย: เร็วเป็น 2 เท่า",[["yuan","“ลองทายก่อน เลือกคำตอบบนกระดานได้เลย”",""],["yuan","“จำคำตอบไว้นะ แล้วไปลองปล่อยกล่องดูกัน”","เลือกข้อไหนก็ได้"]],["ทายก่อน","ถ้ากล่องเร็วเป็น 2 เท่า ริวกะจะตกไกลจากขอบแท่นเป็นกี่เท่า ?","ก. เท่าเดิม","ข. 2 เท่า","ค. 4 เท่า","ง. ไม่แน่ใจ"]],["7-03","สำรวจ: ความเร็ว 3 ค่า",[["ryuka","“เลือกความเร็วดีๆ นะ… ขอร้อง”",""],["ryuka","โอ๊ย…",""],["yuan","“ครบ 3 รอบแล้ว ลองเทียบดูว่าแต่ละรอบตกไกลแค่ไหน แล้วเวลาลอยบนแผงเป็นเท่าไหร่”","ปล่อยครบทั้ง 3 ค่า"]],[]],["7-04","เชื่อมกับสมการ: x = v × t",[["yuan","“เร็วเป็น 2 เท่า ก็ตกไกลเป็น 2 เท่า แต่เวลาลอยเท่าเดิมทุกรอบ ประมาณ 0.62 s เพราะความสูงเท่าเดิม”",""]],["ระยะตก x = v × t","เวลาลอย t ≈ 0.62 s ทุกรอบ","v = 2 m/s → x = 2 × t ≈ 1.24 m","v = 4 m/s → x = 4 × t ≈ 2.49 m","v = 6 m/s → x = 6 × t ≈ 3.73 m","v เป็น 2 เท่า (2 → 4 m/s) x ก็เป็น 2 เท่า (1.24 → 2.49 m)","จาก s = ut + ½at² ในแนวราบ (a = 0) ได้ x = v t"]],["7-05","คำนวณ: หาความเร็วก่อนปล่อย",[["yuan","“คราวนี้ไม่มีปุ่มให้เลือกแล้ว ตั้งสมการบนกระดานก่อน แล้วค่อยใส่ความเร็วที่คิดได้”",""],["yuan","“0.39 คือ 2h/g ยังไม่ได้ถอดรากที่สองนะ √0.39 เท่ากับเท่าไหร่ลองดู”","ช่อง t ผิด (เช่น 0.39)"],["yuan","“ใช่ t ≈ 0.62 s ตรงกับเวลาลอยที่นายเห็นบนแผงทุกรอบเลย”","ช่อง t ถูก (0.62)"],["yuan","“นายเอา D ไปคูณ t แต่ D = v × t ถ้าจะหา v ต้องเอา D หารด้วย t”","ช่อง v ผิด (เช่น 1.86)"],["yuan","“ถูก 3.0 ÷ 0.62 ≈ 4.8 m/s ลองใส่ความเร็วนี้ในช่องบนแผงแล้วปล่อยกล่องดู”","ช่อง v ถูก (4.8)"]],["ลองตั้งสมการ","ริวกะหลุดจากขอบที่ความสูง h = 1.9 m และต้องลงเบาะที่ห่างขอบ D = 3.0 m กล่องต้องเร็วเท่าไหร่ ?","h = ½ g t² → t = √(2h/g)","เวลาลอย t = [ ] s","v = D / t = 3.0 / t = [ ] m/s","ได้ v แล้ว ใส่ลงในช่องความเร็วบนแผง แล้วกด ปล่อยกล่อง/เล่น"]],["7-06","ปล่อยกล่อง",[["ryuka","“เลือกความเร็วดีๆ นะ… ขอร้อง”",""],["ryuka","รอดแล้ว~","ลงเบาะ"],["yuan","“เยี่ยม! ใช้ความเร็ว 4.8 m/s ริวกะตกห่างธงแค่ 0.01 m ลงเบาะพอดี”","ลงเบาะ"],["ryuka","“ตกก่อนถึงธง 0.51 m… โอ๊ย”","ตกก่อนถึง (เช่น 4.0 m/s)"],["ryuka","“เลยธงไป 0.42 m… โอ๊ย”","เลยธง (เช่น 5.5 m/s)"],["yuan","ตกก่อนถึงธง 0.51 m ใบ้ให้: เมื่อพุ่งออกในแนวราบ เวลาที่ลอยอยู่กลางอากาศขึ้นกับความสูงอย่างเดียว t = √(2h/g) = √(2×1.9/9.81) ≈ 0.62 s แล้ว D = v·t","พลาดตั้งแต่ครั้งที่ 2"]],[]],["7-07","บทเรียน: ตอนกล่องชนที่กั้น",[["yuan","“ตอนชน ที่กั้นออกแรงดันกล่อง และกล่องก็ดันที่กั้นกลับด้วยแรงขนาดเท่ากัน ทิศตรงข้าม นี่คือกฎข้อ 3 แรงที่ที่กั้นดันกล่องคือแรงที่ทำให้กล่องหยุด”",""],["yuan","“แต่ที่กั้นไม่ได้แตะริวกะเลย และผิวกล่องก็ลื่น ไม่มีแรงในแนวนอนมากระทำกับริวกะ ริวกะเลยพุ่งต่อด้วยความเร็วเดิม กฎข้อ 1 อีกแล้ว!”",""],["ryuka","“แปลว่าไม่มีใครผลักเค้าออกไปเลยหรอ… เค้าแค่ไม่ได้หยุดตามกล่อง”",""]],["ตอนกล่องชนที่กั้น","ที่กั้นดันกล่อง ← → กล่องดันที่กั้น","Fที่กั้น→กล่อง = −Fกล่อง→ที่กั้น","กฎข้อ 3: ขนาดเท่ากัน ทิศตรงข้าม และกระทำกับวัตถุคนละก้อน จึง     if (t.classList.contains('opt') && t.closest('#board')) push('picks', $('board').dataset.qid, +t.dataset.i);
    else if (t.classList.contains('chip') && !t.hasAttribute('aria-pressed') && t.closest('#board')) T.chips.all.push(t.dataset.k);
    else if (t.classList.contains('fillchk')){ const x = t.closest('.fillbox'); push('blanks', x.dataset.k, parseFloat(x.querySelector('.fillin').value)); }
    else if (t.classList.contains('choice') && t.closest('#choices')) T.choices.all.push([...t.parentNode.children].indexOf(t));
    else if (t.id === 'playBtn' && MODES[panelMode] && reading == null) push('plays', panelMode, Object.fromEntries(MODES[panelMode].params.map(([k]) => [k, pval[k]])));
  }, true);
  document.addEventListener('keydown', e => {
    if (!DBG.on || e.key !== 'Enter' || !e.target.classList || !e.target.classList.contains('fillin')) return;
    const x = e.target.closest('.fillbox'), v = parseFloat(e.target.value);
    if (isFinite(v)) ((DBG.trail.blanks[x.dataset.k] = DBG.trail.blanks[x.dataset.k] || [])).push(v);
  }, true);

  /* ---------- moving around ---------- */
  function jump(st){
    stopAP();
    Object.assign(memo, MEMO_START, { F:vals.F, v1:Math.sqrt(2*(vals.F/40)*0.8), pred1:vals.pred, pred2:vals.pred, path:'full', fric:{ F:196 } }, clone(st.memo));
    DBG.state = st.f + (st.label && st.label !== st.f ? ' · ' + st.label : '');
    startAP({ script:clone(st.script), stop:Object.assign({}, st.stop), part:st.part, label:DBG.state });
    runPart(st.part, st.title);
  }
  function next(over, afterPlay){                  // afterPlay: on to the first line after the level has been run
    if (!DBG.curPart) return;
    DBG.state = '';
    startAP({ script:clone(over), stop:{ say:DBG.sayN + 1, afterPlay:!!afterPlay }, part:DBG.curPart, label:afterPlay ? 'ผลของการเล่น' : 'บรรทัดถัดไป' });
  }
  function prev(){
    if (!DBG.curPart) return;
    const k = DBG.curPart, target = Math.max(1, DBG.sayN - 1), script = clone(DBG.trail);
    stopAP();
    Object.assign(memo, clone(DBG.partMemo));
    startAP({ script, stop:{ say:target }, part:k, label:'บรรทัดก่อนหน้า' });
    runPart(k, DBG.title);
  }
  function wrongOf(box){ const a = +box.dataset.ans; return a === 0 ? 1 : +(a*1.5).toFixed(2); }
  function missOf(kind){                            // a level run with a hit, a short or a long miss, or no move
    const mode = panelMode, M = MODES[mode]; if (!M) return null;
    if (M.presets) return null;
    const f = mode === 'sbN' || mode === 'sandbox' ? (pval.mu || 0)*(pval.m || 40)*G : 0.1*40*G;
    if (/^speed/.test(mode)) return { hit:{ v:4.8 }, short:{ v:4 }, long:{ v:5.5 }, still:{ v:0 } }[kind];
    if (/^push1/.test(mode) || mode === 'push') return { hit:{ F:vals.F }, short:{ F:vals.F }, long:{ F:vals.F }, still:{ F:0 } }[kind];
    return { hit:{ F:+(5*f).toFixed(1) }, short:{ F:+(4*f).toFixed(1) }, long:{ F:+(5.8*f).toFixed(1) }, still:{ F:+(0.7*f).toFixed(1) } }[kind];
  }
  function actButton(kind, i){
    const B = $('board'), box = B.hidden ? null : B.querySelector('.fillbox.now');
    if (kind === 'pick'){ if (!B.hidden && B.dataset.qid) next({ picks:{ [B.dataset.qid]:[i] } }); return; }
    if (kind === 'blankOk' || kind === 'blankBad'){ if (box) next(kind === 'blankOk' ? {} : { blanks:{ [box.dataset.k]:[wrongOf(box)] } }); return; }
    if (kind === 'mine'){ const M = MODES[panelMode]; if (M) next({ plays:{ [panelMode]:[Object.fromEntries(M.params.map(([k]) => [k, vals[k]]))] } }, true); return; }
    const v = missOf(kind); if (v) next({ plays:{ [panelMode]:[v] } }, true); else next({}, !!MODES[panelMode]);
  }
  function jumpLine(fr, line){
    const t = line[1].replace(/[“”]/g, '').trim(), key = t.slice(0, 14);
    const st = STATES.find(s => s.f === fr.id && s.stop.line && (t.includes(s.stop.line) || s.stop.line.includes(key)));
    if (st) return jump(st);
    const base = frameState(fr.id);
    if (line[0] !== 'scene' && key) base.stop.line = key;
    jump(base);
  }

  /* ---------- the badge and the panel ---------- */
  let ui = null, open = true;
  DBG.view = 'frames';
  const CSS = `#dbgBadge{position:fixed;left:8px;top:8px;z-index:100;background:#B8405E;color:#fff;font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:6px 9px;border-radius:7px;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
    #dbgPanel{position:fixed;right:0;top:0;bottom:0;width:390px;z-index:99;background:#fff;color:#1B2530;font:13px/1.35 var(--f-ui);box-shadow:-4px 0 18px rgba(0,0,0,.18);display:flex;flex-direction:column}
    #dbgPanel[hidden]{display:none}
    #dbgPanel .dh{padding:8px 10px;border-bottom:1px solid #dde2e8;display:flex;flex-direction:column;gap:6px}
    #dbgPanel .dst{font:12px/1.35 ui-monospace,Menlo,monospace;color:#465362;white-space:pre-wrap}
    #dbgPanel .drow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    #dbgPanel button{font:inherit;font-size:12px;border:1px solid #c4cbd5;background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;color:#1B2530}
    #dbgPanel button:hover{border-color:#1B2530}
    #dbgPanel button.dk{background:#1B2530;color:#fff;border-color:#1B2530}
    #dbgPanel label{display:inline-flex;gap:3px;align-items:center;font-size:12px}
    #dbgPanel input,#dbgPanel select{font:inherit;font-size:12px;width:56px;padding:1px 3px;border:1px solid #c4cbd5;border-radius:5px}
    #dbgPanel .dbody{flex:1;overflow:auto;padding:6px 10px 20px}
    #dbgPanel h4{margin:10px 0 3px;font-size:13px}
    #dbgPanel .dfr{margin:2px 0 4px;display:flex;flex-wrap:wrap;gap:3px;align-items:baseline}
    #dbgPanel .dfr > button:first-child{font-weight:600}
    #dbgPanel .dfr.now > button:first-child{background:#FFF1E0;border-color:#FF9F3A}
    #dbgPanel .dln{display:block;width:100%;text-align:left;margin:1px 0;border-color:#eef0f3}
    #dbgPanel .dln i{color:#8a4d00;font-style:normal;margin-right:4px}
    #dbgPanel .dln b{font-weight:600;margin-right:4px}
    #dbgPanel .dbd{color:#465362;font-size:12px;margin:1px 0 1px 10px}`;
  function buildUI(){
    if (ui) return;
    const st = document.createElement('style'); st.id = 'dbgStyle'; st.textContent = CSS;
    const badge = document.createElement('button'); badge.id = 'dbgBadge'; badge.textContent = 'DEBUG'; badge.title = 'แผงดีบัก (เปิด/ปิด)';
    const panel = document.createElement('div'); panel.id = 'dbgPanel';
    panel.innerHTML = `<div class="dh">
        <div class="dst" id="dbgStat"></div>
        <div class="drow"><button class="dk" data-a="prev" title="[">◂ ก่อนหน้า</button><button class="dk" data-a="next" title="]">ถัดไป ▸</button>
          <span>ตอบ:</span>${[0, 1, 2, 3].map(i => `<button data-a="pick" data-i="${i}">${ABCD[i]}</button>`).join('')}
          <button data-a="blankOk">ช่อง ✓</button><button data-a="blankBad">ช่อง ✗</button></div>
        <div class="drow"><span>ด่าน:</span><button data-a="hit">ผ่าน</button><button data-a="short">ขาด</button><button data-a="long">เกิน</button><button data-a="still">ไม่ขยับ</button><button data-a="mine">ใช้ค่าข้างล่าง</button></div>
        <div class="drow"><label>F <input data-v="F" type="number" step="1"></label><label>m <input data-v="m" type="number" step="1"></label>
          <label>μ <input data-v="mu" type="number" step="0.01"></label><label>v <input data-v="v" type="number" step="0.1"></label></div>
        <div class="drow"><label>คำทาย <select data-v="pred">${[0, 1, 2, 3].map(i => `<option value="${i}">${ABCD[i]}</option>`).join('')}</select></label>
          <label>ความเร็วฉาก <select data-v="speed"><option value="1">1×</option><option value="4">4×</option><option value="20">20×</option></select></label>
          <button data-a="skip">ข้ามแอนิเมชัน</button></div>
        <div class="drow"><button data-a="view" data-i="frames">เฟรมทั้งหมด</button><button data-a="view" data-i="script">บทของพาร์ทนี้</button></div>
      </div><div class="dbody" id="dbgBody"></div>`;
    document.head.append(st); document.body.append(badge, panel);
    badge.onclick = () => { open = !open; panel.hidden = !open; };
    panel.hidden = !open;
    panel.querySelectorAll('[data-v]').forEach(el => {
      el.value = vals[el.dataset.v];
      el.addEventListener('change', () => { const x = parseFloat(el.value); if (isFinite(x)) vals[el.dataset.v] = x; });
      el.addEventListener('keydown', e => e.stopPropagation());
    });
    panel.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      e.stopPropagation(); b.blur();
      const a = b.dataset.a, i = b.dataset.i;
      if (a === 'prev') prev(); else if (a === 'next') next();
      else if (a === 'pick') actButton('pick', +i);
      else if (['blankOk', 'blankBad', 'hit', 'short', 'long', 'still', 'mine'].includes(a)) actButton(a);
      else if (a === 'skip'){ if (scene && scene.update) for (let n = 0; n < 1200 && !DBG.ap; n++) scene.update(1/60*(scene.timeScale || 1)); }
      else if (a === 'view'){ DBG.view = i; renderBody(); }
      else if (a === 'jump') jump(DBG.STATES[+i]);
      else if (a === 'line'){ const fr = FRAMES.find(f => f.id === b.dataset.f); jumpLine(fr, fr.lines[+i]); }
    });
    ui = { st, badge, panel };
    renderBody(); status();
  }
  function removeUI(){ if (!ui) return; ui.st.remove(); ui.badge.remove(); ui.panel.remove(); ui = null; }
  function renderBody(){
    if (!ui) return;
    const body = ui.panel.querySelector('#dbgBody');
    if (DBG.view === 'script'){
      const n = NUM_OF[DBG.curPart] || 1;
      body.innerHTML = `<h4>บทของพาร์ท ${n} (จากสตอรีบอร์ด) · แตะบรรทัดเพื่อไปที่บรรทัดนั้น</h4>` + FRAMES.filter(f => f.n === n).map(f =>
        `<h4>${f.id} ${esc(f.title)}</h4>` + f.lines.map((l, i) => `<button class="dln" data-a="line" data-f="${f.id}" data-i="${i}">${l[2] ? `<i>[${esc(l[2])}]</i>` : ''}<b>${CAST[l[0]] || 'ฉาก'}:</b>${esc(l[1])}</button>`).join('')
        + f.board.map(t => `<div class="dbd">กระดาน: ${esc(t)}</div>`).join('')).join('');
      return;
    }
    let html = '', last = 0;
    DBG.STATES.forEach((st, i) => {
      const fr = FRAMES.find(f => f.id === st.f);
      if (st.label === st.f){
        if (i) html += '</div>';
        if (fr.n !== last){ last = fr.n; html += `<h4>${fr.n} · ${esc(PART_NAME[PART_OF[fr.n]])}</h4>`; }
        html += `<div class="dfr${DBG.frame === st.f ? ' now' : ''}"><button data-a="jump" data-i="${i}">${st.f} ${esc(fr.title)}</button>`;
      } else html += `<button data-a="jump" data-i="${i}">${esc(st.label)}</button>`;
    });
    body.innerHTML = html + '</div>';
  }
  function status(){
    if (!ui) return;
    ui.panel.querySelector('#dbgStat').textContent = `พาร์ท: ${DBG.curPart ? PART_NAME[DBG.curPart] : '—'}\nเฟรม: ${DBG.frame || '—'} · บรรทัดที่ ${DBG.sayN}${DBG.state ? '\nสถานะ: ' + DBG.state : ''}${DBG.note ? '\n' + DBG.note : ''}`;
    if (DBG.view === 'frames') ui.panel.querySelectorAll('.dfr').forEach(d => d.classList.toggle('now', d.firstChild.textContent.startsWith(DBG.frame + ' ')));
  }
  DBG.ui = show => { if (ui){ open = !!show; ui.panel.hidden = !open; } };

  /* ---------- switching on and off ---------- */
  function setOn(on){
    if (on === DBG.on && (on ? ui : !ui)) return;
    if (on){
      DBG.saved = { session:track.session ? clone(track.session) : null, student:track.student };
      track.sec = null;                             // this part's time stops counting here, and is never sent
    } else {
      stopAP(); track.sec = null;
      if (DBG.saved){ track.session = DBG.saved.session; track.student = DBG.saved.student; }
    }
    DBG.on = on;
    try { if (on) sessionStorage.setItem('nmg.debug', '1'); else sessionStorage.removeItem('nmg.debug'); } catch (e){}
    if (on) buildUI(); else removeUI();
  }
  DBG.set = setOn;
  const CODE = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
  let pos = 0;
  addEventListener('keydown', e => {
    if (e.repeat || e.isComposing) return;
    const k = (e.key || '').toLowerCase();
    if (k === CODE[pos]){
      pos++;
      if (pos > 2){ e.preventDefault(); e.stopImmediatePropagation(); }   // from the third key on: not for the game
      if (pos === CODE.length){ pos = 0; setOn(!DBG.on); }
      return;
    }
    pos = k === 'arrowup' ? (pos >= 2 ? 2 : 1) : 0;
    if (!DBG.on) return;
    const a = document.activeElement, typing = a && (a.matches('input, textarea, select') || a.isContentEditable);
    if (typing) return;
    if (k === ']'){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
    else if (k === '['){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  }, true);
  if (DBG.on) buildUI();                          // switched on earlier in this tab, before a reload
})();

titleScreen();
</script>
