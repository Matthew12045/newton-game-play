<meta charset="utf-8">
<title>กฎการเคลื่อนที่ของนิวตัน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
/* Layout: a fixed 1280×720 storyboard frame scaled to fit the window — stage on the left,
   parameter panel on the right, dialogue bar along the bottom, exactly like the storyboard.
   Deliberately a single light look: the hand-drawn line-art sprite is made for white paper. */
:root{
  --paper:#ffffff;
  --ink:#1B2530;
  --slate:#D6E2EA;      /* parameter panel: light, cool */
  --slate-ink:#465362;
  --teal:#3D7B74;       /* the box */
  --red:#FF3B30;        /* force arrows */
  --vel:#2563EB;        /* velocity arrows (the same blue as COL.vel on the canvas) */
  --amber:#FF9F3A;      /* highlighted forces / push gradient */
  --good:#2E8B57;
  --bad:#B8405E;         /* wrong answer: raspberry, so red always means a force */
  --backdrop:#C9D8E2;
  --sky-top:#E1F0F7;    /* scene sky; light enough that the red force arrows keep 3:1 */
  --sky-low:#FAFDFE;    /* sky at the ice line */
  --story:#FFF3DC;      /* dialogue bar: warm paper on a cool scene */
  --story-edge:#E9D6AE;
  --f-ui:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Noto Sans Thai",Tahoma,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
body{background:var(--backdrop);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:linear-gradient(var(--sky-top) 0%,var(--sky-low) 62%,var(--paper) 100%);overflow:hidden;border-radius:6px}
#cv{position:absolute;inset:0;width:1280px;height:720px}
#title,#htitle{position:absolute;top:16px;left:0;width:1280px;display:flex;justify-content:center;pointer-events:none}
/* with the slider panel up (levels), the heading centres between the canvas legend (แรง / ความเร็ว, to 236px) and the
   panel (from 896px), a little smaller so the longest part name still fits on one line */
#stage:has(#panel:not([hidden])) #title,#hist:has(#hpanel > *) #htitle,#stage.retryPanel #htitle{left:240px;width:650px}
#stage:has(#panel:not([hidden])) #title .tt,#hist:has(#hpanel > *) #htitle .tt,#stage.retryPanel #htitle .tt{font-size:24px}
.tbar{display:inline-flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:5px 26px 5px 6px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 2px 12px rgba(27,37,48,.10)}
.tbar:not(:has(.tk)){padding-left:26px}
.tbar .tk{background:var(--ink);color:#fff;border-radius:999px;padding:3px 14px;font-size:18px;font-weight:600;white-space:nowrap}
.tbar .tt{font-size:27px;font-weight:600;line-height:1.3;color:var(--ink);text-wrap:balance}

/* parameter panel */
.panel{position:absolute;left:896px;top:16px;width:344px;height:524px;background:var(--slate);border-radius:36px;padding:16px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{background:#fff;border-radius:14px;padding:5px 20px;font-size:21px}
.params{width:100%;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.prow label{font-size:19px;min-width:0}
.prow label i{font-family:var(--f-math)}
.num{display:flex;align-items:baseline;gap:5px;font-family:var(--f-math);font-size:19px;flex:none}
.num input{width:84px;font:inherit;font-size:20px;text-align:right;border:none;border-radius:8px;padding:2px 6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus-visible{outline:2px solid var(--ink)}
.num input:disabled{opacity:.6}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:var(--teal);outline:none;margin:9px 0 7px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#000;cursor:pointer;border:none}
.rng::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#000;cursor:pointer;border:none}
.rng:focus-visible{box-shadow:0 0 0 4px #fff}
.rng:disabled{opacity:.55}
.panel.multi .prow label{font-size:15px}
.panel.multi .num,.panel.multi .num input{font-size:17px}
.panel.multi .num input{width:72px}
.panel.multi .rng{height:10px;margin:6px 0 3px}
.panel.multi .rng::-webkit-slider-thumb{width:22px;height:22px}
.panel.multi .rng::-moz-range-thumb{width:22px;height:22px}
.panel.multi .readout{font-size:14px;line-height:1.22;padding:5px 12px}
.panel.multi .readout dt .th{font-size:12px}
.panel.multi .info{font-size:14px;line-height:1.25}
.info{font-size:15px;color:var(--slate-ink);text-align:center;line-height:1.35}
.readout{width:100%;margin:4px 0;display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:16px;line-height:1.35;background:rgba(255,255,255,.55);border-radius:16px;padding:8px 14px;font-variant-numeric:tabular-nums}
.readout dt{white-space:nowrap}
.readout dt .th{font-size:13px;color:var(--slate-ink);margin-right:6px}
.readout dt i{font-family:var(--f-math)}
.readout dd{margin:0;text-align:right;font-family:var(--f-math)}
.roCap{align-self:flex-start;font-size:14px;color:var(--slate-ink);margin-bottom:-4px}
.gbox{position:relative;width:300px;height:90px;flex:none}
.graph{width:300px;height:90px;background:#fff;border-radius:12px;display:block}
.gtabs{display:flex;gap:4px}
.gtabs button{font:inherit;font-family:var(--f-math);font-style:italic;font-size:13px;line-height:1.35;border:1px solid #c4cbd5;background:#fff;color:var(--slate-ink);border-radius:999px;padding:0 9px;cursor:pointer}
.gtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gbox .gtabs{position:absolute;top:4px;right:6px}
.panel .btnPlay{margin-top:auto}
/* preset values instead of a slider (สำรวจ), and the ดูกราฟ button in front of the panel graph */
.presets{display:flex;gap:8px;justify-content:center;margin:6px 0 4px}
.preset{background:#fff;border:2px solid transparent;border-radius:999px;padding:3px 16px;font:inherit;font-family:var(--f-math);font-size:19px;cursor:pointer;color:var(--ink)}
.preset:hover{border-color:var(--slate-ink)}
.preset[aria-pressed="true"]{background:var(--ink);color:#fff}
.preset:disabled{opacity:.55;cursor:default}
.preset.done:not([aria-pressed="true"]){border-color:#9aa3ae}
.gbtn{background:#fff;border:1px solid #c4cbd5;border-radius:999px;padding:1px 14px;font:inherit;font-size:15px;color:var(--slate-ink);cursor:pointer}
.gbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.btnPlay{background:var(--ink);border:none;border-radius:999px;padding:8px 34px;flex:none;font:inherit;font-size:24px;cursor:pointer;color:#fff;transition:transform .12s}
.btnPlay:hover{transform:translateY(-2px)}
.btnPlay:disabled{opacity:.5;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* lesson board */
.board{position:absolute;left:676px;top:100px;width:564px;height:436px;border:3px solid var(--ink);border-radius:36px;background:#fff;padding:20px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
.board.top{justify-content:flex-start}
.board .gtabs button{font-size:17px;padding:1px 14px}
.board .gtop{display:flex;align-items:center;gap:14px}
/* a formula's clip plays on the whiteboard itself, in the game's colours (video/); when it has finished, the board's own
   content fades back in */
.bclip{position:absolute;inset:0;z-index:1;border-radius:33px;overflow:hidden;background:#fff;opacity:0;pointer-events:none}
.bclip.live{opacity:1;transition:opacity .25s}
.bclip.live.done{opacity:0;transition:opacity .7s}
.bclip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bclip .tag{position:absolute;left:50%;top:24px;transform:translateX(-50%);white-space:nowrap;z-index:1}
.board .bAgain{position:absolute;right:16px;bottom:14px;z-index:2;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--slate);background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.board .bAgain:hover{border-color:var(--ink)}
/* where the board's formula comes from, along the board's bottom edge */
.board.hasFrom{padding-bottom:46px}
/* ⤢ on the board: it glides up and grows to almost fill the stage (the heading stays in view); the scene dims */
#board{transform-origin:0 0;transition:transform .55s cubic-bezier(.22,.9,.24,1),box-shadow .55s}
#stage.boardUp #board{z-index:6}
#stage.boardBig #board{box-shadow:0 30px 80px rgba(20,30,45,.28)}
#boardDim{position:absolute;inset:0;z-index:5;background:rgba(225,238,245,.78);opacity:0;pointer-events:none;transition:opacity .45s}
#stage.boardBig #boardDim{opacity:1;pointer-events:auto;cursor:zoom-out}
#stage.boardUp #title{z-index:7}
.board .bBig{position:absolute;right:14px;top:12px;z-index:3;width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:12px;border:2px solid var(--slate);background:#fff;color:var(--ink);cursor:pointer}
.board .bBig:hover{border-color:var(--ink)}
.board .q{padding-right:30px}                   /* a quiz question wraps before the ⤢ corner */
/* ↻ in the back view: a line's clip can be played again there too */
#hagain{position:absolute;left:1181px;top:479px;z-index:3;pointer-events:auto;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--slate);background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.board .bFrom{position:absolute;left:30px;right:66px;bottom:14px;z-index:2;font-size:14px;line-height:1.3;color:var(--slate-ink);text-align:left}
.gview{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.gleg{width:100%;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:16px;line-height:1.35}
.gleg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.math{font-family:var(--f-math);font-style:italic}
.up{font-style:normal}
.sig{font-family:var(--f-math);font-style:normal;font-size:1.25em}
.vec{position:relative;display:inline-block;font-family:var(--f-math);font-style:italic;--vt:max(1.5px,.05em)}
/* the arrow over a vector: shaft and head both scale with the text and share one centre line */
.vec::after{content:"";position:absolute;left:18%;right:calc(-8% + .1em);top:calc(-.07em - var(--vt)/2);height:var(--vt);background:currentColor;border-radius:var(--vt)}
.vec::before{content:"";position:absolute;right:-8%;top:-.19em;border:.12em solid transparent;border-left:.22em solid currentColor;border-right:0}
.eqBig{font-size:56px;line-height:1.1;font-family:var(--f-math)}
.eqMid{font-size:30px;font-family:var(--f-math)}
.cap{font-size:22px}
.small{font-size:17px;color:var(--slate-ink)}
.row{width:100%;padding:8px 12px;border-radius:14px;font-size:21px;transition:background .25s,opacity .25s;opacity:.4}
.row.on{background:#FFF1E0;opacity:1}
.row.done{opacity:1}
.law{border-radius:20px;background:#EEF4F3;padding:14px 18px;font-size:21px;line-height:1.5;text-align:left}
.law b{color:var(--teal)}
.tbl{border-collapse:collapse;font-size:20px;width:100%}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid #dde2e8}
.tbl th{font-weight:600;font-size:17px;color:var(--slate-ink)}
.tbl td{font-family:var(--f-math)}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 10px;font-size:15px;letter-spacing:.04em}
.q{font-size:22px;line-height:1.45;text-align:left;width:100%}
.opts{display:flex;flex-direction:column;gap:9px;width:100%}
.opt{text-align:left;background:#F3F5F8;border:2px solid transparent;border-radius:14px;padding:9px 14px;font:inherit;font-size:18px;line-height:1.4;cursor:pointer}
.opt:hover{border-color:var(--slate)}
.opt.right{background:#E3F4EA;border-color:var(--good)}
.opt.wrong{background:#F9E4EA;border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}
.opt.hold{pointer-events:none}
.opt.picked{background:#EEF1F4;border-color:var(--ink)}
/* fill-in blanks on the board: a number box and ตรวจ; green when right, raspberry when wrong */
.fillbox{display:inline-flex;gap:6px;align-items:center;vertical-align:middle;margin:0 2px}
.fillin{width:104px;font:inherit;font-family:var(--f-math);font-size:22px;line-height:1.2;text-align:center;border:2px solid #9aa3ae;border-radius:10px;padding:1px 6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.fillin:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px #FFE7C2}
.fillin:disabled{opacity:1}
.fillbox.now .fillin{border-color:var(--amber)}
.fillbox.right .fillin{border-color:var(--good);background:#E3F4EA}
.fillbox.wrong .fillin{border-color:var(--bad);background:#F9E4EA}
.fillchk{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:3px 14px;font:inherit;font-size:16px;cursor:pointer}
.fillchk:disabled{opacity:.35;cursor:default}
.fillbox.right .fillchk{display:none}
.fillrow{font-size:21px;line-height:1.6}
.afterok{display:none!important}
.board.wide{left:40px;width:840px}
.defbox{width:100%;border-radius:16px;background:#EEF4F3;padding:8px 14px;font-size:19px;line-height:1.45;text-align:left}
.board.top > .defbox:first-child{width:calc(100% - 36px);align-self:flex-start}
.opt.picked:disabled,.opt.right:disabled{color:var(--ink)}
.deftag{display:inline-block;background:var(--teal);color:#fff;border-radius:7px;padding:0 9px;font-size:14px;font-weight:600;margin-right:4px;vertical-align:1px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:2px solid #D6E2EA;border-radius:16px;padding:6px 12px 8px;background:#fff;text-align:left;font:inherit;color:var(--ink)}
button.card{cursor:pointer}
button.card:hover{border-color:var(--slate-ink)}
.card.on{border-color:var(--good);background:#F1FAF4}
.card b{font-size:18px;font-weight:600}
.card span{font-size:15px;color:var(--slate-ink)}
.card svg{display:block;width:100%;height:auto;margin-top:4px;border-radius:10px;background:#EAF4F8}
.cards.three .card b{font-size:20px}
.cards.three .card span{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.chip{background:#F3F5F8;border:2px solid transparent;border-radius:999px;padding:7px 18px;font:inherit;font-size:19px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--slate)}
.chip.on{background:#E3F4EA;border-color:var(--good)}
.chip.wrong{background:#F9E4EA;border-color:var(--bad)}
.chip:disabled{cursor:default}
.board svg.plots{max-width:100%;height:auto;flex:none}
.cols{display:grid;gap:18px;width:100%;align-items:center}
.cols > div{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0}
.chain{display:flex;align-items:center;justify-content:center;gap:0;width:100%;margin-top:4px}
.chainbox{display:flex;flex-direction:column;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:4px 14px;background:#fff;font-size:15px;animation:fadeUp .4s ease both}
.chainbox b{font-family:var(--f-math);font-style:italic;font-size:24px;font-weight:400;line-height:1.2}
.chainlink{display:flex;flex-direction:column;align-items:center;min-width:200px;padding:0 6px;font-size:14px;color:var(--slate-ink);animation:fadeUp .4s ease both}
.chainline{width:100%;height:3px;background:var(--ink);position:relative;margin-top:2px}
.chainline::after{content:"";position:absolute;right:-2px;top:-6px;border:7.5px solid transparent;border-left:12px solid var(--ink);border-right:0}
.board.full{left:40px;width:1200px}
.opt.hold:not(.wrong){opacity:.45}

/* dialogue bar */
.dlg{position:absolute;left:52px;top:552px;width:1188px;height:150px;background:var(--story);box-shadow:inset 0 0 0 2px var(--story-edge);border-radius:36px;display:flex;align-items:center;padding:0 18px 0 56px;gap:24px;cursor:pointer}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:18px}
.dtext{font-size:22px;line-height:1.45;text-wrap:pretty}
.dtext b{font-weight:600}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.choice{background:#fff;border:none;border-radius:999px;padding:6px 20px;font:inherit;font-size:19px;cursor:pointer;color:var(--ink)}
.choice:hover{background:#F2F4F7}
.choice:disabled{cursor:default;opacity:.55}
.choice.picked{background:var(--ink);color:#fff;opacity:1}
.dnav{position:absolute;bottom:6px;background:none;border:none;font:inherit;font-size:17px;color:var(--slate-ink);cursor:pointer;padding:2px 6px;border-radius:8px}
.dnav:hover{color:var(--ink)}
.dnav:disabled{opacity:.35;cursor:default}
.dnav.fwd{right:226px;animation:nudge 1.2s ease-in-out infinite}
.dnav.back{left:50px}
@keyframes nudge{50%{transform:translateX(4px)}}
.portrait{width:180px;height:128px;background:#fff;box-shadow:0 0 0 2px var(--story-edge);border-radius:30px;position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible}
.portrait img{width:100%;height:100%;object-fit:cover;border-radius:30px}
.portrait .nm{position:absolute;bottom:-12px;right:-6px;background:var(--ink);color:#fff;font-size:15px;border-radius:8px;padding:1px 10px}
/* ยูอัน talks on the phone: an ink handset in a white circle on his portrait's top left corner (like the sound button) */
.portrait .phoneTag{position:absolute;top:-10px;left:-10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:0 0 0 2px var(--slate);color:var(--ink);display:grid;place-items:center;pointer-events:none}
/* a question shown on the board that the student does not answer (เคย์ answers it, 4-00): ink text, no hover */
.opts.shown .opt,.opts.shown .opt:disabled{color:var(--ink);cursor:default}
.opts.shown .opt:hover{border-color:transparent}
.opts.shown .opt.right:hover{border-color:var(--good)}
.hp{position:absolute;top:-16px;left:4px;width:176px;height:18px;display:flex;align-items:center}
.hp::before{content:"♥";color:var(--red);font-size:26px;line-height:1;position:relative;z-index:1;text-shadow:0 0 0 #000}
.hp i{flex:1;height:12px;margin-left:-6px;background:#A890A8;border:2px solid #3b3550;border-radius:3px;position:relative;overflow:hidden}
.hp i::after{content:"";position:absolute;inset:0;background:#E74C3C;animation:drain 2.4s ease-out forwards}
@keyframes drain{from{right:0}to{right:92%}}

/* full-stage overlays */
#overlay{position:absolute;inset:0;background:linear-gradient(rgba(225,240,247,.97) 0%,rgba(250,253,254,.97) 55%,rgba(255,255,255,.97) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px}
#overlay h1{font-size:68px;font-weight:600;margin:0;letter-spacing:.01em}
#overlay h2{font-size:26px;font-weight:300;margin:0;color:var(--slate-ink)}
#overlay .bigTitle{font-size:150px;color:var(--ink);font-weight:400;line-height:1}
#overlay .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:17px;color:var(--slate-ink)}
#overlay .links button{background:none;border:1px solid var(--slate);border-radius:999px;padding:5px 16px;font:inherit;cursor:pointer;color:var(--ink)}
/* title screen: heading at the top, the cast on the ice, who is playing, then the chapter list (folded away).
   --k sizes the cast: large while the list is folded, smaller when it is open, so both fit in 720px.
   The ice runs the full width of the stage. The box slides along its far edge at a steady speed and never
   stops (the title's joke, and the first law); the other two stand nearer the viewer, so it passes behind them. */
#overlay.ts{justify-content:flex-start;gap:0;padding:24px 40px 16px;--k:1.3}
#overlay.ts.open{--k:.9}
#overlay.ts h1{font-size:64px;line-height:1.15}
.buildtag{display:inline-block;vertical-align:middle;margin-left:10px;background:#fff;color:var(--slate-ink);border:2px solid var(--slate);border-radius:999px;padding:1px 12px;font-size:16px;font-weight:400;line-height:1.5;letter-spacing:.02em}
#overlay.ts h2{margin-top:6px}
.cast{position:relative;align-self:stretch;flex:none;margin:12px -40px 0;height:calc(192px*var(--k) + 78px)}
.cast img{display:block}
.cast .ice{position:absolute;left:0;right:0;bottom:28px;height:24px;background:#D5E9F1;border-top:2px solid #9EC3CF}
.cast .castName{font-size:18px;line-height:26px;height:26px;white-space:nowrap}
.slide{position:absolute;left:50%;bottom:52px;z-index:1;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);animation:slide 8s linear -1.2s infinite}
@keyframes slide{from{transform:translateX(calc(-50% - 800px))}to{transform:translateX(calc(-50% + 800px))}}
.slide img{transform-origin:50% 100%;animation:wobble 1.7s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.castBox{width:calc(86px*var(--k));height:calc(74px*var(--k));background:var(--teal);border-radius:calc(22px*var(--k))}
.vArrow{position:absolute;left:calc(100% + 8px);bottom:calc(37px*var(--k) - 2px);width:60px;height:5px;background:currentColor;color:var(--vel);border-radius:3px 0 0 3px}
.vArrow::after{content:"";position:absolute;left:100%;top:-5.5px;border:8px solid transparent;border-left:15px solid currentColor;border-right:0}
.vArrow .vec{position:absolute;left:50%;bottom:10px;margin-left:-.25em;font-size:22px;line-height:1}
.stand{position:absolute;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%)}
.stand img{margin-bottom:16px;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
.stand + .stand img{animation-delay:-1.3s}
@keyframes breathe{50%{transform:scale(.992,1.02)}}
.ts .btnDark{margin-top:18px}
.chapters{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.chapters .more{background:none;border:none;border-radius:999px;padding:6px 16px;font:inherit;font-size:16px;cursor:pointer;color:var(--slate-ink)}
.chapters .more:hover{background:#F2F4F7;color:var(--ink)}
.chapters .list{display:grid;grid-template-columns:repeat(3,auto);gap:8px 10px;justify-content:center}
.chapters .list button{background:none;border:1px solid var(--slate);border-radius:999px;padding:5px 18px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.chapters .list button:hover{background:#F2F4F7}
.sumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:1180px;text-align:left}
.sumGrid .law{font-size:17px;padding:12px 16px}
.btnDark{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 36px;font:inherit;font-size:22px;cursor:pointer}
.btnGhost{background:none;color:var(--ink);border:2px solid var(--slate);border-radius:999px;padding:10px 30px;font:inherit;font-size:21px;cursor:pointer}
.startRow{display:flex;gap:14px;align-items:center;justify-content:center}
/* who is playing (name + class) */
.who{display:flex;gap:18px;align-items:center;font-size:20px}
.who label{display:flex;gap:8px;align-items:center}
.who input{font:inherit;font-size:20px;width:320px;padding:6px 14px;border:2px solid var(--slate);border-radius:12px;color:var(--ink);background:#fff}
.who input#whoRoom{width:150px}
.who input:focus-visible{outline:none;border-color:var(--ink)}
.who input.err{border-color:var(--bad);background:#F9E4EA}
.whoHint{font-size:16px;color:var(--bad);min-height:1.2em;margin-top:-10px}
.whoHint.note{color:var(--slate-ink)}
.ts .who{margin-top:16px}
.ts .whoHint{margin-top:4px}
.ts .startRow{margin-top:4px}
.ts .startRow .btnDark{margin-top:0}
/* end-of-game feedback */
.fb{display:flex;flex-direction:column;gap:12px;width:1040px;text-align:left;font-size:21px}
.fbRow{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:4px 16px}
.fbRow small{grid-column:2;font-size:14px;color:var(--slate-ink)}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{min-width:56px;background:#F3F5F8;border:2px solid transparent;border-radius:12px;padding:6px 14px;font:inherit;font-size:18px;cursor:pointer;color:var(--ink)}
.scale button:hover{border-color:var(--slate)}
.scale button[aria-pressed="true"]{background:#EEF4F3;border-color:var(--teal);font-weight:600}
.scale[data-k="hardest"] button{font-size:16px;padding:5px 12px}
.fb textarea{font:inherit;font-size:18px;width:100%;height:80px;resize:none;border:2px solid var(--slate);border-radius:14px;padding:8px 14px;color:var(--ink)}
.fb textarea:focus-visible{outline:none;border-color:var(--ink)}
.fb.rate{width:760px}
.fb.rate .fbRow{grid-template-columns:380px 1fr}
.fb.rate .scale button{width:64px;min-width:0;padding:6px 0}
.scaleHead{display:flex;gap:8px;font-size:14px;line-height:1.2;color:var(--slate-ink);margin-bottom:-4px}
.scaleHead span{width:64px;text-align:center}
/* the 1–5 answers: each step a shade deeper, so 5 reads as "more" at a glance; the one picked is solid */
.scale.lv button:nth-child(1){background:#F1F6F5}
.scale.lv button:nth-child(2){background:#E1ECEA}
.scale.lv button:nth-child(3){background:#CFE1DE}
.scale.lv button:nth-child(4){background:#BAD3CF}
.scale.lv button:nth-child(5){background:#A3C4BF}
.scale.lv button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.fb.type textarea{height:130px}
/* rewinding time, VHS style: cold tint, scanlines, a rolling bright band, a little shake, a blinking ◀◀ */
#rewind{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;background:rgba(40,70,150,.12)}
#rewind::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(10,20,50,.13) 0 2px,transparent 2px 5px)}
#rewind::after{content:"";position:absolute;left:0;right:0;top:-90px;height:70px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.5) 45%,rgba(140,170,255,.3) 60%,transparent);animation:vhsBand .5s linear infinite}
@keyframes vhsBand{to{transform:translateY(900px)}}
#rewind span{position:absolute;left:28px;top:78px;font:700 40px/1 var(--f-ui);color:#fff;letter-spacing:.04em;text-shadow:3px 0 rgba(255,0,90,.7),-3px 0 rgba(0,210,255,.7),0 0 10px rgba(0,0,30,.45);animation:vhsBlink .7s steps(1) infinite}
@keyframes vhsBlink{50%{opacity:.3}}
#stage.rewinding #cv,#stage.zipping #cv{filter:grayscale(.55) contrast(1.12) brightness(1.04);animation:vhsShake .09s steps(2) infinite}
#stage.zipping #hist .board,#stage.zipping #htext{animation:vhsShake .09s steps(2) infinite}
@keyframes vhsShake{50%{transform:translateX(3px)}}
#thumb{position:absolute;left:720px;top:104px;font-size:120px;line-height:1;pointer-events:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
/* reading back through earlier lines (the live screen stays underneath, untouched) */
#hist{position:absolute;inset:0;pointer-events:none}
#hist #hdialog{pointer-events:auto}
#hist .board,#hist .panel{pointer-events:none}
#hist .gtabs{pointer-events:auto}            /* graph tabs still switch in the back view */
#hdialog{cursor:pointer}
#hist .hbadge{position:absolute;left:44px;top:-15px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 8px 3px 16px;font-size:15px;display:flex;gap:12px;align-items:center;cursor:default}
#hist .hbadge button{background:#fff;color:var(--ink);border:none;border-radius:999px;font:inherit;font-size:14px;padding:1px 12px;cursor:pointer}
#stage.reading #title,#stage.reading #board,#stage.reading #dialog,#stage.reading #thumb{visibility:hidden}
#stage.reading #panel,#stage.reading #rewind{visibility:hidden}
#stage.reading.retryPanel #panel{visibility:visible;z-index:6}
#hretry{color:#FFD54F}
#stage.reading:not(.zipping) #cv{filter:none!important;animation:none}
#stage.zipping #rewind{visibility:visible}
#rotate{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;text-align:center}
/* sound on/off: in the gutter left of the dialogue bar, above every layer (title, rewind, back view) */
.sndBtn{position:absolute;left:3px;bottom:8px;z-index:8;width:46px;height:46px;padding:0;border:none;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px var(--slate);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.sndBtn:hover{background:#fff}
/* ปูพื้นฐานแบบเต็ม (basicsLong, the BEGIN/END block in the script). The caption bar at the storyboard's size: 30 px type,
   at most 3 lines, widened to the stage's right edge with ยูอัน's face at its right end (the text is 1010 px wide);
   ◂ ย้อนกลับ, ↻ เล่นซ้ำ, ข้าม, the progress line and คลิกเพื่อไปต่อ ▸ along its bottom edge. Three lines reach up to
   y ≈ 558: the scenes keep clear of that (the graph cards end at 552). IN-3, OUT-1 and OUT-2 use the same bar. */
#dialog.cut{left:52px;width:1218px;top:auto;bottom:2px;height:auto;min-height:140px;padding:6px 180px 30px 28px;gap:0}
#dialog.cut .dbody{padding-bottom:0;gap:0}
#dialog.cut .dtext{font-size:30px;line-height:1.38}
#dialog.cut .dtext .nb{white-space:nowrap}
#dialog.cut .portrait{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:150px;height:107px;border-radius:26px}
#dialog.cut .portrait img{border-radius:26px}
#dialog.cut .dnav{bottom:3px;line-height:1.2;padding:1px 6px}
#dialog.cut .dnav.back{left:22px}
#dialog.cut #cutReplay{left:126px}
#dialog.cut #cutSkip{left:226px}
#dialog.cut .dnav.fwd{right:178px}
.cutProg{display:none}
/* inside the cutscene ◂ ย้อนกลับ, ↻ เล่นซ้ำ and ข้าม stand in a column at the bar's left end: each a tap area of 104 × 44
   on the stage (≈ 54 × 23 css px on a 667 × 375 phone), 20 px type, ข้าม 24 px apart from เล่นซ้ำ; the bar is 160 tall */
#stage.cutting #dialog.cut{padding-left:126px;min-height:160px}
#stage.cutting #dialog.cut .dnav.back,#stage.cutting #dialog.cut #cutReplay,#stage.cutting #dialog.cut #cutSkip{left:10px;bottom:auto;width:104px;height:44px;padding:0;font-size:20px;line-height:1.2;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(27,37,48,.05)}
#stage.cutting #dialog.cut .dnav.back{top:0}
#stage.cutting #dialog.cut #cutReplay{top:48px}
#stage.cutting #dialog.cut #cutSkip{top:116px}
#stage.cutting #dialog.cut .dnav.back:disabled{background:none}
.cdef .nb{white-space:nowrap}
#stage.cutting .cutProg{position:absolute;left:330px;bottom:13px;width:240px;display:flex;gap:6px}
.cutProg i{flex:1;height:4px;border-radius:2px;background:rgba(27,37,48,.14);overflow:hidden}
.cutProg b{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
/* the definition box (BRIEF rule 10): top left, 24 px, above the spotlight's veil (which is drawn on the canvas) */
.cdef{position:absolute;left:16px;top:16px;max-width:660px;pointer-events:none;background:#fff;border:2px solid var(--teal);border-radius:18px;padding:8px 18px 10px;font-size:24px;line-height:1.35;color:var(--ink);box-shadow:0 6px 18px rgba(20,30,45,.18)}
.cdef-row{display:flex;align-items:baseline;gap:.45em;flex-wrap:wrap}
.cdef-tag{background:var(--teal);color:#fff;border-radius:999px;padding:0 .55em;font-weight:600}
.cdef-term{font-size:1.15em;font-weight:600}
.cdef-line{margin-top:.1em}
.cdef-f{margin-top:.1em;font-family:var(--f-math),var(--f-ui);font-size:1.12em}
.cdef-n{margin-top:.1em;color:var(--slate-ink)}
/* scene 2: the four force chips; the one on screen is lit */
.fchips{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}
.fchip{pointer-events:auto;font:inherit;font-size:24px;line-height:1.25;padding:6px 20px;border-radius:999px;border:2px solid var(--slate);background:rgba(255,255,255,.9);color:var(--ink);cursor:pointer}
.fchip i{font-family:var(--f-math);font-size:26px}
.fchip:hover{border-color:var(--slate-ink)}
.fchip.lit{background:var(--ink);border-color:var(--ink);color:#fff}
/* OUT-1: three buttons over the ice rink */
.cutOut{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;gap:18px}
.cutOut .btnDark,.cutOut .btnGhost{font-size:26px;padding:12px 38px}
.cutOut .btnGhost{background:#fff}
/* IN-3: the rink dimmed behind; the dialogue's two choices drawn as large buttons on the stage (fixed = relative to
   the transformed stage), each with its small second line */
#cutDim{position:absolute;inset:0;background:rgba(12,18,28,.55);animation:cutFade .4s ease both}
@keyframes cutFade{from{opacity:0}}
#stage.reading #cutDim{visibility:hidden}
#dialog.in3 #choices{position:fixed;left:0;top:150px;width:1280px;justify-content:center;gap:30px;flex-wrap:nowrap}
#dialog.in3 .choice{width:570px;min-height:170px;background:#fff;border:3px solid var(--slate);border-radius:32px;padding:22px 30px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;box-shadow:0 10px 30px rgba(10,20,30,.25)}
#dialog.in3 .choice:hover{border-color:var(--teal);background:#fff}
#dialog.in3 .choice b{font-size:32px;line-height:1.3;font-weight:600}
#dialog.in3 .choice span{font-size:24px;line-height:1.35;color:var(--slate-ink)}
/* title screen: the ปูพื้นฐาน button beside เริ่มเล่น, the pair centred (no line under it since 19 Nov); เล่นต่อ on a row of its own */
.ts .btnBasics{background:#fff;border:3px solid var(--teal);padding:9px 32px;font-size:22px;font-weight:600}
.ts #resume{margin-top:10px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>

const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const FONT = '"IBM Plex Sans Thai Looped","Noto Sans Thai",Tahoma,sans-serif';
const MATH = '"STIX Two Text","Cambria Math","Times New Roman",serif';

/* ---------- fit the 1280×720 frame to the window ---------- */
function fit(){
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw/W, vh/H);
  stage.style.transform = `translate(${(vw-W*s)/2}px,${(vh-H*s)/2}px) scale(${s})`;
  const k = Math.min(3, s*(devicePixelRatio||1));
  cv.width = Math.round(W*k); cv.height = Math.round(H*k);
  ctx.setTransform(k,0,0,k,0,0);
  $('rotate').hidden = !(vh > vw && vw < 700);
}
addEventListener('resize', fit); fit();

/* ---------- tiny event bus + async helpers ---------- */
let waiters = {};
let emits = 0;                         // counts events: the debug autopilot's fast scene stops stepping at each one
function emit(n, d){ emits++; snd.on(n, d); const w = waiters[n] || []; waiters[n] = []; w.forEach(f => f(d)); }
let tryAbort = null;                   // while a level try runs: rejects when the player retries it from the back view
function waitEvent(n){
  const p = new Promise(r => (waiters[n] = waiters[n] || []).push(r));
  return tryAbort ? Promise.race([p, tryAbort]) : p;
}
function waitAny(names){ return Promise.race(names.map(n => waitEvent(n).then(d => ({ name:n, data:d })))); }
let runId = 0;                         // bumped by run(): story code from an abandoned run never wakes up
const sleep = ms => { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, DBG.ap ? 0 : ms)); };

/* ---------- sound ----------
   Three rules (NOTES.md, "Sound"): the sliding sound is the box's speed made audible, so a steady sound means a
   steady velocity; nothing but a voice plays under an explanation; a miss is never punished with a buzzer.
   Short effects are synthesised here from oscillators and filtered noise. The sliding sounds are recordings embedded
   below (SAMPLES, written by tools/embed_audio.py; credits in audio/CREDITS.md), looped, and played faster and louder
   as the box moves faster; where a recording is missing the synthesised version takes over.
   Music is optional files beside the page (MUSIC); it stays low, and lower still under a lesson or a voice.
   Voice lines are optional files, audio/vo/<id>.mp3, where the id is a hash of the speaker and the line's text
   (tools/voice_script.py computes the same one): an edited line loses its recording instead of speaking the old
   words, and with no audio folder the game simply has no voices.

/* ---------- trying a level again from an earlier line ----------
   Each try in a level loop starts with newTry(); while it runs, say() and waitEvent() race against its
   abort promise. Changing a value (or pressing ผลัก/เล่น) while looking back at one of the level's lines
   rejects the try with RETRY: the loop rewinds the scene and starts a fresh try with the panel's values. */
const RETRY = Symbol('retry');
let levelNow = null, stepNow = null, retryTry = null, panelSaved = null, playQueued = false, rewinding = false;
const LEVEL_STEPS = ['ch1', 'fric', 'sandbox', 'bonus'];
function newTry(){
  rewinding = false;
  const abort = new Promise((_, rej) => { retryTry = rej; });
  abort.catch(() => {});
  tryAbort = abort;
}
function retryFromHere(play = false){
  if (zipping){ zipPlay = zipPlay || play; return true; }   // already rewinding back to that line
  if (!stage.classList.contains('retryPanel') || reading == null) return false;
  const i = reading, l = lines[i];
  // the abandoned line's buttons go now (and #next can't take focus from the box being typed in)
  advance = null; $('next').hidden = true; $('choices').innerHTML = ''; snd.hush();
  if (track.armed && track.armed.inputs) track.attempt(track.armed.inputs, 'retried');   // a push that was still running
  panelSaved = null;
  track.choice('ย้อนเวลากลับไป: ' + l.html, 'ย้อนไป ' + PART_NAME[l.step]);   // the rewind itself, in the Choices tab
  if (l.level === levelNow && retryTry){          // the level being played: abandon the current try
    stopReading();
    retryTape = lines.slice(i).reverse();       // the dialogue runs back to this line while the scene rewinds
    lines.length = i; $('backBtn').hidden = lines.length < 2;   // what came after is undone
    const reject = retryTry;
    retryTry = null; tryAbort = null; rewinding = true; playQueued = play;
    track.arm(); track.keepArm = true;          // think time and edits count from here, for the next try
    reject(RETRY);
  } else {                                      // a level that is already over: the tape runs back to this line, then the level starts from it
    runId++; waiters = {}; endLevel();          // the chapter being left stops now (its sleeps and waits never come back)
    zipPlay = play;
    track.arm(); track.keepArm = true;          // think time and edits count from here, for the next try
    zipBack(lines.length - 1, i).then(() => {
      advance = null; $('next').hidden = true; $('choices').innerHTML = '';
      renderSpeaker($('portrait'), l.who, { panic:l.panic });
      fillText($('dtext'), l.html, true);
      $('dialog').hidden = false;
      stopReading();
      track.leave(false);
      lines.length = i;                         // what came after is undone
      run(FULL_RUN.slice(FULL_RUN.indexOf(l.step)), undefined, { resume:true, play:zipPlay });
    });
  }

}

async function zipBack(from, to){

  const n = from - to, steps = calm() ? 0 : Math.max(1, Math.min(n, 16)), dt = steps ? Math.max(60, Math.min(150, 1100/steps)) : 400;
  for (let s = 0; s <= steps; s++){
    tapeFrame(steps ? Math.round(from - s*n/steps) : to);
    await new Promise(r => setTimeout(r, dt));

async function retried(e, sc){
  if (e !== RETRY) throw e;
  const th = $('thumb'); if (th) th.remove();
  const tape = retryTape; retryTape = null;
  if (sc.phase !== 'ready' || (tape && tape.length > 1)) await rewindFx(sc, tape);
  if (sc.onParam) sc.onParam(pval);
}
function endLevel(){ levelNow = null; retryTry = null; tryAbort = null; playQueued = false; rewinding = false; track.keepArm = false; }
function updateReadout(){
  if (!scene || !scene.readout) return;
  const M = MODES[panelMode], all = scene.readout(), vals = M && M.pick ? M.pick.map(i => all[i]) : all;
  vals.forEach((v, i) => { const el = $('ro'+i); if (el) el.textContent = v == null ? '–' : `${v} ${readRows[i][2]}`.trim(); });
  const note = scene.readoutNote ? scene.readoutNote() : null, cap = $('roCap');
  cap.hidden = !note; if (note) cap.textContent = note;
  if (M && M.graph && !$('gbox').hidden && scene.hist) drawGraph($('graph'), scene.hist, graphKind);
}

/* the panel graph can show v–t, a–t or x–t of the run (x–t is the one students find hardest) */
const GRAPHS = { v:'ความเร็วเทียบเวลา', a:'ความเร่งเทียบเวลา', x:'การกระจัดเทียบเวลา' };
// what each graph's vertical axis is, for its label: name and unit
const AXIS = { v:['ความเร็ว', 'm/s'], a:['ความเร่ง', 'm/s²'], x:['การกระจัด', 'm'] };
let graphKind = 'v';
$('gtabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  graphKind = b.dataset.k;
  $('gtabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const l = reading != null && stage.classList.contains('retryPanel') ? lines[reading] : null;   // the back view's run, not the live one
  if (l && l.scene && l.scene.hist) drawGraph($('graph'), l.scene.hist, graphKind);
});
function drawGraph(g, hist, k){
  const c = g.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  c.clearRect(0,0,300,90);
  const x0 = 34, top = 26, bot = 82, w = 252;
  const tMax = Math.max(4, hist.length ? hist[hist.length-1].t * 1.1 : 4);
  // the t-axis sits at zero, so backwards motion and slowing down show up below it
  const vals = hist.map(p => p[k]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1){ if (lo < 0 && hi <= 0) lo = hi - 1; else hi = lo + 1; }
  if (hi > 0) hi += (hi - lo)*0.15;
  if (lo < 0) lo -= (hi - lo)*0.15;
  const Yv = val => bot - (val - lo)/(hi - lo)*(bot - top), yz = Yv(0);
  c.strokeStyle = '#9aa3ae'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, top-6); c.lineTo(x0, bot); c.moveTo(x0, yz); c.lineTo(x0+w, yz); c.stroke();
  c.fillStyle = '#56606e'; c.font = `italic 12px ${MATH}`;
  c.fillText(k, x0-14, top+4); c.fillText('t', x0+w+5, yz+4);
  c.font = `11px ${FONT}`; c.fillText(`กราฟ${GRAPHS[k]}`, x0+6, 14);
  if (hist.length < 2) return;
  c.strokeStyle = COL.teal; c.lineWidth = 2.2; c.lineJoin = 'round'; c.beginPath();
  hist.forEach((p, i) => { const X = x0 + p.t/tMax*w, Y = Yv(p[k]); i ? c.lineTo(X, Y) : c.moveTo(X, Y); });
  c.stroke();
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function arrow(x1, y1, x2, y2, color, w = 9, head = 22){
  const ang = Math.atan2(y2-y1, x2-x1), len = Math.hypot(x2-x1, y2-y1);
  if (len < 3) return;
  const hd = Math.min(head, len*0.6);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.fillRect(0, -w/2, len-hd+1, w);
  ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len-hd, -hd*0.72); ctx.lineTo(len-hd, hd*0.72); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function gradArrow(x1, y, x2, w = 12){
  const g = ctx.createLinearGradient(0, 0, Math.abs(x2 - x1), 0);
  g.addColorStop(0, '#FFD54F'); g.addColorStop(1, COL.amber);
  arrow(x1, y, x2, y, g, w, 26);
}
function text(t, x, y, o = {}){
  ctx.font = o.math ? `${o.italic === false ? '' : 'italic '}${o.size || 22}px ${MATH}`
                    : `${o.weight || 400} ${o.size || 20}px ${FONT}`;
  // Position by measuring instead of relying on ctx.textAlign, which some viewers ignore.
  ctx.textAlign = 'left'; ctx.textBaseline = o.base || 'alphabetic';
  const w = ctx.measureText(t).width;
  const x0 = o.align === 'center' ? x - w/2 : o.align === 'right' ? x - w : x;
  ctx.fillStyle = o.color || COL.ink; ctx.fillText(t, x0, y);
  return w;
}
const P = (v, x) => v.ox + x*v.s;
const Y = (v, y) => v.gy - y*v.s;

function drawFloor(v, o = {}){
  const gy = v.gy;
  const sc = (o.scroll || 0) * v.s;
  if (o.rough){
    ctx.fillStyle = COL.rough; ctx.fillRect(0, gy, W, 30);
    ctx.strokeStyle = COL.roughLine; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    ctx.fillStyle = COL.roughLine;
    for (let i = 0; i < 240; i++){
      const x = ((i*61.3 - sc) % W + W) % W, y = gy + 4 + (i*37 % 23);
      ctx.fillRect(x, y, 2.4, 2.4);
    }
  } else {
    ctx.fillStyle = COL.ice; ctx.fillRect(0, gy, W, 30);
    ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    // glints on the ice
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2;
    for (let i = -1; i < 16; i++){
      const x = ((i*97 - sc) % (16*97) + 16*97) % (16*97) - 60;
      ctx.beginPath(); ctx.moveTo(x, gy+9); ctx.lineTo(x+26, gy+9); ctx.moveTo(x+38, gy+19); ctx.lineTo(x+50, gy+19); ctx.stroke();
    }
  }
  if (o.ticks){
    const { from, to, zero = 0 } = o.ticks;
    ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 1.5;
    for (let m = from; m <= to; m++){
      const x = P(v, zero + m) - sc % v.s * (o.scroll ? 1 : 0);
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy+8); ctx.stroke();
      if (!o.scroll) text(`${m < 0 ? '−' + (-m) : m} m`, x, gy+26, { size:13, align:'center', color:COL.muted });
    }
  }
  if (o.label) text(o.label, 884, gy+24, { size:14, align:'right', color:COL.muted });   // right end, clear of the push zone on either side
}
function drawFlag(x, gy, s){
  const top = gy - 1.55*s;
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
  ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x+5, gy-2); ctx.lineTo(x-4, top); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-4, top-4, 9, 0, 7); ctx.fill();
  const fx = x, fy = top + 10, fw = 0.72*s, fh = 0.46*s;
  ctx.beginPath();
  ctx.moveTo(fx, fy+6);
  ctx.bezierCurveTo(fx+fw*0.3, fy-8, fx+fw*0.55, fy+16, fx+fw, fy);
  ctx.lineTo(fx+fw, fy+fh);
  ctx.bezierCurveTo(fx+fw*0.6, fy+fh+16, fx+fw*0.35, fy+fh-12, fx+6, fy+fh+6);

}

/* Scenery of blocks (castle, the door's wall, the console): ink outlines over pale cool greys, never a physics colour.
   blocks(): a rectangle of stone blocks, rows of `row` px, joints staggered, outlined in ink. */
const STONE = { fill:'#E6ECF1', alt:'#DCE4EA', joint:'rgba(27,37,48,.38)', dark:'#29323C' };
function blocks(x, y, w, h, o = {}){
  const row = o.row || 28, bw = o.bw || 58;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = STONE.fill; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = STONE.joint; ctx.lineWidth = 1.3;
  for (let r = 0, yy = y + h; yy > y; r++, yy -= row){
    const off = r % 2 ? bw/2 : 0;
    for (let xx = x - off, i = 0; xx < x + w; xx += bw, i++){
      if ((r*3 + i) % 5 === 0){ ctx.fillStyle = STONE.alt; ctx.fillRect(xx + 1, yy - row + 1, bw - 2, row - 2); }
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy - row); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(x, yy - row); ctx.lineTo(x + w, yy - row); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.2; ctx.strokeRect(x, y, w, h);
}
// merlons along the top edge of a block (battlements)
function merlons(x, top, w, n, mh = 26){
  const mw = w/(2*n - 1);
  for (let i = 0; i < n; i++) blocks(x + i*2*mw, top - mh, mw, mh, { row:mh, bw:mw });
}
// an arched opening or door: straight sides from the floor, a half circle on top
function archPath(cx, gy, w, h){
  const r = w/2;
  ctx.beginPath(); ctx.moveTo(cx - r, gy); ctx.lineTo(cx - r, gy - h + r); ctx.arc(cx, gy - h + r, r, Math.PI, 0); ctx.lineTo(cx + r, gy); ctx.closePath();
}

function dimLine(x1, y1, x2, y2, label, o = {}){
  ctx.strokeStyle = o.color || COL.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const vert = x1 === x2, k = 7;
  ctx.beginPath();
  if (vert){ ctx.moveTo(x1-k, y1); ctx.lineTo(x1+k, y1); ctx.moveTo(x2-k, y2); ctx.lineTo(x2+k, y2); }
  else { ctx.moveTo(x1, y1-k); ctx.lineTo(x1, y1+k); ctx.moveTo(x2, y2-k); ctx.lineTo(x2, y2+k); }
  ctx.stroke();
  if (label){
    if (vert) text(label, x1 + 10, (y1+y2)/2 + 6, { size:18, color:o.color, math:o.math });
    else text(label, (x1+x2)/2, y1 + 24, { size:17, align:'center', color:o.color, math:o.math });
  }
}

/* =========================================================
   Scene: Level 1 — push the box to the flag, on ice (μ = 0) or a rough floor
   Motion is computed analytically per phase so the numbers match the lesson exactly.
   F can be negative: the push then points left (−x), and so does everything that follows.
   ========================================================= */
// ด่านที่ 1's console and rod (m): con = [left, right, height] of the console Ryuka stands behind (its port is its right
// face); y = the rod's height (under the force arrow at 0.35 m); gap = from the box's front face to the front housing;
// house = [width, height] of that housing; rise / out = seconds for the housing to rise and for the rod to reach the box
const ROD = { con:[-0.42, -0.08, 0.5], y:0.13, gap:0.08, house:[0.3, 0.32], rise:0.25, out:0.3 };
function Level1(){
  const S = {
    view:{ ox:110, gy:470, s:110 }, m:40, mu:0, F:100, x0:0.6, d:0.8, targetX:4.6, flagX:5.9, tol:0.25,
    showMass:false, live:false, timeScale:1, dir:1,
    f(){ return this.mu*this.m*G; },
    // which way the push points: the slider's sign before a run, the run's own sign after
    aim(){ return this.phase === 'ready' ? (panelMode && pval.F < 0 ? -1 : 1) : this.dir; },
    reset(){
      this.box = { x:this.x0, v:0, a:0 };
      this.ry = { x:-0.25, y:0 };
      this.phase = 'ready'; this.t = 0; this.hist = [{ t:0, v:0, a:0, x:0 }]; this.bubble = null; this.flags = {};
      this.timeScale = 1; this.stop = null; this.dir = 1; this.rodS = null;
    },
    // ด่านที่ 1 since 19 Nov (rod: true): ริวกะ sets the force at a console, hops onto the box, and a rod (ก้าน) comes out
    // and pushes. rodS = { side (+1 out of the console behind the box, −1 out of a housing that rises in front of it),
    // tip (m, the rod's end), lift (0…1, the front housing) }. The rod's moment out (phase 'rod') comes before t = 0, so
    // the motion and its numbers are the same as before; the arrow stays the physics, the rod is grey ink.
    rodPort(side){ return side > 0 ? ROD.con[1] : this.x0 + 0.4 + ROD.gap; },
    // The push stretch drawn on the floor, [from, to] in m. Without the rod it is where the box's middle travels (to the
    // left of the start when F < 0). With the rod it is where the rod's pad travels: from the box's back face at the
    // start to where the rod stops, so the rod is seen pushing right to the end of it (the same stretch for F < 0,
    // where the pad is on the front face and travels the other way).
    zone(){ const z0 = this.rod ? this.x0 - 0.4 : this.aim() > 0 ? this.x0 : this.x0 - this.d; return [z0, z0 + this.d]; },
    beginPush(){                                      // the push starts: t = 0 from here, as it always did after the hop
      const c = this.box;
      this.phase = 'push'; this.timeScale = this.warp; this.t = 0;
      c.a = (this.F - this.dir*this.f())/this.m; this.hist = [{ t:0, v:0, a:c.a, x:0 }];
    },
    start(p){
      this.reset();
      this.F = p.F;
      if (p.m != null) this.m = p.m;
      if (p.mu != null) this.mu = p.mu;
      this.dir = this.F < 0 ? -1 : 1;
      this.phase = 'hop'; this.hopT = 0;
      // Speed up very slow runs (push barely beats friction) so nobody waits 20 s.
      const f = this.f(), net = Math.abs(this.F) - f;
      this.warp = 1;
      if (net > 0){
        const a1 = net/this.m, tp = Math.sqrt(2*this.d/a1), v1 = a1*tp;
        const tc = f > 0 ? v1/(f/this.m) : 0;
        this.warp = Math.max(1, (tp + Math.min(tc, 12))/7);
      }
    },
    rewind(){
      this.rw = { t:0, from:Math.max(-2, Math.min(this.box.x, 9.5)), onBox:this.ry.y > 0.3, rod:this.rodS ? { ...this.rodS } : null };
      this.phase = 'rewind'; this.timeScale = 1;
    },
    onParam(p){
      if (this.phase === 'stopped' || this.phase === 'idle') this.reset();
      if (this.live && this.phase === 'ready'){ if (p.m != null) this.m = p.m; if (p.mu != null) this.mu = p.mu; }
      this.Fset = p.F;                                // kept in the scene: the strip shows the value set, also in the back view
    },
    sample(){ const c = this.box; this.hist.push({ t:this.t, v:c.v, a:c.a, x:c.x - this.x0 }); },
    // What should be audible now (numbers only). The slide follows the speed seen on screen. As the box leaves the stage
    // only its loudness fades: the pitch must stay put, or leaving would sound like slowing down.
    sound(){
      if (this.phase === 'rewind') return { rw:1 };
      if (this.phase !== 'push' && this.phase !== 'coast') return null;
      const c = this.box, away = Math.max(0, c.x - 8.9, -1.9 - c.x);
      return { slide:Math.abs(c.v)*this.timeScale, fade:Math.max(0, 1 - away/3), rough:this.mu > 0 };
    },
    update(dt){
      const c = this.box, r = this.ry, f = this.f(), dir = this.dir, K = this.kay;
      if (K && K.to != null){                          // เคย์ walks to his spot (the friction room)
        const d = K.to - K.x, step = 1.3*dt/(this.timeScale || 1);
        if (Math.abs(d) <= step){ K.x = K.to; K.to = null; K.walk = 0; } else { K.x += Math.sign(d)*step; K.walk = (K.walk || 0) + dt; }
      }
      if (this.phase === 'ready' && this.live){ if (pval.m != null) this.m = pval.m; if (pval.mu != null) this.mu = pval.mu; }
      if (this.phase === 'rewind'){                    // played backwards: slide back, then hop back off the box
        const w = this.rw, T1 = 0.85, T2 = 1.2;
        w.t += dt; const k = Math.min(1, w.t/T1), e = k*k*(3 - 2*k);
        c.x = w.from + (this.x0 - w.from)*e; c.v = 0;
        if (w.rod && this.rodS){                       // the rod goes back in with the slide (it never meets the box coming back)
          const port = this.rodPort(w.rod.side);
          this.rodS.tip = w.rod.tip + (port - w.rod.tip)*e;
          if (w.rod.side < 0) this.rodS.lift = (w.rod.lift == null ? 1 : w.rod.lift)*(1 - e);
        }
        if (w.onBox){
          const h = Math.max(0, Math.min(1, (w.t - T1)/(T2 - T1)));
          r.x = c.x + (-0.25 - c.x)*h; r.y = 0.7*(1 - h) + Math.sin(h*Math.PI)*0.55;
        }
        if (w.t >= (w.onBox ? T2 : T1)){ this.reset(); emit('rewound'); }
        return;
      }
      if (this.phase === 'hop'){
        this.hopT += dt; const k = Math.min(1, this.hopT/0.5);
        r.x = -0.25 + (c.x + 0.25)*k; r.y = 0.7*k + Math.sin(k*Math.PI)*0.55;
        if (k >= 1){
          this.t = 0; this.idleT = 0;
          if (this.F !== 0 && Math.abs(this.F) > f){
            if (this.rod){ this.phase = 'rod'; this.rodT = 0; this.rodS = { side:dir, tip:this.rodPort(dir), lift:dir < 0 ? 0 : 1 }; }
            else this.beginPush();
          }
          else this.phase = 'idle';            // static friction (or nothing) holds it: ΣF = 0
        }
        return;
      }
      if (this.phase === 'rod'){                       // the rod comes out (the front housing rises first); t stays 0
        this.rodT += dt;
        const R = this.rodS, rise = R.side < 0 ? ROD.rise : 0, k = Math.max(0, Math.min(1, (this.rodT - rise)/ROD.out));
        if (R.side < 0) R.lift = Math.min(1, this.rodT/ROD.rise);
        const face = c.x - dir*0.4, port = this.rodPort(R.side);
        R.tip = port + (face - port)*k*k;
        if (k >= 1){ R.tip = face; this.beginPush(); }
        return;
      }
      if (this.phase === 'idle'){
        this.idleT += dt;
        if (this.idleT > 1.1 && !this.flags.nomove){ this.flags.nomove = 1; emit('nomove'); }
        return;
      }
      if (this.phase === 'push' || this.phase === 'coast'){
        this.t += dt;
        const pushEnd = this.x0 + dir*this.d;
        if (this.phase === 'push'){
          c.a = (this.F - dir*f)/this.m;                  // kinetic friction points against the sliding, which follows the push
          c.v = c.a*this.t; c.x = this.x0 + 0.5*c.a*this.t*this.t;
          if (this.rodS) this.rodS.tip = c.x - dir*0.4;      // the rod stays on the box's back face while it pushes
          if ((c.x - this.x0)*dir >= this.d){              // exact hand-off: v² = 2ad
            const A = Math.abs(c.a);
            c.x = pushEnd; c.v = dir*Math.sqrt(2*A*this.d);
            if (this.rodS) this.rodS.tip = pushEnd - dir*0.4;   // the rod stops at the end of the stretch; the box leaves it
            this.v1 = c.v; this.tRel = this.t = Math.sqrt(2*this.d/A);
            this.sample(); c.a = -dir*f/this.m; this.sample();   // a jumps at the hand-off: log both sides
            if (this.mu === 0 && dir > 0){ memo.F = this.F; memo.v1 = c.v; }
            this.phase = 'coast'; emit('pushEnd');
          }
        } else {
          const tc = this.t - this.tRel, dec = f/this.m, u = Math.abs(this.v1);
          if (dec > 0 && tc >= u/dec){                     // friction brings it to rest: s = v²/2a
            const ts = this.tRel + u/dec;
            c.v = 0; c.a = -dir*dec; c.x = pushEnd + dir*u*u/(2*dec); this.t = ts;
            this.sample(); c.a = 0; this.sample();
            this.hist.push({ t:ts*1.2 + 0.5, v:0, a:0, x:c.x - this.x0 });   // a flat stretch after it stops
            this.phase = 'stopped'; this.timeScale = 1;
            const err = c.x - this.targetX;
            this.stop = { x:c.x, err, ok:Math.abs(err) <= this.tol };
            emit('stopped', this.stop);
          } else {
            c.a = -dir*dec; c.v = this.v1 + c.a*tc; c.x = pushEnd + this.v1*tc + 0.5*c.a*tc*tc;
          }
        }
        r.x = c.x; r.y = 0.7;
        if (this.mu === 0 && dir > 0 && c.x > this.targetX + this.tol && !this.flags.over){ this.flags.over = 1; snd.bark(this.bubble = 'บ๊ายบาย~'); }   // sailing past the spot
        if (dir < 0 && c.x < pushEnd - 0.3 && !this.flags.wrong){ this.flags.wrong = 1; snd.bark(this.bubble = 'ผิดทางแล้ว!'); }
        if (c.x - 0.4 > this.flagX && !this.flags.pass){ this.flags.pass = 1; emit('passFlag'); }
        if ((c.x > 8.9 || c.x < -1.9) && this.phase !== 'stopped' && !this.flags.gone){ this.flags.gone = 1; emit('gone'); }
        if (this.phase !== 'stopped' && this.t - this.hist[this.hist.length-1].t > 0.05 && this.t < 60) this.sample();
      }
    },
    readout(){
      const c = this.box, f = this.f();
      let net = 0;
      if (this.phase === 'push') net = this.F - this.dir*f;
      else if (this.phase === 'coast') net = -this.dir*f;
      const moved = this.phase === 'push' || this.phase === 'coast' || this.phase === 'stopped';
      return [ num(net, 1), num(net/this.m, 2), num(c.v, 2), moved ? num(c.x - this.x0, 2) : '0.00', moved ? this.t.toFixed(2) : '0.00' ];
    },
    draw(){
      const v = this.view, c = this.box, r = this.ry, s = v.s, f = this.f(), rough = this.mu > 0, aim = this.aim();
      drawFloor(v, { rough, label: rough ? `พื้นฝืด μ = ${this.mu.toFixed(2)}` : 'ลานน้ำแข็ง' });
      // the hand only pushes over this short stretch (to the left of the start when F < 0)
      const z0 = this.zone()[0];
      ctx.fillStyle = 'rgba(255,159,58,.28)';
      ctx.fillRect(P(v, z0), v.gy + 1, this.d*s, 29);
      text('ช่วงผลัก', P(v, z0 + this.d/2), v.gy + 20, { size:13, align:'center', color:'#8a4d00' });
      // parking spot in front of the flag
      ctx.fillStyle = 'rgba(46,139,87,.25)';
      ctx.fillRect(P(v, this.targetX - this.tol), v.gy + 1, this.tol*2*s, 29);
      if (c.x < this.targetX - 0.05 && this.phase !== 'rewind')
        dimLine(P(v, c.x), v.gy + 40, P(v, this.targetX), v.gy + 40, `ระยะถึงจุดจอด ${(this.targetX - c.x).toFixed(1)} m`);
      drawFlag(P(v, this.flagX), v.gy, s);
      if (this.kay) drawKay(P(v, this.kay.x), v.gy - Math.abs(Math.sin((this.kay.walk || 0)*7))*4, s);   // behind everything the level draws
      this.drawGhosts();
      // the console stands in front of Ryuka while she is at it (she sets the force behind it, and hops off over it);
      // once she is on the box it is scenery behind the box, which may slide past it (F < 0)
      const conFront = this.phase === 'ready' || this.phase === 'hop' || (this.phase === 'rewind' && this.rw.t > 0.85);
      if (this.rod && !conFront) this.drawConsole();
      this.drawRod();
      drawBox(P(v, c.x), v.gy, s, this.showMass ? `${this.m} kg` : null);
      drawRyuka(P(v, r.x), Y(v, r.y), s);
      if (this.rod && conFront) this.drawConsole();
      if (this.phase === 'ready' && P(v, c.x) < 820 && !this.strip && !this.noFbd) fbd(P(v, c.x), 150, { f:rough, dir:aim });   // not while the box waits off to the right
      const pushing = this.phase === 'push' || (this.phase === 'idle' && this.F !== 0);
      if (pushing){
        const len = 30 + Math.min(Math.abs(this.F), 160)*0.9, y = Y(v, 0.35);
        const face = P(v, c.x - this.dir*0.4) - this.dir*4;            // the side of the box the hand pushes on
        gradArrow(face - this.dir*(len + 2), y, face);
        text(`F = ${num(this.F, 0)} N`, face - this.dir*(len/2 + 2), y - 18, { size:18, align:'center', math:true, italic:false });
      }
      // friction acts along the floor, opposite to the sliding (static: just enough to cancel the push)
      const fNow = this.phase === 'push' || this.phase === 'coast' ? f
                 : this.phase === 'idle' && this.F !== 0 ? Math.min(Math.abs(this.F), f) : 0;
      if (rough && fNow > 0){
        const fd = -this.dir, len = 24 + Math.min(fNow, 160)*0.9, fx = P(v, c.x);
        arrow(fx, v.gy - 7, fx + fd*len, v.gy - 7, COL.fric, 7, 16);
        text(`f = ${fNow.toFixed(1)} N`, P(v, c.x + fd*0.4) + fd*6, v.gy - 14, { size:16, align:fd < 0 ? 'right' : 'left', color:COL.fric, math:true, italic:false });
      }
      if (Math.abs(c.v) > 0.005 && P(v, c.x) < 720){       // velocity: thin blue arrow from the middle of the box (gone before its label reaches the panel)
        const fx = P(v, c.x), sg = Math.sign(c.v), len = sg*Math.min(220, Math.abs(c.v)*40), vy = Y(v, 0.35);
        velArrow(fx, vy, fx + len, vy);
        const label = `v = ${num(c.v, 2)} m/s`;
        if (sg > 0) text(label, Math.max(fx + len, P(v, c.x + 0.4)) + 6, vy + 5, { size:15, color:COL.vel, math:true, italic:false });
        else {                                             // heading left: keep the label on screen, on a white tag if it has to overlap the box
          ctx.font = `15px ${MATH}`;
          const w = ctx.measureText(label).width, xr = Math.max(w + 12, Math.min(fx + len, P(v, c.x - 0.4)) - 6);
          ctx.fillStyle = 'rgba(255,255,255,.88)'; rr(xr - w - 5, vy - 11, w + 10, 22, 6); ctx.fill();
          text(label, xr, vy + 5, { size:15, align:'right', color:COL.vel, math:true, italic:false });
        }
      }
      drawLegend();
      // the bubble travels with Ryuka: behind the panel, out the other side, until she leaves the stage
      // (going left it waits at the edge until she is gone)
      if (this.bubble && P(v, r.x) - 50 < W && P(v, r.x) + 60 > 0) bubble(this.bubble, Math.max(12, P(v, r.x) - 30), Y(v, r.y + 1.35), { size:26 });
      if (this.timeScale > 1) text(`เร่งเวลา ×${this.timeScale.toFixed(1)}`, 24, 108, { size:17, color:COL.muted });
      if (this.handLabel && this.phase === 'coast' && !this.flags.gone) text(this.rod ? 'ก้านหลุดแล้ว' : 'มือหลุดแล้ว', 70, 120, { size:24 });   // the same words as the lesson's scene
      if (this.strip && (this.strip !== 'runs' || this.runs.length)) drawStrip(this.stripSpec());
      if (this.thought){                               // a thought over เคย์ (4-00)
        const k = this.kay, tx = this.thought.who === 'kay' && k ? k.x : r.x;
        thoughtBubble(this.thought.text, P(v, tx), this.thought.who === 'kay' ? v.gy - KAY_H*s : Y(v, r.y + 1.2), { right:660 });
      }
    },
    // the console where ริวกะ sets the force (ด่านที่ 1): a blocky machine with a screen and a button; the rod comes out
    // of its port on the right, at the height of the box's lower part (under the force arrow)
    drawConsole(){
      const v = this.view, x1 = P(v, ROD.con[0]), x2 = P(v, ROD.con[1]), top = Y(v, ROD.con[2]), gy = v.gy;
      ctx.save();
      ctx.fillStyle = STONE.fill; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.2;
      rr(x1, top, x2 - x1, gy - top + 1, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#C9D4DD'; ctx.lineWidth = 1.6; rr(x1 + 6, top + 7, x2 - x1 - 12, 14, 3); ctx.fill(); ctx.stroke();   // the screen
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x1 + 10, top + 14); ctx.lineTo(x1 + 10 + (x2 - x1 - 20)*0.6, top + 14); ctx.stroke();
      ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc((x1 + x2)/2, top + 32, 6, 0, 7); ctx.fill();                           // the button
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x1 + 5, top + 46); ctx.lineTo(x2 - 5, top + 46); ctx.stroke();
      ctx.fillStyle = STONE.dark; ctx.fillRect(x2 - 2, Y(v, ROD.y) - 7, 4, 14);                                                  // the rod's port
      ctx.restore();
    },
    drawRod(){
      const R = this.rodS; if (!R) return;
      const v = this.view, s = v.s, gy = v.gy, y = Y(v, ROD.y), port = this.rodPort(R.side);
      if (R.side < 0 && R.lift > 0){                   // the housing in front of the box, risen out of a slot in the floor
        const hx1 = P(v, port), hx2 = P(v, port + ROD.house[0]), hh = ROD.house[1]*s*R.lift;
        ctx.save();
        ctx.strokeStyle = STONE.dark; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hx1 - 3, gy + 1); ctx.lineTo(hx2 + 3, gy + 1); ctx.stroke();
        ctx.fillStyle = STONE.fill; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.2;
        rr(hx1, gy - hh, hx2 - hx1, hh + 1, 4); ctx.fill(); ctx.stroke();
        if (R.lift > 0.95){ ctx.fillStyle = STONE.dark; ctx.fillRect(hx1 - 2, y - 7, 4, 14); }
        ctx.restore();
      }
      const x1 = P(v, port), x2 = P(v, R.tip), dirP = Math.sign(x2 - x1);
      if (!dirP) return;
      ctx.save();
      ctx.fillStyle = '#C3CDD6'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.rect(Math.min(x1, x2 - dirP*5), y - 4, Math.abs(x2 - dirP*5 - x1), 8); ctx.fill(); ctx.stroke();   // the shaft
      const pw = 6, ph = 0.24*s;                       // the pad, flat on the box's face
      ctx.fillStyle = '#AEB9C4'; ctx.beginPath(); ctx.rect(dirP > 0 ? x2 - pw : x2, y - ph/2, pw, ph); ctx.fill(); ctx.stroke();
      ctx.restore();
    },
    // ghosts: earlier runs where they stopped, with the value they were pushed with and the distance from the start
    drawGhosts(){
      const v = this.view, s = v.s;
      (this.ghosts || []).forEach(g => {
        const cx = P(v, g.x);
        ctx.save(); ctx.globalAlpha = 0.3; rr(cx - 0.4*s, v.gy - 0.7*s, 0.8*s, 0.7*s, 0.24*s); ctx.fillStyle = COL.teal; ctx.fill(); ctx.restore();
        g.label.forEach((t, i) => text(t, cx, v.gy - 0.7*s - 50 + i*26 - (g.up || 0), { size:i ? 18 : 16, align:'center', color:i ? COL.ink : COL.muted, math:!!i, italic:false }));
      });
    },
    // the equation strip from the scene's own values (strip 'phases': pushing / sliding / stopped; 'runs': one box per run)
    stripSpec(){
      if (this.strip === 'runs') return { pic:false, w:200, y:64, size:14, on:this.runs.length - 1, states:this.runs, legend:this.stripLegend };
      const F = this.phase === 'ready' ? (this.Fset == null ? 0 : this.Fset) : Math.abs(this.F), m = this.m, f = this.f(), net = F - f;
      const on = this.stripOn != null ? this.stripOn : { push:0, coast:1, stopped:2 }[this.phase];
      return { pic:false, w:252, y:64, size:14, on:on == null ? -1 : on, legend:[['ΣF', 'แรงลัพธ์ (N)'], ['f', 'แรงเสียดทาน (N)'], ['m', 'มวล (kg)'], ['a', 'ความเร่ง (m/s²)']],
        states:[
          { label:'ระหว่างผลัก', lines:[`{F|ΣF} = {F|F} − {f|f} = ${F} − ${f.toFixed(2)} = ${net.toFixed(2)} N`, `a = {F|ΣF}/{m|m} = ${net.toFixed(2)}/${m} = ${net >= 0 ? '+' : '−'}${Math.abs(net/m).toFixed(2)} m/s²`, '{v|v} เพิ่มขึ้น'] },
          { label:'ไถล (มือหลุดแล้ว)', lines:[`{F|ΣF} = −{f|f} = −${f.toFixed(2)} N`, `a = {F|ΣF}/{m|m} = −${f.toFixed(2)}/${m} = −${(f/m).toFixed(2)} m/s²`, '{v|v} ลดลง'] },
          { label:'หยุด', lines:['{F|ΣF} = 0', 'a = 0', '{v|v} = 0'] }] };
    }
  };
  S.reset();
  return S;
}

/* Lesson: box still sliding — the floor scrolls so the motion is visible */
function Moving(vel){
  return {
    view:{ ox:0, gy:470, s:110 }, v:vel, scroll:0, bubble:null, cx:640,
    update(dt){ this.scroll += this.v*dt; },
    sound(){ return { slide:Math.abs(this.v), soft:true }; },   // under the lesson's lines: quiet
    draw(){
      const v = this.view;
      drawFloor(v, { scroll:this.scroll });
      // speed streaks
      ctx.strokeStyle = 'rgba(61,123,116,.35)'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++){
        const y = v.gy - 20 - i*24, off = (this.scroll*110*1.7 + i*40) % 60;
        ctx.beginPath(); ctx.moveTo(this.cx - 70 - off, y); ctx.lineTo(this.cx - 120 - off, y); ctx.stroke();
      }
      drawBox(this.cx, v.gy, v.s);
      drawRyuka(this.cx, v.gy - 0.7*v.s, v.s);
      const len = Math.min(220, this.v*40), vy = v.gy - 0.35*v.s;
      velArrow(this.cx, vy, this.cx + len, vy);
      drawLegend();
      text('ยังขยับอยู่ >>', this.cx - 75, v.gy - 0.7*v.s - 70, { size:26, align:'right' });
      text(`v = ${this.v.toFixed(2)} m/s (คงที่)`, this.cx, v.gy + 56, { size:19, align:'center', color:COL.muted });
      if (this.bubble) bubble(this.bubble, this.cx + 40, v.gy - 0.7*v.s - 145, { size:26, align:'center' });
    }
  };
}

/* ปูพื้นฐาน 2-01: a force is an arrow; the buttons on the board push light, hard or to the left (the last one stays faint) */
const PUSHES = { light:[70, 'ผลักเบา'], strong:[170, 'ผลักแรง'], left:[-170, 'ผลักไปทางซ้าย'] };
function ForceDemo(){
  return {
    view:{ ox:110, gy:470, s:110 }, now:null, prev:null,
    update(){},
    draw(){
      const v = this.view, s = v.s, cx = 330;
      drawFloor(v, {}); drawLegend();
      drawBox(cx, v.gy, s); drawRyuka(cx, v.gy - 0.7*s, s);
      const one = (k, y, faint) => {
        if (!k) return;
        const [len, name] = PUSHES[k], d = Math.sign(len);
        ctx.save(); ctx.globalAlpha = faint ? 0.3 : 1;
        arrow(cx, y, cx + len, y, COL.red, 9, 22);
        ctx.restore();
        if (faint) text(name, cx + len + d*10, y + 6, { size:14, color:COL.muted, align:d > 0 ? 'left' : 'right' });
        else text('F', cx + len + d*10, y + 9, { math:true, size:26, align:d > 0 ? 'left' : 'right' });
      };
      one(this.prev, 300, true); one(this.now, 240, false);
      if (this.now){                              // the hand: an amber push against the side it pushes from
        const d = this.now === 'left' ? -1 : 1, face = cx - d*0.4*s - d*4, len = this.now === 'light' ? 50 : 110;
        gradArrow(face - d*len, v.gy - 0.35*s, face);
      }
    }
  };
}

/* Lesson: push → let go, looping, with the board rows lit by phase */
function PushDemo(F, strip = null){
  const a = F/40;
  const tp = Math.sqrt(2*0.8/a), tc = Math.min(2.2, 3.2/(a*tp)), tw = 0.8;
  return {
    view:{ ox:120, gy:470, s:110 }, t:0, x:0, v:0, ph:'push', strip,
    update(dt){
      this.t += dt;
      if (this.t < tp){ this.ph = 'push'; this.v = a*this.t; this.x = 0.5*a*this.t*this.t; }
      else if (this.t < tp + tc){ this.ph = 'coast'; this.v = a*tp; this.x = 0.5*a*tp*tp + this.v*(this.t - tp); }
      else if (this.t < tp + tc + tw){ this.ph = 'wait'; }
      else { this.t = 0; }
      const r1 = $('rowPush'), r2 = $('rowCoast');
      if (r1){ r1.classList.toggle('on', this.ph === 'push'); r2.classList.toggle('on', this.ph === 'coast'); }
    },
    draw(){
      const v = this.view, cx = P(v, 0.4 + this.x);
      drawFloor(v, {});
      drawBox(cx, v.gy, v.s);
      drawRyuka(cx, v.gy - 0.7*v.s, v.s);

/* =========================================================
   The equation strip on the scene (frames 3-06 … 3-08, 4-03/4-04, 6-03/6-05, 7-03): one box per phase or per run,

   sp = { x, y, w (box width), pic (false: no small pictures), floor:'rough', on (index lit; -1 none), blank (no lines
          yet: a question is waiting), size (font px), states:[{ label, push, pushLen, vel:'grow'|'same'|'shrink',
          vlen, mass, fric, lines:['{F|ΣF} = {F|F} = 100 N', …] }], legend:[['ΣF', 'แรงลัพธ์ (N)'], …] }

const INK = { F:COL.red, f:COL.fric, v:COL.vel, m:COL.teal };
function richWords(line){                        // words (split at spaces), each made of coloured pieces
  const parts = [], re = /\{(\w)\|([^}]*)\}/g; let m, last = 0;
  while ((m = re.exec(line))){ if (m.index > last) parts.push([line.slice(last, m.index), null]); parts.push([m[2], INK[m[1]]]); last = re.lastIndex; }
  if (last < line.length) parts.push([line.slice(last), null]);

  parts.forEach(([t, c]) => t.split(/( )/).forEach(p => { if (p === ' ') words.push([]); else if (p) words[words.length - 1].push({ t:p, c }); }));
  return words.filter(w => w.length);
}
function drawRich(line, x, y, maxW, size, dry){ // wraps at spaces; returns the baseline after the last row
  ctx.font = `${size}px ${MATH}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const space = ctx.measureText(' ').width;

    if (cx > x && cx + ww > x + maxW){ cx = x + 10; y += size*1.3; }
    for (const p of w){ if (!dry){ ctx.fillStyle = p.c || COL.ink; ctx.fillText(p.t, cx, y); } cx += ctx.measureText(p.t).width; }

  ctx.fillStyle = floor === 'rough' ? COL.rough : COL.ice; ctx.fillRect(x, gy, w, 10);
  ctx.strokeStyle = floor === 'rough' ? COL.roughLine : COL.iceLine; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
  const s = 34, bx = x + w*0.48;

  if (st.mass) text(st.mass, bx, gy - 6, { size:11, align:'center', color:'#fff', math:true, italic:false });
  if (st.push){ const L = st.pushLen || 44; arrow(bx - 0.4*s - 3 - L, gy - 0.35*s, bx - 0.4*s - 3, gy - 0.35*s, COL.red, 6, 13); }
  if (st.fric) arrow(bx, gy - 3, bx - 30, gy - 3, COL.fric, 4, 9);
  if (st.vel){
    const now = st.vlen == null ? 40 : st.vlen, before = st.vel === 'grow' ? now*0.55 : st.vel === 'shrink' ? now*1.6 : now, vy = gy - 0.35*s;
    velArrow(bx, vy - 8, bx + before, vy - 8, COL.velLight, 3, 9);

}
function drawStrip(sp){

  const fs = sp.size || 15, picH = sp.pic === false ? 0 : 76, inner = bw - 16;
  const linesH = Math.max(fs*1.3, ...sp.states.map(st => (st.lines || []).reduce((y, l) => drawRich(l, 0, y, inner, fs, true), 0)));
  const boxH = 30 + (picH ? picH + 6 : 0) + (sp.blank ? fs*1.3*2 : linesH) + 6;

  rr(x0, y0, W, Hh, 18); ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fill();
  ctx.restore();
  sp.states.forEach((st, i) => {

    rr(bx, by, bw, boxH, 12); ctx.fillStyle = lit ? '#FFF1E0' : '#fff'; ctx.fill();
    ctx.lineWidth = lit ? 2.5 : 1.5; ctx.strokeStyle = lit ? COL.amber : '#D6E2EA'; ctx.stroke();

/* บทเรียน : แรงเสียดทาน 5-03: the friction run as a strobe picture, every half push time, with a ticker tape above it */
function FricStrobe(F){

  const at = t => t <= tp ? 0.5*a1*t*t : t < ts ? 0.8 + v1*(t - tp) - 0.5*a2*(t - tp)**2 : 0.8 + v1*v1/(2*a2);
  const xs = []; for (let t = 0; t < ts - 1e-6; t += dt) xs.push(at(t));

      ctx.fillStyle = COL.ink; pts.forEach(x => { ctx.beginPath(); ctx.arc(x, 232, 4.5, 0, 7); ctx.fill(); });

// A lesson scene with only the floor, the legend and a strip (3-07, 3-08)
function StripScene(strip, floor){

/* The strobe picture (3-09 … 3-12): the box every dt seconds of the player's own push (dt = half the push time, so the
   positions are 0, 0.2, 0.8, 1.6, 2.4, 3.2, 4.0 m for any push). Tap mode (3-10): the next box has an amber frame and
   ‘แตะ’; tapping it (or Enter, or the dialogue bar) drops its dot on the board's graph. measure: the definition of x on
   the floor, from the start to the box at t = 3·dt. */
function Strobe(o){
  const a = o.a, tp = Math.sqrt(2*0.8/a), v1 = a*tp, dt = tp/2;
  const xs = Array.from({ length:7 }, (_, i) => { const t = i*dt; return t <= tp ? 0.5*a*t*t : 0.8 + v1*(t - tp); });
  return {
    view:{ ox:110, gy:470, s:110 }, x0:0.6, xs, dt, tp, tapMode:false, tapped:o.tapped || 0, measure:false, caption:o.caption,
    update(){},
    tap(px, py){                                 // a click on the scene: the next box, if that is where it landed
      if (!this.tapMode || this.tapped >= this.xs.length) return false;
      const v = this.view, cx = P(v, this.x0 + this.xs[this.tapped]);
      if (Math.abs(px - cx) > 52 || py < v.gy - 0.7*v.s - 30 || py > v.gy + 30) return false;
      this.tapped++; snd.fx('tick'); emit('tap', this.tapped);
      return true;
    },
    draw(){
      const v = this.view, s = v.s, n = this.xs.length;
      drawFloor(v, {});
      text(this.caption, 146, 120, { size:18, color:COL.muted });
      this.xs.forEach((x, i) => {
        const cx = P(v, this.x0 + x), last = i === n - 1;
        ctx.save(); ctx.globalAlpha = last ? 1 : 0.32;
        rr(cx - 0.4*s, v.gy - 0.7*s, 0.8*s, 0.7*s, 0.24*s); ctx.fillStyle = COL.teal; ctx.fill();
        ctx.restore();
        if (!last){ ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(61,123,116,.75)'; ctx.lineWidth = 1.5; rr(cx - 0.4*s, v.gy - 0.7*s, 0.8*s, 0.7*s, 0.24*s); ctx.stroke(); ctx.setLineDash([]); }
        ctx.fillStyle = this.tapMode && i >= this.tapped ? '#b5bcc6' : COL.teal;
        ctx.beginPath(); ctx.arc(cx, v.gy + 15, 5, 0, 7); ctx.fill();
        if (this.tapMode && i === this.tapped){
          ctx.strokeStyle = COL.amber; ctx.lineWidth = 3; rr(cx - 0.4*s - 5, v.gy - 0.7*s - 5, 0.8*s + 10, 0.7*s + 10, 0.24*s + 4); ctx.stroke();
          text('แตะ', cx, v.gy - 0.7*s - 14, { size:17, align:'center', color:'#8a4d00', weight:600 });
        }
      });
      const xl = P(v, this.x0 + this.xs[n - 1]);
      text('กล่อง', xl, v.gy - 0.7*s + 22, { size:16, align:'center', color:'rgba(255,255,255,.85)' });
      drawRyuka(xl, v.gy - 0.7*s, s);
      dimLine(P(v, this.x0), v.gy + 44, P(v, this.x0 + 0.8), v.gy + 44, 'ระหว่างผลัก');
      dimLine(P(v, this.x0 + 0.8) + 6, v.gy + 44, xl, v.gy + 44, 'ก้านหลุดแล้ว');
      if (this.measure){
        const xm = P(v, this.x0 + this.xs[3]);
        dimLine(P(v, this.x0), 352, xm, 352, '');
        text(`x = ${this.xs[3].toFixed(1)} m (ตอน t = ${num(3*this.dt, 2)} s)`, (P(v, this.x0) + xm)/2, 338, { size:18, align:'center', math:true, italic:false });
        text('จุดเริ่ม', P(v, this.x0) - 10, 358, { size:15, align:'right', color:COL.muted });
      }
      drawLegend();
    }
  };
}
// a click on the scene goes to the scene (the strobe picture's boxes)
cv.addEventListener('click', e => {
  if (reading != null || !scene || !scene.tap) return;
  const r = cv.getBoundingClientRect();
  scene.tap((e.clientX - r.left)*W/r.width, (e.clientY - r.top)*H/r.height);
