/* Stacked graphs on one time axis, drawn on the board (3-10 … 3-12): g = { w, tMax, tStep, marks:[t], names (phase
   names over the top graph), segs:[{ t0, t1, a, v0, x0, name, fill, ink }], plots:[{ k:'x'|'v'|'a', h, yTicks, line
   (false: no line yet), upto (the line only up to this time), from, dots:[t], guide:t (dashed lines from that dot to
   both axes), tri:{ t0, t1, run, rise, runAbove } (an amber slope triangle with its legs labelled) }] } */
const PHASE = { push:['#FFF1E0', '#8a4d00'], coast:['#EEF4F3', '#2b5c56'], slide:['#F3EAF7', '#6c3483'], stop:['#EEF1F4', '#56606e'] };
function plotsSvg(g){
  const L = 70, R = 18, w = g.w || 500, Wd = w - L - R, top0 = g.names === false ? 8 : 24, gap = 12, AMB = '#C46A00';
  const gx = t => L + t/g.tMax*Wd;
  const seg = t => g.segs.find(s => t >= s.t0 - 1e-9 && t <= s.t1 + 1e-9) || g.segs[g.segs.length - 1];
  const at = (k, t, s = seg(t)) => { const u = t - s.t0; return k === 'a' ? s.a : k === 'v' ? s.v0 + s.a*u : s.x0 + s.v0*u + 0.5*s.a*u*u; };
  const H = top0 + g.plots.reduce((n, p) => n + p.h, 0) + gap*(g.plots.length - 1) + 34;
  let y = top0, out = '';
  if (g.names !== false) g.segs.forEach(s => out += `<text x="${(gx(s.t0) + gx(s.t1))/2}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="${s.ink}" font-family="${FONT}">${s.name}</text>`);
  g.plots.forEach((p, i) => {
    const lo = Math.min(0, ...p.yTicks), top = Math.max(...p.yTicks), hi = top + (top - lo)*0.15 || 1;
    const gy = val => y + p.h - (val - lo)/(hi - lo)*p.h, y0 = gy(0);
    g.segs.forEach(s => out += `<rect x="${gx(s.t0)}" y="${y}" width="${gx(s.t1) - gx(s.t0)}" height="${p.h}" fill="${s.fill}"/>`);
    (g.marks || []).forEach(t => out += `<line x1="${gx(t)}" y1="${y}" x2="${gx(t)}" y2="${y + p.h}" stroke="#9aa3ae" stroke-dasharray="4 4"/>`);
    out += `<line x1="${L}" y1="${y - 2}" x2="${L}" y2="${y + p.h}" stroke="#1B2530" stroke-width="1.5"/><line x1="${L}" y1="${y0}" x2="${L + Wd}" y2="${y0}" stroke="#1B2530" stroke-width="1.5"/>`;
    p.yTicks.forEach(val => out += `<line x1="${L - 4}" y1="${gy(val)}" x2="${L}" y2="${gy(val)}" stroke="#1B2530"/><text x="${L - 7}" y="${gy(val) + 4}" text-anchor="end" font-size="12" fill="#56606e" font-family="${MATH}">${+(+val).toFixed(2)}</text>`);
    out += `<text x="4" y="${y + 15}" font-size="17" font-style="italic" font-family="${MATH}" fill="#1B2530">${p.k}</text>
      <text x="4" y="${y + 31}" font-size="11" fill="#56606e" font-family="${FONT}">${AXIS[p.k][0]}</text>
      <text x="4" y="${y + 45}" font-size="11" fill="#56606e" font-family="${MATH}">(${AXIS[p.k][1]})</text>`;
    if (p.line !== false){
      const T0 = p.from || 0, T1 = p.upto == null ? g.tMax : p.upto, pts = [];
      g.segs.forEach(s => {
        const a = Math.max(T0, s.t0), b = Math.min(T1, s.t1);
        if (b < a) return;
        const m = p.k === 'x' && s.a ? 24 : 1;
        for (let j = 0; j <= m; j++){ const t = a + (b - a)*j/m; pts.push(`${gx(t).toFixed(1)},${gy(at(p.k, t, s)).toFixed(1)}`); }
      });
      if (pts.length) out += `<polyline points="${pts.join(' ')}" fill="none" stroke="#3D7B74" stroke-width="3.5" stroke-linejoin="round"/>`;
    }
    if (p.guide != null){
      const X = gx(p.guide), Y = gy(at(p.k, p.guide));
      out += `<line x1="${X}" y1="${Y}" x2="${X}" y2="${y0}" stroke="${AMB}" stroke-dasharray="4 3" stroke-width="2"/><line x1="${L}" y1="${Y}" x2="${X}" y2="${Y}" stroke="${AMB}" stroke-dasharray="4 3" stroke-width="2"/>`;
    }
    (p.dots || []).forEach(t => out += `<circle cx="${gx(t)}" cy="${gy(at(p.k, t))}" r="5" fill="#3D7B74" stroke="#fff" stroke-width="1.5"/>`);
    if (p.tri){
      const ax = gx(p.tri.t0), ay = gy(at(p.k, p.tri.t0)), bx = gx(p.tri.t1), by = gy(at(p.k, p.tri.t1));
      out += `<path d="M${ax},${ay} L${bx},${ay} L${bx},${by}" fill="none" stroke="${AMB}" stroke-width="2.5"/>
        <text x="${p.tri.runAbove ? bx + 4 : (ax + bx)/2}" y="${p.tri.runAbove ? ay - 6 : ay + 15}" text-anchor="${p.tri.runAbove ? 'start' : 'middle'}" font-size="13" font-weight="600" fill="${AMB}" font-family="${MATH}">${p.tri.run}</text>
        <text x="${bx + 5}" y="${p.tri.runAbove ? by + 14 : (ay + by)/2 + 4}" font-size="13" font-weight="600" fill="${AMB}" font-family="${MATH}">${p.tri.rise}</text>`;
    }
    if (i === g.plots.length - 1){
      for (let t = 0; t <= g.tMax + 1e-6; t += g.tStep) out += `<text x="${gx(t)}" y="${y + p.h + 16}" text-anchor="middle" font-size="12" fill="#56606e" font-family="${MATH}">${+t.toFixed(2)}</text>`;
      out += `<text x="${L + Wd}" y="${y + p.h + 31}" text-anchor="end" font-size="13" fill="#1B2530" font-family="${MATH}"><tspan font-style="italic">t</tspan> (s)</text>`;
    }
    y += p.h + gap;
  });
  return `<svg class="plots" viewBox="0 0 ${w} ${H}" width="${w}" role="img" aria-label="กราฟการเคลื่อนที่">${out}</svg>`;
}
// board pieces: a definition box (นิยาม), and the chain ΣF → a → v → x (its boxes appear one by one)
const defBox = html => `<div class="defbox"><span class="deftag">นิยาม</span> ${html}</div>`;
const chainHTML = (list, links) => `<div class="chain">${list.map((c, i) => `<div class="chainbox" style="animation-delay:${i*0.7}s"><b>${c[0]}</b><span>${c[1]}</span></div>${i < links.length

/* =========================================================
   Scene: Bonus — the box is stopped, Ryuka isn't → projectile
   ========================================================= */
function Projectile(){
  const S = {
    view:{ ox:40, gy:450, s:110 }, edge:1.8, hLaunch:1.9, flagX:4.8, tol:0.25, v:3,
    stopper:false, stopperDrop:1, showGuides:false, showPair:false, timeScale:1,
    reset(){
      this.phase = 'ready'; this.box = { x:0.2 }; this.ry = { x:0.2, y:1.9, rot:0 };
      this.dots = []; this.ft = 0; this.land = null; this.bubble = null; this.pairT = 9; this.flags = {}; this.timeScale = 1;
    },
    tFlight(){ return Math.sqrt(2*this.hLaunch/G); },
    start(v){

      this.v = v; this.phase = v > 0 ? 'roll' : 'still'; this.stillT = 0;
    },
    onParam(p){
      if (this.phase === 'landed' || this.phase === 'still'){ if (this.dots.length) this.ghost = this.dots; this.reset(); }
      if (this.phase === 'ready' && p.v != null) this.v = p.v;
    },
    dropStopper(){ this.stopper = true; this.stopperDrop = 0; },
    rewind(){
      const from = Math.min(this.box.x, 9.5), flew = this.dots.slice().reverse(), at = { x:this.ry.x, y:this.ry.y };
      if (flew.length) this.ghost = this.dots;        // the abandoned flight stays as the faint comparison
      this.reset(); this.phase = 'rewind'; this.rwT = 0; this.rwFrom = from;
      this.rwPath = flew.length ? [at, ...flew, { x:from, y:this.hLaunch }] : null;
    },
    pos(t){ return { x:this.edge + this.v*t, y:this.hLaunch - 0.5*G*t*t }; },
    sound(){                                       // slow motion lowers everything, because it scales the speed seen
      const p = this.phase, k = this.timeScale;
      if (p === 'rewind') return { rw:1 };
      if (p === 'roll' || p === 'slide') return { slide:this.v*k, soft:p === 'slide' };
      if (p === 'fly') return { air:Math.hypot(this.v, G*this.ft)*k, drop:Math.max(0, Math.min(1, this.ry.y/this.hLaunch)),
                                flyLeft:(this.tFlight() - this.ft)/k };   // seconds of flight still to show
      return null;
    },
    update(dt){
      if (this.stopperDrop < 1) this.stopperDrop = Math.min(1, this.stopperDrop + dt/0.45);
      const c = this.box, r = this.ry;
      switch (this.phase){
        case 'rewind': {                           // played backwards: the flight, then the slide to the start
          this.rwT += dt;
          const P = this.rwPath, T0 = P ? 0.6 : 0;
          r.rot = 0;
          if (this.rwT < T0){
            const f = this.rwT/T0*(P.length - 1), j = Math.floor(f), u = f - j, a = P[j], b = P[Math.min(j + 1, P.length - 1)];
            c.x = this.rwFrom; r.x = a.x + (b.x - a.x)*u; r.y = a.y + (b.y - a.y)*u;
          } else {
            const k = Math.min(1, (this.rwT - T0)/0.8), e = k*k*(3 - 2*k);
            c.x = this.rwFrom + (0.2 - this.rwFrom)*e; r.x = c.x; r.y = this.hLaunch;
            if (k >= 1){ this.phase = 'ready'; this.rwPath = null; emit('rewound'); }
          }
          break;
        }
        case 'still':
          this.stillT += dt;
          if (this.stillT > 0.9 && !this.flags.still){ this.flags.still = 1; emit('still'); }
          break;
        case 'roll':
          c.x += this.v*dt; r.x = c.x;
          if (c.x + 0.4 >= this.edge){
            const over = c.x + 0.4 - this.edge;
            c.x = this.edge - 0.4; r.x = c.x + over;
            this.phase = 'slide'; this.pairT = 0; this.timeScale = 0.35; emit('impact');
          }
          break;
        case 'slide':                              // box stopped; Ryuka keeps going (inertia, slippery top)
          this.pairT += dt; r.x += this.v*dt;
          if (r.x >= this.edge){ this.phase = 'fly'; this.ft = (r.x - this.edge)/this.v; this.nextDot = 0; }
          break;
        case 'fly': {
          this.pairT += dt; this.ft += dt;
          const tl = this.tFlight();
          while (this.nextDot <= Math.min(this.ft, tl) + 1e-9){ this.dots.push(this.pos(this.nextDot)); this.nextDot += 0.05; }
          const t = Math.min(this.ft, tl), p = this.pos(t);
          r.x = p.x; r.y = p.y; r.rot = Math.min(0.55, t*1.3);
          if (this.ft >= tl){
            this.ft = tl;
            const err = p.x - this.flagX, ok = Math.abs(err) <= this.tol;
            this.land = { x:p.x, err, ok };
            r.y = ok ? 0.16 : 0; r.rot = ok ? 0 : Math.PI/2;
            snd.bark(this.bubble = ok ? 'รอดแล้ว~' : 'โอ๊ย…');
            this.phase = 'landed'; this.timeScale = 1;
            emit('landed', this.land);
          }
          break;
        }
      }
    },
    readout(){
      // t: since the box is released; t_air: since Ryuka leaves the edge
      // x: measured from the platform edge (x = 0 where the flight starts, flag at x = D); negative on the platform
      if (this.phase === 'rewind') return [null, null, null, null, null, null];
      const x0 = 0.2, roll = this.edge - x0;
      // no values predicted for the landing before launch: the panel shows only what has happened (7-05)
      const inAir = this.phase === 'fly' || this.phase === 'landed';
      const ft = inAir ? this.ft : 0;
      const moving = this.phase !== 'ready' && this.phase !== 'still';
      const T = !moving ? 0 : inAir ? roll/this.v + ft : (this.ry.x - x0)/this.v;
      const X = (moving ? this.ry.x : x0) - this.edge;
      const vx = this.phase === 'still' || this.phase === 'ready' ? 0 : this.v;
      return [ T.toFixed(2), ft.toFixed(2), num(X, 2), (0.5*G*ft*ft).toFixed(2), vx.toFixed(2), num(ft ? -G*ft : 0, 2) ];
    },
    draw(){
      const v = this.view, s = v.s, c = this.box, r = this.ry;
      drawFloor(v, { ticks:{ from:-1, to:this.ticksTo || 5, zero:this.edge } });
      // ice platform
      const px0 = P(v, -0.8), px1 = P(v, this.edge + 0.12), top = Y(v, 1.2);
      ctx.fillStyle = '#C9E0EA'; ctx.fillRect(px0, top, px1 - px0, v.gy - top);
      ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 2; ctx.strokeRect(px0, top, px1 - px0, v.gy - top);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px0 + 20, top + 10); ctx.lineTo(px1 - 30, top + 10); ctx.stroke();
      text('แท่นน้ำแข็ง สูง 1.2 m', (px0 + px1)/2 - 10, top + 70, { size:16, align:'center', color:COL.muted });
      // stopper
      if (this.stopper){
        const drop = (1 - this.stopperDrop)*3.2;
        const sx = P(v, this.edge), sy = Y(v, 1.2 + 0.45 + drop);
        ctx.fillStyle = '#2b2f36'; rr(sx, sy, 0.12*s, 0.45*s, 4); ctx.fill();
        if (this.stopperDrop >= 1 && this.phase === 'ready') text('ที่กั้น', sx + 0.06*s, sy - 8, { size:15, align:'center', color:COL.muted });
      }
      // dimensions h and D
      const hx = P(v, this.edge + 0.32);
      if (!this.showPair){                                   // hidden while the impact-force pair is explained
      ctx.setLineDash([5, 5]); ctx.strokeStyle = '#b5bcc6'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(P(v, this.edge), Y(v, this.hLaunch)); ctx.lineTo(hx + 8, Y(v, this.hLaunch)); ctx.stroke();
      ctx.setLineDash([]);
      dimLine(hx, v.gy, hx, Y(v, this.hLaunch), '', { color:COL.muted });
      if (!this.showGuides && !['fly', 'landed'].includes(this.phase)) text('h = 1.9 m', hx + 10, Y(v, 0.55), { size:18, math:true, italic:false, color:COL.muted });
      }
      dimLine(P(v, this.edge), v.gy + 42, P(v, this.flagX), v.gy + 42, 'D = 3.0 m', { color:COL.muted });
      // flag + cushion
      drawFlag(P(v, this.flagX), v.gy, s);
      ctx.fillStyle = '#F6C76A'; rr(P(v, this.flagX - this.tol), v.gy - 0.16*s, 2*this.tol*s, 0.16*s, 8); ctx.fill();
      // strobe dots (every 0.05 s)
      if (this.showGuides && this.dots.length){
        ctx.setLineDash([4, 5]); ctx.strokeStyle = '#b5bcc6'; ctx.lineWidth = 1.2;
        this.dots.forEach(d => {
          ctx.beginPath(); ctx.moveTo(P(v, d.x), Y(v, d.y)); ctx.lineTo(P(v, d.x), v.gy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(P(v, d.x), Y(v, d.y)); ctx.lineTo(P(v, this.edge), Y(v, d.y)); ctx.stroke();
        });
        ctx.setLineDash([]);
      }
      if (this.ghosts){                                      // สำรวจ: every earlier flight, with a grey mark where it landed
        ctx.fillStyle = '#C9D1DC';
        this.ghosts.forEach(g => {
          g.dots.forEach(d => { ctx.beginPath(); ctx.arc(P(v, d.x), Y(v, d.y), 3, 0, 7); ctx.fill(); });
          const lx = P(v, g.x); ctx.beginPath(); ctx.moveTo(lx, v.gy + 4); ctx.lineTo(lx - 7, v.gy + 16); ctx.lineTo(lx + 7, v.gy + 16); ctx.fill();
        });
      } else if (this.ghost && this.ghost.length){           // previous try, for comparison
        ctx.fillStyle = '#C9D1DC';
        this.ghost.forEach(d => { ctx.beginPath(); ctx.arc(P(v, d.x), Y(v, d.y), 3, 0, 7); ctx.fill(); });
      }
      if (this.runs && this.runs.length) drawStrip({ pic:false, w:186, x:250, y:64, size:14, on:this.runs.length - 1, states:this.runs });
      ctx.fillStyle = COL.dot;
      this.dots.forEach(d => { ctx.beginPath(); ctx.arc(P(v, d.x), Y(v, d.y), 4, 0, 7); ctx.fill(); });
      // box + Ryuka
      drawBox(P(v, c.x), Y(v, 1.2), s);
      drawRyuka(P(v, r.x), Y(v, r.y), s, { rot:r.rot, lie:this.land && !this.land.ok });
      // 3rd-law pair at the impact
      if ((this.pairT < 0.22 && (this.phase === 'slide' || this.phase === 'fly')) || this.showPair){
        const ix = P(v, this.edge), iy = Y(v, 1.2 + 0.2);
        arrow(ix + 4, iy - 10, ix + 70, iy - 10, COL.red, 7, 16);
        arrow(ix - 4, iy + 12, ix - 70, iy + 12, COL.red, 7, 16);
        text('กล่องดันที่กั้น', ix + 22, iy + 16, { size:14 });
        text('ที่กั้นดันกล่อง', ix - 40, iy + 50, { size:14, align:'center' });
      }
      // velocity of Ryuka (14 px per m/s); in flight split into vx (constant) and vy (growing)
      // arrows start at Ryuka's belt (0.38 m above the feet), following the sprite's tilt in flight
      const K = 10, belt = 0.22*s, rot = r.rot || 0;
      const cx = P(v, r.x) - belt*Math.sin(rot), cy = Y(v, r.y) - 0.6*s + belt*Math.cos(rot);
      if (this.phase === 'ready' || this.phase === 'roll' || this.phase === 'slide'){
        if (this.v > 0){
          velArrow(cx, cy, cx + this.v*K, cy);
          text(`v = ${this.v.toFixed(1)} m/s`, Math.max(cx + this.v*K, cx + 46) + 8, cy + 6, { size:17, color:COL.vel, math:true, italic:false });
        }
      }
      if (this.phase === 'fly'){
        const vy = G*Math.min(this.ft, this.tFlight());
        arrow(cx - 26, cy, cx - 26, cy + 70, COL.red, 7, 16);
        if (cx - 60 > P(v, this.edge) + 16 && cy + 92 < v.gy - 6) text('mg', cx - 26, cy + 92, { math:true, size:20, align:'center' });   // under its arrow, not over the box
        velArrow(cx, cy, cx + this.v*K, cy, COL.velLight, 3, 11);
        velArrow(cx, cy, cx, cy + vy*K, COL.velLight, 3, 11);
        velArrow(cx, cy, cx + this.v*K, cy + vy*K);
        const lx = Math.max(cx + this.v*K, cx + 46) + 6, floorY = v.gy - 6;
        if (vy*K > 14) subLabel('v', 'x', lx, cy - 6, { size:18, color:'#5B7FD0' });   // once it splits from v
        if (vy*K > 40 && cy + vy*K + 4 < floorY) subLabel('v', 'y', cx + 6, cy + vy*K + 4, { size:18, color:'#5B7FD0' });
        const ry = cy + Math.max(vy*K, 20) + 20;
        if (ry < floorY) subLabel('v', '', lx + 2, ry, { size:20 });
      }
      drawLegend();
      if (this.land){
        const lx = P(v, this.land.x);
        ctx.fillStyle = this.land.ok ? '#2E8B57' : COL.red;
        ctx.beginPath(); ctx.moveTo(lx, v.gy + 4); ctx.lineTo(lx - 8, v.gy + 18); ctx.lineTo(lx + 8, v.gy + 18); ctx.fill();
      }
      if (this.bubble){
        if (this.land && !this.land.ok){
          if (this.land.x > this.flagX) bubble(this.bubble, P(v, r.x + 0.7), Y(v, 0.45));
          else bubble(this.bubble, P(v, r.x), Y(v, 1.15), { align:'center' });
        } else bubble(this.bubble, P(v, r.x), Y(v, 2.05), { align:'center' });
      }
      if (this.timeScale < 1) text('สโลว์โมชัน ×0.35', 24, 108, { size:17, color:COL.muted });
    }
  };
  S.reset();
  return S;
}

/* ---------- main loop ---------- */
let scene = null, last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (reading != null){                     // going back: draw that line's snapshot; the live scene waits
    const snap = lines[reading].scene;
    if (snap) snap.draw();
  } else if (scene){
    const e0 = emits;                       // several steps a frame only in debug mode; an event lets the story catch up first
    for (let i = 0, n = DBG.steps ? DBG.steps() : 1; i < n && emits === e0; i++) scene.update && scene.update((DBG.ap ? 1/60 : dt)*(scene.timeScale || 1));
    scene.draw();
  }
  snd.frame(reading != null || DBG.ap ? null : scene, zipping || stage.classList.contains('rewinding'));
  if (panelMode && reading == null) updateReadout();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   Lesson graphs: v–t, a–t or x–t of a run made of constant-acceleration pieces
   g = { tMax, segs:[{ t0, t1, a, v0, x0, name, fill, ink }], tTicks, yTicks:{ v, a, x }, legend:{ v, a, x }, caption(k) }
   ========================================================= */
function runSvg(k, g){
  const X0 = 60, X1 = 470, T = 26, B = 184;
  const gx = t => X0 + t/g.tMax*(X1 - X0);
  const at = (s, t) => { const u = t - s.t0; return k === 'a' ? s.a : k === 'v' ? s.v0 + s.a*u : s.x0 + s.v0*u + 0.5*s.a*u*u; };
  const pts = g.segs.flatMap(s => {
    const n = k === 'x' && s.a ? 24 : 1;
    return Array.from({ length:n + 1 }, (_, i) => { const t = s.t0 + (s.t1 - s.t0)*i/n; return [t, at(s, t)]; });
  });
  const ys = pts.map(p => p[1]);
  let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const span = hi - lo || 1;
  hi += span*0.25; if (lo < 0) lo -= span*0.15;
  const gy = y => B - (y - lo)/(hi - lo)*(B - T), y0 = gy(0);
  let svg = `<svg viewBox="0 0 520 215" width="480" role="img" aria-label="กราฟ${GRAPHS[k]}ของรอบที่ผลัก">`;
  g.segs.forEach(s => { if (s.fill) svg += `<rect x="${gx(s.t0)}" y="${T}" width="${gx(s.t1) - gx(s.t0)}" height="${B - T}" fill="${s.fill}"/>`; });
  svg += `<line x1="${X0}" y1="${y0}" x2="${X1 + 8}" y2="${y0}" stroke="#1B2530" stroke-width="1.5"/>
    <line x1="${X0}" y1="${T - 4}" x2="${X0}" y2="${B}" stroke="#1B2530" stroke-width="1.5"/>`;
  g.tTicks.forEach(t => svg += `<line x1="${gx(t)}" y1="${T}" x2="${gx(t)}" y2="${B}" stroke="#9aa3ae" stroke-dasharray="4 4"/>
    <text x="${gx(t)}" y="${B + 20}" text-anchor="middle" font-size="14" fill="#56606e" font-family="${MATH}">${t.toFixed(1)} s</text>`);
  g.yTicks[k].forEach(y => svg += `<line x1="${X0 - 5}" y1="${gy(y)}" x2="${X0}" y2="${gy(y)}" stroke="#1B2530" stroke-width="1.5"/>
    <text x="${X0 - 9}" y="${gy(y) + 5}" text-anchor="end" font-size="14" fill="#56606e" font-family="${MATH}">${num(y, 2)}</text>`);
  g.segs.forEach(s => svg += `<text x="${(gx(s.t0) + gx(s.t1))/2}" y="${T + 16}" text-anchor="middle" font-size="13" font-weight="700" fill="${s.ink}" font-family="${FONT}">${s.name}</text>`);
  const path = pts.map(p => `${gx(p[0]).toFixed(1)},${gy(p[1]).toFixed(1)}`).join(' ');
  if (k !== 'x') svg += `<polygon points="${gx(0)},${y0} ${path} ${gx(g.tMax)},${y0}" fill="rgba(61,123,116,.16)"/>`;   // the area the caption talks about
  svg += `<polyline points="${path}" fill="none" stroke="#3D7B74" stroke-width="4" stroke-linejoin="round"/>
    <text x="${X1 + 12}" y="${y0 + 5}" font-size="15" fill="#1B2530" font-family="${MATH}"><tspan font-style="italic" font-size="16">t</tspan> (s)</text>
    <text x="${X0 - 4}" y="${T - 9}" font-size="15" fill="#1B2530" font-family="${FONT}"><tspan font-style="italic" font-size="16" font-family="${MATH}">${k}</tspan> ${AXIS[k][0]} (${AXIS[k][1]})</text>`;
  return svg + '</svg>';
}
function graphBoard(g){
  const b = board(`<div class="gtop"><span class="tag">กราฟการเคลื่อนที่</span><div class="gtabs" role="group" aria-label="เลือกกราฟ">${Object.keys(GRAPHS).map(k =>
      `<button data-k="${k}" aria-pressed="false">${k}–t</button>`).join('')}</div></div><div class="gview"></div>`);
  b._graph = g;                                 // kept in the line's snapshot, so the back view can switch tabs too
  graphTabs(b, g);
  return b;
}
function graphView(b, g, k){
  b.querySelector('.gview').innerHTML = runSvg(k, g) +
    `<div class="gleg">${g.segs.map((s, i) => `<div><i style="background:${s.fill || '#fff'}"></i>${g.legend[k][i]}</div>`).join('')}</div>
     <div class="small">${g.caption(k)}</div>`;
  b.querySelectorAll('.gtabs button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === k));
}
function graphTabs(b, g, k = 'v'){
  b.querySelectorAll('.gtabs button').forEach(x => x.onclick = e => { e.stopPropagation(); graphView(b, g, x.dataset.k); });
  graphView(b, g, k);
}
const GRAPH_TIP = { v:'พื้นที่ใต้กราฟ v–t = การกระจัด', a:'พื้นที่ใต้กราฟ a–t = ความเร็วที่เปลี่ยนไป', x:'ความชันของกราฟ x–t = ความเร็ว' };

   ========================================================= */
/* The opening (0-01 … 0-03, story since 19 Nov): the player is ริวกะ. Outside the dungeon: a castle of blocks on the
   snow, in the levels' 2D side view, with ริวกะ in front of it. thought / phone: her thought bubble and the call
   bubble; walkT ≥ 0: she walks into the dark doorway and fades into it ('walkedIn'). Plain state, no audio: the back
   view draws a line's snapshot of it. */
const CASTLE = { door:880, doorW:132, doorH:184, start:400, walk:2.2, fade:0.8 };
function Castle(){
  return {
    view:{ gy:470, s:110 }, rx:CASTLE.start, alpha:1, walkT:-1, inside:false, thought:null, phone:null,
    update(dt){
      if (this.walkT < 0 || this.inside) return;
      this.walkT += dt;
      const C = CASTLE, k = Math.min(1, this.walkT/C.walk), e = k*(2 - k)*0.5 + k*0.5;
      this.rx = C.start + (C.door - C.start)*e;
      this.alpha = this.walkT <= C.walk ? 1 : Math.max(0, 1 - (this.walkT - C.walk)/C.fade);
      if (this.walkT >= C.walk + C.fade){ this.inside = true; this.alpha = 0; emit('walkedIn'); }
    },
    walkEnd(){ this.rx = CASTLE.door; this.alpha = 0; this.inside = true; this.walkT = CASTLE.walk + CASTLE.fade; },
    draw(){
      const gy = this.view.gy, s = this.view.s, C = CASTLE;
      drawSnow(gy);
      const tw = [[566, 690], [1070, 1194]], tTop = 168, wTop = 252;
      blocks(690, wTop, 380, gy - wTop);                               // the curtain wall between the towers
      merlons(690, wTop, 380, 7);
      tw.forEach(([a, b]) => {
        blocks(a, tTop, b - a, gy - tTop);
        merlons(a - 6, tTop, b - a + 12, 3, 28);
        [[tTop + 46], [tTop + 150]].forEach(([y]) => { ctx.fillStyle = STONE.dark; rr((a + b)/2 - 5, y, 10, 40, 5); ctx.fill(); });   // arrow slits
      });
      ctx.fillStyle = STONE.dark; archPath(C.door, gy, C.doorW, C.doorH); ctx.fill();   // the dark doorway
      ctx.save(); ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.4; archPath(C.door, gy, C.doorW, C.doorH); ctx.stroke();
      const r = C.doorW/2, ay = gy - C.doorH + r;                       // the stones of the arch
      ctx.beginPath(); ctx.arc(C.door, ay, r + 16, Math.PI, 0); ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let i = 1; i < 8; i++){ const a = Math.PI + i*Math.PI/8; ctx.beginPath(); ctx.moveTo(C.door + Math.cos(a)*r, ay + Math.sin(a)*r); ctx.lineTo(C.door + Math.cos(a)*(r + 16), ay + Math.sin(a)*(r + 16)); ctx.stroke(); }
      ctx.restore();
      const bob = this.walkT >= 0 && !this.inside && this.walkT < C.walk ? Math.abs(Math.sin(this.walkT*9))*5 : 0;
      drawRyuka(this.rx, gy - bob, s, { alpha:this.alpha });
      if (this.thought) thoughtBubble(this.thought, this.rx, gy - 1.2*s, { right:560 });
      if (this.phone) callBubble(this.phone, this.rx + 30, gy - 1.2*s + 22);
    }
  };
}
async function opening(){
  const C = scene = Castle();
  mark('0-01'); await say('ryuka', '“ไง! เค้าชื่อริวกะ เป็นเทพนะ เทพจริงๆ ไม่ได้โม้”');
  await say('ryuka', '“วันนี้นายจะได้เล่นเป็นเค้า ฝากตัวด้วยนะ!”');
  mark('0-02'); await say('ryuka', '“เมื่อกี้เค้ารับสายพ่อ (ยูอัน) พ่อบอกให้มาที่ดันเจี้ยนที่เพิ่งเจอ ก็ที่นี่แหละ”');
  C.thought = '(จริงๆ คืออกหัก…)';                // set before the line, so its snapshot in the back view has it
  await say('ryuka', '“เค้าเหงาๆ อยู่พอดี ก็เลยมา”');
  C.thought = null;
  mark('0-03'); C.phone = '📞 พ่อ'; snd.fx('ring');  // the call comes in
  await sleep(900);
  await say('yuan', '“ถึงแล้วใช่ไหม เข้าไปได้เลย เดี๋ยวอยู่ในสายคอยบอกให้เอง”');
  C.phone = null;
  if (calm()) C.walkEnd();                          // reduced motion and the debug autopilot: she is inside at once
  else { C.walkT = 0; await waitEvent('walkedIn'); }
}
// o.resume: back here from the back view, with the values already on the panel (no intro, time rewinds)
// Frames 1-01 … 1-08: the setting and what to watch, a prediction, the push, then a challenge question with three ways
// on: right → the short lesson; "pushed too hard" → one more push, softer, to test it, then the full lesson; the force
// is stuck in the box / don't know → IN-3: ปูพื้นฐาน, or ปูพื้นฐานแบบเต็ม and then ปูพื้นฐาน; then the full lesson (memo.path). The retest push has its own panel mode
// (push1b), so a try resumed from the back view knows which stage it belongs to.
async function chapter1(o = {}){
  setTitle(PART_NAME.ch1);
  board(null);
  const L = scene = Level1();
  L.showMass = true; L.handLabel = true; L.rod = true;   // the push comes from a rod set at the console (since 19 Nov)
  let retest = o.resume && panelMode === 'push1b', toldBack = false;
  if (!o.resume){
    memo.path = null;
    showPanel(null);
    await opening();                                // 0-01 … 0-03 outside, then the ice room
    scene = L;
    mark('1-01'); await say('yuan', '“ห้องนี้มีแผงควบคุมอยู่ ตั้งแรงแล้วขึ้นไปยืนบนกล่อง จะมีก้านยื่นออกมาผลักกล่องด้วยแรงเท่าที่ตั้งไว้”');
    await say('yuan', '“ลานนี้เป็นน้ำแข็ง ลื่นมาก กล่องกับริวกะมีมวลรวม 40 kg ก้านผลักได้แค่ช่วง 0.8 m แรก แล้วก้านจะหลุดจากกล่อง”');
    await say('yuan', '“รอบนี้ให้จับตาดูอย่างเดียว: หลังก้านหลุดแล้ว กล่องเป็นยังไง”');
    mark('1-02'); const A = ask('p1-after-release', 'หลังก้านหลุดจากกล่อง กล่องจะเป็นยังไง ?',
      ['ค่อยๆ ช้าลงแล้วหยุด', 'หยุดทันที', 'ไปต่อด้วยความเร็วเท่าเดิม', 'ไม่แน่ใจ'], { tag:'ทายก่อน' });
    say('yuan', '“ก่อนผลัก ลองทายดูก่อนนะ เลือกคำตอบบนกระดานได้เลย”', { wait:false });
    memo.pred1 = await A.pick();
    await say('yuan', '“โอเค จำคำตอบของนายไว้นะ เดี๋ยวได้รู้กัน”');
    board(null);
  }
  if (!(o.resume && /^push1b?$/.test(panelMode))) showPanel('push1', { F:memo.F });
  if (o.resume){ await rewindFx(L); L.onParam(pval); }
  levelNow = L;
  while (true){
    newTry();
    try {
      board(null);
      const mode = retest ? 'push1b' : 'push1';
      if (panelMode !== mode) showPanel(mode, { F:pval.F }, true);
      lockPanel(false);
      mark('1-03'); say('yuan', '“นายลองผลักกล่องให้ไปจอดตรงช่องหน้าธงหน่อย”', { wait:false });
      const { F } = await waitPlay();
      lockPanel(true);
      L.start({ F, m:40, mu:0 });
      if (F === 0){
        await waitEvent('nomove');
        track.attempt({ F, m:40, mu:0 }, 'nomove');
        await say('yuan', '“ไม่ผลักเลยมันก็นิ่งอยู่อย่างนั้นแหละ ออกแรงหน่อยสิ”');
        L.reset(); continue;
      }
      await waitEvent('pushEnd');
      if (F < 0){                                   // pushed the wrong way: it still never stops, just on the other side
        say('yuan', '“เดี๋ยวๆ ธงอยู่ทางขวานะ! ทำไมผลักไปทางซ้ายล่ะ”', { wait:false });
        await waitEvent('gone');
        track.attempt({ F, m:40, mu:0 }, 'wrong-way');
        await say('ryuka', '“แล้วก็ไม่หยุดอีก ไถลไปทางซ้ายเรื่อยๆ เลย อ้ากกก”', { panic:true });
        if (!toldBack){
          toldBack = true;
          await say('yuan', `“แรงมีทิศทาง เครื่องหมายบอกทิศ F = ${num(F, 0)} N แปลว่าผลักไปทางซ้าย (ทิศ −x) กล่องเลยเร่งไปทางซ้าย พอก้านหลุดก็ไถลไปทางซ้ายด้วยความเร็วคงที่ ไม่หยุดเหมือนกัน”`);
        }
        await say('yuan', '“ย้อนเวลาให้ ลองผลักไปทางธงด้วยแรงที่เป็นบวกดูนะ”');
        await rewindFx(L);
        continue;
      }
      mark('1-04'); say('ryuka', '“แค่นี้น่าจะพอให้ไปจอดหน้าธงแล้ว หยุดผลักได้เลย”', { wait:false });
      await waitEvent('passFlag');
      await waitEvent('gone');
      track.attempt({ F, m:40, mu:0 }, 'gone');
      await say('ryuka', '“อะไรนะ หยุดผลักแล้วหรอ แต่ทำไมมันไม่หยุดอ่ะ อ้ากกก”', { panic:true });
      if (retest){                                  // 1-07: softer (or not), it still does not stop
        const lastF = memo.ch1F;
        const note = lastF != null && lastF !== F ? `รอบนี้ผลัก ${F} N รอบก่อน ${lastF} N ` : '';
        memo.path = 'full';
        await say('yuan', `${note}ผลักแรงหรือเบาแค่ไหน พอเลิกผลักแล้วกล่องก็ไม่หยุดเองสักที… ไปดูกันว่าเพราะอะไร`);
        break;
      }
      memo.ch1F = F;
      showPanel(null);                              // the board covers the panel
      mark('1-05'); const C = ask('c1-why-no-stop', '', ['เพราะไม่มีแรงมาต้านให้กล่องช้าลง', 'เพราะแรงผลักยังติดอยู่ในกล่อง', 'เพราะผลักแรงเกินไป', 'ไม่รู้'],
        { tag:'คำถามท้าทาย', correct:0, tags:['', 'force-kept-in-box', 'pushed-too-hard', 'dont-know'] });
      say('yuan', '“นายรู้ไหมว่าทำไมกล่องถึงไม่หยุด ?”', { wait:false });
      const pick = await C.pick();
      if (pick === 0){
        mark('1-06'); memo.path = 'short';
        await say('yuan', '“ใช่เลย บนน้ำแข็งไม่มีแรงอะไรมาต้าน กล่องเลยไม่ช้าลง งั้นไปดูกันสั้นๆ ว่าเขียนเป็นสมการได้ยังไง”');
        break;
      }
      if (pick === 2){
        mark('1-07'); await say('yuan', '“งั้นลองพิสูจน์ดู ย้อนเวลาให้ คราวนี้ผลักให้เบากว่าเดิม”');
        retest = true;
        board(null); showPanel('push1b', { F }, true);
        await rewindFx(L);
        continue;
      }
      // ข / ง: IN-3 (its caption replaces 1-08's line): the short ปูพื้นฐาน, or the full one first
      mark('1-08'); mark('IN-3');
      memo.path = await CUT.in3() === 1 ? 'long' : 'basics';
      break;
    } catch (e){ await retried(e, L); }
  }
  endLevel();
  board(null);
  showPanel(null);
}

// บทเรียน : แรงลัพธ์และความเฉื่อย (frames 3-01 … 3-17). memo.path 'short' (the challenge answered right): 3-04 → 3-14 →
// quiz 1, and a wrong first pick there opens the full lesson, whose quiz 1 is then logged as q1-inertia-again.
// Every path ends at the door of the friction room (3-18, since 19 Nov).
async function lesson(){
  setTitle(PART_NAME.lesson);
  showPanel(null); board(null);
  if (memo.path === 'short' && await lessonShort()){ board(null); await doorPart(); return; }
  await lessonFull(memo.path === 'short' ? 'q1-inertia-again' : 'q1-inertia');
  board(null);
  await doorPart();
}
async function lessonShort(){
  mark('3-17'); scene = Diagram();
  sumFBoard();
  await say('yuan', '“เอาแรงทั้ง 3 แรงนี้มารวมกัน เรียกว่าแรงลัพธ์ เขียนย่อว่า ΣF ต่อจากนี้เห็น ΣF เมื่อไหร่ ให้นึกถึงแรงทุกแรงที่กระทำต่อกล่องรวมกัน”', { pop:POP.sumF });
  const M = scene = Moving(memo.v1); M.cx = 330;
  await law1Part(M);
  return quiz1('q1-inertia', { leaveOnWrong:true });
}

}
async function law1Part(M){                       // 3-14
  board(`<span class="tag">กฎการเคลื่อนที่ข้อที่ 1 ของนิวตัน</span>
    <div class="law">ถ้า <b>${SF()} = 0</b><br>• วัตถุที่<b>นิ่ง</b>อยู่ จะนิ่งต่อไป<br>• วัตถุที่<b>เคลื่อนที่</b>อยู่ จะเคลื่อนที่ด้วย<b>ความเร็วคงที่</b>ในแนวเส้นตรง</div>

  await say('yuan', '“นั่นเพราะพื้นมี<b>แรงเสียดทาน</b>มาต้าน ซึ่งก็เป็นแรงภายนอกเหมือนกัน ΣF เลยไม่เป็น 0 แต่ลานนี้เป็นน้ำแข็ง แรงเสียดทานแทบเป็นศูนย์ เลยไม่มีอะไรมาหยุดกล่องเลย”');
}

    ['กล่องค่อยๆ ช้าลง เพราะแรงผลักที่ติดอยู่ในกล่องค่อยๆ หมดไป',
     'กล่องเคลื่อนที่ด้วยความเร็วคงที่ เพราะแรงลัพธ์เป็นศูนย์',
     'กล่องหยุดทันที เพราะไม่มีแรงผลักแล้ว',
     'กล่องเร็วขึ้นเรื่อยๆ เพราะยังมีความเร่งเหลืออยู่'],
    1,
    'แรงลัพธ์เป็น 0 ความเร่งก็เป็น 0 ความเร็วจึงคงที่ตามกฎข้อ 1',
    ['แรงไม่ได้ติดอยู่ในกล่อง มันหายไปทันทีที่ก้านหลุด และถ้าไม่มีแรงต้าน ความเร็วก็ไม่ลดลง ลองใหม่นะ',
     '',
     'แรงลัพธ์เป็นศูนย์แปลว่าความเร็ว “ไม่เปลี่ยน” ไม่ได้แปลว่าหยุด ถ้าจะหยุดต้องมีแรงมาต้าน ลองใหม่นะ',
     'ความเร่งมีได้เฉพาะตอนที่มีแรงลัพธ์ (a = ΣF/m) พอ ΣF = 0 ความเร่งก็เป็น 0 ทันที ลองใหม่นะ'],
    ['force-stored-in-object', '', 'no-force-means-stop', 'acceleration-lingers'], o);

// 3-03: tap the forces that act while pushing; each right one puts its arrow on the box, friction is the wrong one on ice
async function pickForces(D){
  const LIST = [['mg', 'น้ำหนัก <i class="math">mg</i>'], ['N', 'แรงที่พื้นดันขึ้น <i class="math">N</i>'], ['F', 'แรงผลัก <i class="math">F</i>'], ['f', 'แรงเสียดทาน <i class="math">f</i>']];
  board(`<span class="tag">แรงที่กระทำต่อกล่อง</span><div class="q">ตอนที่ก้านกำลังผลัก มีแรงอะไรกระทำต่อกล่องบ้าง ? (เลือกทุกข้อที่มี)</div>
    <div class="chips">${LIST.map(([k, t]) => `<button class="chip" data-k="${k}">${t}</button>`).join('')}</div>`, true);
  const chips = [...$('board').querySelectorAll('.chip')], got = new Set(), picks = [], t0 = performance.now();
  let tFirst = 0;
  say('yuan', '“แตะเลือกแรงบนกระดานได้เลย เลือกได้หลายข้อ”', { wait:false });
  while (got.size < 3){
    const k = await cutTry(new Promise(res => chips.forEach(c => c.onclick = () => res(c.dataset.k))));
    if (!picks.length) tFirst = performance.now() - t0;
    const i = LIST.findIndex(x => x[0] === k), c = chips[i];
    picks.push(i);
    if (k === 'f'){
      c.classList.add('wrong'); c.disabled = true; snd.fx('wrong');
      await say('yuan', '“บนน้ำแข็งแทบไม่มีแรงเสียดทาน นี่แหละสิ่งที่หายไป”');
      say('yuan', '“แตะเลือกแรงบนกระดานได้เลย เลือกได้หลายข้อ”', { wait:false });
      continue;
    }
    got.add(k); c.classList.add('on'); c.disabled = true; snd.fx('right');
    if (k === 'F') D.showF = true; else D.show[k] = true;
  }
  track.picks('pick-forces', picks, !picks.includes(3), picks.includes(3) ? 'friction-on-ice' : '', tFirst, performance.now() - t0);
  await say('yuan', '“ครบแล้ว ตอนผลักมี 3 แรง คือน้ำหนัก แรงที่พื้นดันขึ้น และแรงผลัก”');
}
async function lessonFull(qid){
  const F = memo.F, a = F/40, v1 = memo.v1, tp = Math.sqrt(2*memo.d/a), dt = tp/2;
  mark('3-01'); let M = scene = Moving(v1);
  await say('ryuka', '“เหมือนจะมีอะไรหายไปสักอย่างนะ ?”');
  snd.bark(M.bubble = '“ช่วยเค้าก่อน👉👈”');
  mark('3-02'); await say('yuan', '“ที่หายไปคือแรงที่จะมาหยุดกล่อง บนน้ำแข็งไม่มีอะไรมาต้านมันเลย”');
  if (memo.pred1 === 0 || memo.pred1 === 1){         // predicted at 1-02 that it would stop
    await say('yuan', '“ตอนแรกนายทายว่ากล่องจะหยุด”');
    await say('yuan', 'ถ้าจริงแบบนั้น กล่องคงหยุดไปตั้งนานแล้ว นี่แหละ<b>จุดที่เข้าใจผิด</b> มาแยกดูทีละแรงกัน');
  } else if (memo.pred1 === 2) await say('yuan', '“นายทายไว้ถูกแล้วว่ากล่องจะไปต่อ มาแยกดูทีละแรงกันว่าทำไม”');
  else await say('yuan', '“มาแยกดูทีละแรงกัน ว่าตอนนี้มีแรงอะไรกระทำต่อกล่องบ้าง”');

  mark('3-03'); const D = scene = Diagram();
  D.show = { N:false, mg:false }; D.showF = false;
  await pickForces(D);
  mark('3-04'); sumFBoard();
  await say('yuan', '“เอาแรงทั้ง 3 แรงนี้มารวมกัน เรียกว่าแรงลัพธ์ เขียนย่อว่า ΣF ต่อจากนี้เห็น ΣF เมื่อไหร่ ให้นึกถึงแรงทุกแรงที่กระทำต่อกล่องรวมกัน”', { pop:POP.sumF });
  mark('3-05'); D.hiY = true;
  board(`<span class="tag">แรงในแนวแกน y</span>
         <div class="eqMid">${SF('y')} = <i>N</i> − <i>mg</i> = 0</div>
         <div class="cap">พื้นดันขึ้น (<i class="math">N</i>) กับน้ำหนัก (<i class="math">mg</i>)<br>หักล้างกันพอดี</div>
         <div class="small">กล่องเลยไม่จมพื้นและไม่ลอยขึ้น</div>`);
  await say('yuan', '“แรงในแนวแกน y หักล้างกันหมด เป็น 0 อยู่ตลอดเวลา เหลือแต่แรงผลักในแนวแกน x”', { pop:POP.sumFy });

  // 3-06: the x axis, with the equation strip on the scene lit by phase
  mark('3-06'); const LEG = [['ΣF', 'แรงลัพธ์ (N)'], ['m', 'มวล (kg)'], ['a', 'ความเร่ง (m/s²)']];
  scene = PushDemo(F, { w:230, legend:LEG, states:[
    { label:'ระหว่างผลัก', push:true, vel:'grow', lines:[`{F|ΣF} = {F|F} = ${F} N`, `a = {F|ΣF}/{m|m} = ${F}/40 = ${a.toFixed(2)} m/s²`] },
    { label:'ก้านหลุดแล้ว', vel:'same', lines:['{F|ΣF} = 0', 'a = 0'] }] });
  board(`<span class="tag">แรงในแนวแกน x และความเร่ง</span>
         <div class="eqMid">แกน x : ${SF('x')} = ?</div>
         <div class="row" id="rowPush">ระหว่างผลัก: ${SF('x')} = <i class="math">F</i><sub>ผลัก</sub> = <b>${F} N ≠ 0</b><br>
           <span class="math">a</span> = ${SF('x')}/<i class="math">m</i> = ${F}/40 = <b>${a.toFixed(2)} m/s²</b> → ความเร็วเพิ่มขึ้น</div>
         <div class="row" id="rowCoast">ก้านหลุดแล้ว: <i class="math">F</i><sub>ผลัก</sub> = 0 → ${SF('x')} = <b>0</b><br>
           <span class="math">a</span> = 0 → ความเร็ว<b>คงที่</b></div>`);
  await say('yuan', `“ตอนที่ผลักอยู่ กล่องรับแรงลัพธ์ ${F} N ซึ่ง<b>ไม่ใช่ 0</b> มันเลยมีความเร่ง ความเร็วเพิ่มขึ้นเรื่อยๆ (นี่คือกฎข้อ 2: ΣF = ma)”`, { pop:POP.newton2 });
  await say('yuan', '“พอก้านหลุดออกจากกล่อง แรงผลักก็หายไปทันที แรงลัพธ์ถึงจะกลับมาเป็น 0”');

  // 3-07, 3-08: one relationship at a time, guessed before the numbers show
  mark('3-07'); const S7 = scene = StripScene({ w:230, blank:true, on:1, states:[

/* 3-18 (since 19 Nov): the end of this lesson, on every path. ริวกะ is still on the box sliding on the ice (the floor
   scrolls and the box stays at cx, as in Moving); a wall of blocks with a closed door comes in from the right; the box
   hits the door and stops ('impact': the thud, โอ๊ย!, ริวกะ lurches on, and the 3rd-law pair at the contact as the bonus
   draws it at the stopper). Then the door opens and she gets down and limps in ('walkedIn'). wall: the screen x of the
   door's face. Plain state for the back view. */
function DoorScene(vel){
  const s = 110;
  return {
    view:{ ox:0, gy:470, s }, v:vel, cx:330, scroll:0, wall:W + 60, phase:'slide', t:0, bubble:null, pair:false, open:0,
    ry:{ dx:0, y:0.7, rot:0, alpha:1, k:1 },
    face(){ return this.cx + 0.4*s; },
    hit(still){
      this.wall = this.face(); this.phase = 'hit'; this.t = still ? 9 : 0; this.pair = true;
      snd.bark(this.bubble = 'โอ๊ย!'); emit('impact');
    },
    walk(){ this.phase = 'walk'; this.t = 0; this.pair = false; this.bubble = null; },
    walkEnd(){ this.walk(); this.t = 99; this.update(0); },
    sound(){ return this.phase === 'slide' ? { slide:this.v, soft:true } : null; },
    update(dt){
      const r = this.ry;
      if (this.phase === 'slide'){

// a line that moves on only once every button on the board has been pressed (pressing still works after that)
async function untilAllPressed(line, sel, onPress){

    }

    ctx.fillStyle = '#0E1726'; ctx.fillRect(0, 0, W, H);

  function stars(x0, x1, cam){
    ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip();
    const span = x1 - x0;
    for (let i = 0; i < 46; i++){
      const bx = (i*137.5) % span, y = 20 + (i*89.3) % 520, r = i % 5 === 0 ? 2.4 : 1.4;
      const x = x0 + ((bx - cam) % span + span) % span;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.75)' : 'rgba(180,205,255,.9)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // a run on the rough floor: pushed at a steady 4 m/s (push = friction = 80 N), let go at t = rel, slides to a stop.
  const S4OX = 260;
  function slideState(t, rel){
    if (t < rel) return { x:-4*(rel - t), v:4, pushing:true, tau:0 };
    const tau = Math.min(t - rel, 2);
    return { x:4*tau - tau*tau, v:4 - 2*tau, pushing:false, tau, stopped:t - rel >= 2 };
  }
  function slideRun(t, o){
    const r = slideState(t, o.rel), cx = o.ox + r.x*S;
    drawFloor(GY, { rough:true });
    if (o.ruler) ruler(o.ox, GY, 0, 8);
    if (o.pics) [0, 0.5, 1, 1.5, 2].forEach(s => { if (!r.pushing && s <= r.tau + 1e-6){ const xp = 4*s - s*s; if (Math.abs(xp - r.x) > 0.02) ghost(o.ox + xp*S, GY); } });
    group('obj', () => {
      gameBox(cx);
      if (r.pushing) pushMark(cx, GY, 80);
      hForce(cx, GY, ramp(t, [[0, 80], [o.rel, 0]]), { label:r.pushing && o.labelF ? 'F' : null, sym:true });
      const fLen = t < o.rel + 2 ? 80 : ramp(t, [[0, 80], [o.rel + 2, 0]]);
      fForce(cx, GY, fLen, { label:fLen > 20 ? 'f' : null });
      vArrow(cx, VY_GAME, r.v);
    });
    PROBE.world = { box:r.x, v:r.v, tau:r.tau }; PROBE.px = { box:cx };
  }

  // S3-01: two boxes floating in space. Right box: pushed with 40 N for 1.5 s (a = 1 m/s²), then drifts at 1.5 m/s.
  function space(t, beat){
    sky();
    const L = { x:320, y:300 }, ox = 760, Fpush = 40, a = 1, tp = 1.5;
    let x, v, pushing, tag = 'มีแรงกระทำ', cam = 0, picsAt = [];
    if (beat === 'a'){
      const u = clamp(t - 0.5, 0, tp); x = 0.5*a*u*u; v = a*u; pushing = t >= 0.5;
    } else {
      const x1 = 0.5*a*tp*tp, v1 = a*tp; x = x1 + v1*t; v = v1; pushing = false;
      if (t >= 0.4) tag = 'ไม่มีแรงกระทำ';
      cam = Math.max(0, ox + x*S - 1060);
      for (let s = 0; s <= t + 1e-6; s += 1) picsAt.push(x1 + v1*s);
    }
    stars(0, 638, 0); stars(642, W, cam);
    const cy = 300;                                   // box centre height (floats; baseY = cy + 0.35 s)
    drawBox(L.x, cy + 0.35*S);
    ctx.save(); ctx.beginPath(); ctx.rect(642, 0, 638, H); ctx.clip();
    picsAt.forEach(px => { if (Math.abs(px - x) > 0.02) ghost(ox + px*S - cam, cy + 0.35*S, 1, true); });
    const cx = ox + x*S - cam;
    drawBox(cx, cy + 0.35*S);

    f.beats = f.beats.flatMap((b, oi) => Array.isArray(b.cap)
      ? b.cap.map((c, k) => Object.assign(Object.create(b), { cap:c, oi, part:k + 1, cont:k > 0 }))
      : [Object.assign(b, { oi })]);

  // picture, so a looping beat stops looping; from: the beat ข้าม was pressed on (◂ on the end screen goes back there)

    'จึงทำให้|ความเร็วเปลี่ยนไป”', 'มันไปต่อ|ด้วยความเร็วคงที่', 'กล่องใบเดียว|โดนหลายแรงพร้อมกัน', 'เหมือนตอน|ไม่มีแรงมากระทำ|ในกฎข้อ',
    'เราก็บอกได้ว่า|ความเร็วจะเป็นเท่าไหร่', 'คือความเร็วต้น|ซึ่งเท่ากับ', 'ในขณะเดียวกันนั้น|ที่กั้นก็ดันกล่องกลับ|ด้วยแรงขนาดเท่ากัน|ในทิศตรงข้าม', 'แรงจากที่กั้นนี่แหละ|ที่ทำให้กล่องหยุดลง”',
    'สังเกตว่า|มันกระทำกับวัตถุคนละก้อน', 'จึงไม่สามารถ|นำมาหักล้างกันได้”', '“พอกล่อง|หยุดเคลื่อนที่', 'ก็ไม่มีการเสียดสี|ระหว่างกล่องกับพื้นอีก',
    '“นายได้เห็นมาแล้วว่า|กล่องที่เคลื่อนที่|บนน้ำแข็ง|จะเคลื่อนที่ต่อไป|แบบไม่หยุด', 'วัตถุจะอยู่นิ่ง|หรือเคลื่อนที่|ด้วยความเร็วคงที่ต่อไป', 'เป็นเครื่องหมาย|แทนผลรวม'
  ].map(r => [r.replace(/\|/g, ''), r.split('|')]));
  function chunkHTML(html){
    let plain = ''; const bold = [];                         // the text without tags, and its <b> ranges
    html.split(/(<\/?b>)/).forEach(p => { if (p === '<b>') bold.push([plain.length, plain.length]); else if (p === '</b>') bold[bold.length - 1][1] = plain.length; else plain += p; });
    const keep = bold.slice();                               // ranges no break may fall inside
    const add = re => { for (const m of plain.matchAll(re)) keep.push([m.index, m.index + m[0].length]); };
    add(/[A-Za-zΣΔ½0-9−(][A-Za-zΣΔ½0-9.÷×=+−\/²() ]*[A-Za-z0-9²)]/g);   // a formula, a number with its unit (2 m/s, 40 kg)
    add(/\d+(?:\.\d+)? (?:วินาที|เท่า|ข้อ)/g);                   // 1 วินาที, 2 เท่า, 3 ข้อ
    add(/(?:หน่วย)?(?:นิวตัน|กิโลกรัม) \([A-Za-z]+\)/g);         // นิวตัน (N), หน่วยกิโลกรัม (kg)
    add(/ข้อ \d+/g);                                         // กฎข้อ 1
    // nor before a token of one or two letters or digits (F”, N, mg, 0)”): it never starts a line alone
    for (const m of plain.matchAll(/ (?=([^\s]+))/g)) if (m[1].replace(/[”)\].,]/g, '').length <= 2) keep.push([m.index - 1, m.index + 2]);
    const inside = i => keep.some(([a, b]) => i > a && i < b);
    const cut = new Map();                                   // where a line may start → what separates it from the piece before
    for (let i = 0; i < plain.length; i++) if (plain[i] === ' ' && !inside(i) && !inside(i + 1)) cut.set(i + 1, ' ');
    let s = 0;
    plain.split(' ').forEach(run => {
      const parts = WORD_BREAKS[run];
      if (parts){ let at = s; parts.forEach((w, k) => { at += w.length; if (k < parts.length - 1 && !inside(at)) cut.set(at, ''); }); }
      s += run.length + 1;
    });
    const pos = [0, ...[...cut.keys()].sort((a, b) => a - b), plain.length + 1];
    let out = '';
    for (let k = 0; k < pos.length - 1; k++){
      const a = pos[k], sep = cut.get(pos[k + 1]) ?? '', b = pos[k + 1] - sep.length;
      let h = '', i = a;                                     // a <b> range never crosses a cut
      bold.filter(([x, y]) => y > a && x < b).forEach(([x, y]) => { h += esc(plain.slice(i, Math.max(i, x))) + '<b>' + esc(plain.slice(Math.max(x, a), Math.min(y, b))) + '</b>'; i = Math.min(y, b); });
      out += `<span class="nb">${h + esc(plain.slice(i, b))}</span>` + (k < pos.length - 2 ? (sep === ' ' ? ' ' : '<wbr>') : '');
    }
    return out;
  }
  const tick = () => snd.fx('tick');

  // the game's scene while the cutscene plays: the main loop steps and draws it
  const stageScene = {
    update(dt){
      if (st.manual) return;
      const b = beat();
      st.age += dt;
      if (b.loop && st.hold) return;                                                     // tapped: frozen on its fullest moment
      if (calm()){ if (st.t < endT(b)) st.t = Math.min(endT(b), st.t + dt); return; }   // reduced motion: no idle loop
      st.t += dt;
      if (b.loop && !st.hold && st.t >= b.dur + REST) st.t = 0;                         // rest, then play again
    },
    draw(){ drawBeat(); }
  };
  let veil = null, vctx = null;
  function drawBeat(){
    const b = beat(), t = st.t;
    ctx.save();
    LOG = []; PROBE = { arrows:[] };
    b.draw.call(b, t);
    ctx.restore();
    const holes = typeof b.spot === 'function' ? (b.spot.call(b, t) || []).filter(Boolean) : null;
    if (holes && holes.length){                      // the spotlight: a dark veil (≈ 55 %) with soft-edged holes, on with the caption
      const a = 0.55*ss(Math.max(t, st.age)/0.4), k = cv.width/W;
      if (!veil){ veil = document.createElement('canvas'); vctx = veil.getContext('2d'); }
      if (veil.width !== cv.width || veil.height !== cv.height){ veil.width = cv.width; veil.height = cv.height; }
      vctx.setTransform(1, 0, 0, 1, 0, 0); vctx.clearRect(0, 0, veil.width, veil.height);
      vctx.globalCompositeOperation = 'source-over'; vctx.fillStyle = `rgba(12,18,28,${a})`; vctx.fillRect(0, 0, veil.width, veil.height);
      vctx.globalCompositeOperation = 'destination-out';
      vctx.shadowColor = '#000'; vctx.shadowBlur = 22*k; vctx.shadowOffsetX = 4000*k;
      vctx.fillStyle = '#000';
      holes.forEach(h => { vctx.beginPath(); vctx.roundRect((h.x - 4000 - 10)*k, (h.y - 10)*k, (h.w + 20)*k, (h.h + 20)*k, (h.r + 10)*k); vctx.fill(); });
      vctx.shadowColor = 'transparent'; vctx.shadowOffsetX = 0; vctx.globalCompositeOperation = 'source-over';
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(veil, 0, 0); ctx.restore();
      PROBE.holes = holes.map(h => ({ x:Math.round(h.x), y:Math.round(h.y), w:Math.round(h.w), h:Math.round(h.h) })); PROBE.veil = a;
    }
  }

  function go(id, bi = 0, o = {}){
    st.fi = byId[id];
    const n = frame().beats.length;
    st.bi = bi < 0 ? n - 1 : Math.min(bi, n - 1);
    st.t = 0; st.age = 0; st.hold = false; st.manual = false; st.forced = !!o.replay;
    if (beat().cont && !o.replay){ st.t = beat().dur; st.age = 1; }      // part 2 of a caption: the picture as it ended
    if (DBG.ap || (calm() && !o.replay)) st.t = endT(beat());
    showBeat();
  }
  function showBeat(){
    const f = frame(), b = beat(), out = /^OUT/.test(f.id);
    mark(f.id);
    const tx = $('dtext');
    tx.innerHTML = chunkHTML(b.cap); tx.style.fontSize = '';
    tx.classList.remove('in'); void tx.offsetWidth; tx.classList.add('in');
    // the definition box (BRIEF rule 10): top left, below the chips in scene 2
    const def = DEFS[f.id + '/' + b.oi], box = $('cutDef');
    box.hidden = !def;
    if (def){
      const [tag, term, line, form, note] = def;   // note: a third row in plain words (S3-02: how Σ is read)
      $('cutDefTag').textContent = tag; $('cutDefTerm').textContent = term || ''; $('cutDefTerm').hidden = !term;
      $('cutDefLine').innerHTML = chunkHTML(line);
      $('cutDefF').innerHTML = form ? chunkHTML(form) : '';
      $('cutDefN').innerHTML = note ? chunkHTML(note) : ''; $('cutDefN').hidden = !note; $('cutDefF').hidden = !form;
      box.style.top = f.chip != null ? '80px' : '16px';
      box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');
    }
    // the four force chips (S2-02 … S2-05)
    const chips = $('cutChips');
    chips.hidden = f.chip == null;
    chips.innerHTML = f.chip == null ? '' : CHIPS.map(([th, sym, to], i) =>
      `<button class="fchip${i === f.chip ? ' lit' : ''}" data-to="${to}" aria-pressed="${i === f.chip}">${th} <i>${sym}</i></button>`).join('');
    chips.querySelectorAll('.fchip').forEach(c => c.onclick = e => { e.stopPropagation(); tick(); go(c.dataset.to, 0, { replay:true }); });
    $('cutOut').hidden = !b.buttons;
    const first = st.fi === byId[MAIN[0]] && st.bi === 0;
    $('backBtn').hidden = false; $('backBtn').disabled = first;
    $('cutReplay').hidden = out; $('cutSkip').hidden = out;
    $('next').hidden = !!b.buttons;
    progress();
    advance = b.buttons ? null : tap;
    snd.hush();
    track.line(b.cap);                               // each caption is a line for reading time, as say()'s are
    if (DBG.said) DBG.said('yuan', b.cap);
  }
  function progress(){                               // the thin line: four segments, one per scene
    const f = frame(), out = /^OUT/.test(f.id), at = BEATS.findIndex(([id, i]) => id === f.id && i === st.bi);
    $('cutProg').querySelectorAll('i').forEach((seg, k) => {
      const mine = BEATS.filter(([id]) => FRAMES[byId[id]].sc === SCN[k]), done = out ? mine.length : mine.filter(x => BEATS.indexOf(x) <= at).length;
      seg.firstChild.style.width = (100*done/mine.length).toFixed(1) + '%';
    });
  }
  function tap(){
    if (!st.on) return;
    tick();
    // the first tap shows the end picture (on S2-01, S2-05, S3-05 a: the moment the arrows are fullest), the next moves on
    const b = beat();
    if (!st.hold && st.t < endT(b)){ st.t = b.loop ? b.still*b.dur : endT(b); st.hold = true; return; }
    next();
  }
  function next(){
    const f = frame();
    if (st.bi < f.beats.length - 1) return go(f.id, st.bi + 1);
    if (f.id === 'S4-04'){ st.from = null; return go(st.title ? 'OUT-1' : 'OUT-2'); }
    if (f.id === 'OUT-2') return finish();
    const i = MAIN.indexOf(f.id);
    if (i >= 0 && i < MAIN.length - 1) go(MAIN[i + 1]);
  }
  function prev(){
    if (!st.on) return;
    const f = frame();
    if (st.bi > 0){ tick(); return go(f.id, st.bi - 1); }
    if (/^OUT/.test(f.id)){ tick(); const fr = st.from; st.from = null; return fr ? go(fr[0], fr[1]) : go('S4-04', -1); }   // back to where ข้าม was pressed
    const i = MAIN.indexOf(f.id);
    if (i > 0){ tick(); go(MAIN[i - 1], -1); }
  }
  function replay(){
    if (!st.on || !(beat().dur > 0)) return;
    tick(); st.t = 0; st.hold = false; st.manual = false; st.forced = !DBG.ap;
    if (DBG.ap) st.t = endT(beat());
    const tx = $('dtext'); tx.classList.remove('in'); void tx.offsetWidth; tx.classList.add('in');
  }
  function skip(){
    if (!st.on || /^OUT/.test(frame().id)) return;
    tick();
    track.choice('ข้ามทั้งหมด', beatName());                 // a Choices row naming the beat it was pressed on
    st.from = [frame().id, st.bi];
    go(st.title ? 'OUT-1' : 'OUT-2');
  }
  function play(o = {}){
    stop();
    st.on = true; st.title = !!o.title; st.from = null;
    scene = stageScene;
    setTitle('');                                     // no heading: it would cover the definition box, the chips and the scene
    const d = $('dialog');
    d.hidden = false; d.classList.add('cut');
    renderSpeaker($('portrait'), 'yuan');
    $('choices').innerHTML = '';
    stage.classList.add('cutting');
    go(o.from || MAIN[0], o.beat || 0);
    return new Promise(r => { st.done = r; });
  }
  function stop(){                                    // put the game's dialogue bar back as it was
    const was = st.on;
    st.on = false; st.done = null;
    stage.classList.remove('cutting');
    $('dialog').classList.remove('cut', 'in3');
    ['cutDef', 'cutChips', 'cutOut', 'cutDim', 'cutReplay', 'cutSkip'].forEach(id => $(id).hidden = true);
    $('backBtn').disabled = false;
    if (was){ if (advance === tap) advance = null; $('next').hidden = true; $('backBtn').hidden = lines.length < 2; }
  }
  function finish(){ const d = st.done; stop(); if (d) d(); }

  // OUT-1 (from the title screen): เริ่มเล่น starts ด่านที่ 1 as the title screen's own button does (same student),
  // ดูอีกรอบ starts again at S1-01, กลับหน้าหลัก goes back to the title screen as the summary's กลับหน้าหลัก does
  $('cutPlay').onclick = e => { e.stopPropagation(); stop(); snd.fx('start'); run(FULL_RUN, 'start'); };
  $('cutAgain').onclick = e => { e.stopPropagation(); tick(); go(MAIN[0]); };
  $('cutHome').onclick = e => { e.stopPropagation(); tick(); stop(); track.restart(); Object.assign(memo, MEMO_START); titleScreen(); };
  $('cutReplay').onclick = e => { e.stopPropagation(); replay(); };
  $('cutSkip').onclick = e => { e.stopPropagation(); skip(); };
  // these never take focus in the cutscene, so Enter keeps moving on (a focused ◂ would be pressed again)
  ['cutReplay', 'cutSkip', 'backBtn', 'next', 'cutChips'].forEach(id => $(id).addEventListener('pointerdown', e => { if (st.on) e.preventDefault(); }));
  // a tap anywhere on the stage moves on (the dialogue bar does it already)
  stage.addEventListener('click', e => {
    if (!st.on || reading != null || !advance || (e.target.closest && e.target.closest('button, .dlg'))) return;
    advance();
  });
  function key(e){                                   // ← / PageUp: the beat before; → / PageDown: on
    if (!st.on) return false;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); return true; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); if (advance) advance(); return true; }
    return false;
  }

  /* IN-3 (after ข or ง at the challenge question in ด่านที่ 1): the ice rink dimmed behind, two large buttons, each with a
     small second line. A dialogue line with choices (recorded like any choice; the back view shows it), its buttons
     drawn large on the stage. Resolves to 0 (the short review) or 1 (the full one first). */
  const IN3 = { cap:'“ไม่เป็นไรนะ เรื่องนี้หลายคนก็พลาด ก่อนไปต่อ นายคิดว่าตัวเองเป็นแบบไหน”',
    opts:[['รู้พื้นฐานอยู่แล้ว แค่พลาดนิดหน่อย', 'ทบทวนสั้นๆ แล้วเข้าบทเรียนเลย'], ['ยังไม่เข้าใจพื้นฐานเลย', 'ปูพื้นฐานแบบเต็มก่อน ประมาณ 7 นาที']] };
  async function in3(){
    const d = $('dialog');
    board(null);
    d.classList.add('cut', 'in3'); $('cutDim').hidden = false;
    const p = say('yuan', chunkHTML(IN3.cap), { choices:IN3.opts.map(o => o[0]) });
    [...$('choices').querySelectorAll('.choice')].forEach((b, i) => { b.innerHTML = `<b>${esc(IN3.opts[i][0])}</b><span>${esc(IN3.opts[i][1])}</span>`; });
    try { return await p; }
    finally { d.classList.remove('cut', 'in3'); $('cutDim').hidden = true; }
  }

  return {
    play, stop, in3, key, prev, tap, skip, replay, IN3, chunkHTML, WORD_BREAKS,
    on:() => st.on,
    // for the tests and the debug mode
    frames:FRAMES.map(f => ({ id:f.id, sc:f.sc, chip:f.chip, beats:f.beats.map((b, i) => ({ dur:b.dur, cap:b.cap, spot:typeof b.spot === 'function', oi:b.oi, part:b.part || 0, name:beatName(f.id, i) })) })),
    DEFS, MAIN, beatName,
    go(id, bi = 0){ go(id, bi); return this.where(); },
    seek(s){ st.manual = true; st.forced = false; st.t = s; st.age = Math.max(st.age, 1); ctx.clearRect(0, 0, W, H); drawBeat(); return this.probe(); },
    where(){ return { on:st.on, id:frame().id, beat:st.bi, beats:frame().beats.length, t:st.t, dur:beat().dur, end:endT(beat()), loop:!!beat().loop, still:beat().still || null, hold:st.hold, title:st.title, name:beatName() }; },
    probe(){ return JSON.parse(JSON.stringify({ ...PROBE, log:LOG })); }
  };
})();

// The push pointed left (F < 0): say so, whatever happened to the box.
async function wrongWay(F, f, first){
  if (Math.abs(F) <= f){
    await say('ryuka', `“ผลัก F = ${num(F, 0)} N (ไปทางซ้าย) กล่องก็ไม่ขยับ”`);
    if (first) await say('yuan', `“แรงผลักขนาด ${Math.abs(F)} N ยังไม่เกินแรงเสียดทานสูงสุด ${f.toFixed(2)} N พื้นจึงออกแรงเสียดทานสถิต ${Math.abs(F)} N ชี้ไปทาง<b>ขวา</b> สวนกับแรงผลักพอดี ΣF = 0 กล่องจึงนิ่งอยู่ แต่ธงอยู่ทางขวา ต้องผลักด้วยแรงที่เป็นบวกนะ”`);
  } else {
    await say('ryuka', '“ไปผิดทางแล้ว! ธงอยู่ทางขวานะ”');
    if (first) await say('yuan', '“F ติดลบแปลว่าผลักไปทางซ้าย (ทิศ −x) พอกล่องไถลไปทางซ้าย แรงเสียดทานก็ชี้ไปทาง<b>ขวา</b> เพราะแรงเสียดทานมีทิศตรงข้ามกับการเคลื่อนที่ของกล่อง ลองใช้แรงที่เป็นบวกนะ”');
  }
}

// ด่านที่ 1 (รอบที่ 2) : แรงเสียดทาน (frames 4-01 … 4-09). Two stages, each with its own panel mode, so a try retried from
// the back view (or a level resumed from a later part) knows its stage from panelMode:

  if (pick === 1) await say('yuan', '“ใช่ ตอนไถลความเร่งคงที่ −0.98 m/s² ความเร็วเลยลดลงเท่ากันทุกวินาที เส้นจึงเอียงลงตรงๆ จนถึง 0”');
  else await say('yuan', '“ดูกราฟนะ แรงเสียดทานคอยเบรกตลอดช่วงไถล ความเร็วเลยลดลงวินาทีละ 0.98 m/s เท่ากันทุกวินาที เส้นจึงเอียงลงตรงๆ จนถึง 0”');

// ด่านที่ 1 (ท้าทาย) : มวลและสัมประสิทธิ์ความเสียดทาน (frames 6-01 … 6-09). Stages, each with its own panel mode:
//   mass (sbM) and mu (sbMu): one variable at a time with preset buttons (F = 130 N), each after a prediction; ghosts and
//   a strip of the runs' f and distance. calc (sbN): blanks for f and F at m = 60 kg, μ = 0.15, then a typed push.
//   free (sandbox): the old free play with sliders, offered after the first success, after "why 5 × f".
async function sandbox(o = {}){
  setTitle(PART_NAME.sandbox);
  board(null);
  const STAGE = { sbM:'mass', sbMu:'mu', sbN:'calc', sandbox:'free' };
  const resumed = o.resume && STAGE[panelMode] ? panelMode : null;
  const L = scene = Level1();
  L.showMass = true; L.live = true; L.m = 40; L.mu = 0.15; L.reset();
  L.ghosts = []; L.runs = []; L.explored = [];
  if (resumed){
    if (pval.m != null) L.m = pval.m; if (pval.mu != null) L.mu = pval.mu;
    await rewindFx(L);
  } else {
    mark('6-01'); showPanel(null); memo.sbBoard = null;
    await say('kay', '“คราวนี้ขนของใส่กล่องเพิ่ม แล้วเปลี่ยนเป็นพื้นที่ฝืดกว่าเดิมดีกว่า”');
    await say('yuan', '“ก่อนอื่นมาดูทีละอย่างว่ามวลกับความฝืดของพื้นเปลี่ยนอะไรบ้าง เริ่มที่มวลก่อน”');
    await say('yuan', '“แรงผลักจะตั้งไว้ที่ 130 N เท่ากันทุกรอบ ให้จับตาดูว่ากล่องไถลไปได้ไกลแค่ไหน”');
    mark('6-02'); const A = ask('p4-mass-distance', 'แรงผลักเท่าเดิม พื้นเดิม ถ้ามวลมากขึ้น กล่องจะไปได้…', ['ไกลขึ้น', 'ใกล้ลง', 'เท่าเดิม', 'ไม่แน่ใจ'],
      { tag:'ทายก่อน', note:'แรงผลัก F = 130 N · μ = 0.15 เท่ากันทุกรอบ' });
    say('yuan', '“ก่อนลอง ทายก่อนนะ เลือกคำตอบบนกระดานได้เลย”', { wait:false });
    await A.pick();
    await say('yuan', '“โอเค จำคำตอบไว้ แล้วไปลองผลักดูกัน”');
    board(null);
  }
  let stg = resumed ? STAGE[resumed] : 'mass', fails = 0, wrongs = 0, freeTold = resumed === 'sandbox';
  levelNow = L;
  while (true){
    newTry();
    try {
      if (STAGE[panelMode]) stg = STAGE[panelMode];
      if (stg === 'mass' || stg === 'mu'){         // 6-03, 6-05: one variable at a time
        const mass = stg === 'mass', mode = mass ? 'sbM' : 'sbMu', key = mass ? 'm' : 'mu';
        board(null); L.strip = 'runs'; L.noFbd = false;
        L.stripLegend = mass ? [['f = μmg', 'แรงเสียดทาน (N)'], ['m', 'มวล (kg)']] : [['f = μmg', 'แรงเสียดทาน (N)'], ['μ', 'สัมประสิทธิ์ความเสียดทาน']];
        if (panelMode !== mode) showPanel(mode, mass ? { F:130, m:null, mu:0.15 } : { F:130, m:40, mu:null }, true);
        mark(mass ? '6-03' : '6-05'); L.onParam(pval);
        lockPanel(false);
        say('ryuka', '“ตั้งค่าเสร็จแล้วกดผลักได้เลย”', { wait:false });
        const p = await waitPlay();
        lockPanel(true);
        L.start(p);
        const r = await waitAny(['stopped', 'gone']);
        track.attempt({ F:p.F, m:p.m, mu:p.mu }, 'explore', r.name === 'stopped' ? r.data.err : null);
        const val = p[key], d = L.box.x - L.x0, f = L.f();
        L.ghosts = L.ghosts.filter(g => g.v !== val).concat([{ x:L.box.x, v:val, label:[mass ? `${val} kg` : `μ = ${val.toFixed(2)}`, `${d.toFixed(2)} m`] }]);
        L.runs = L.runs.filter(x => x.v !== val).concat([{ v:val, label:mass ? `m = ${val} kg` : `μ = ${val.toFixed(2)}`,
          lines:[mass ? `{f|f} = 0.15 × {m|${val}} × 9.81` : `{f|f} = ${val.toFixed(2)} × 40 × 9.81`, `= ${f.toFixed(2)} N`, `ไปได้ ${d.toFixed(2)} m`] }]);
        if (!L.explored.includes(stg + val)) L.explored.push(stg + val);

        L.reset();
        if (!MODES[mode].presets.every(x => L.explored.includes(stg + x))) continue;

          showPanel(null); L.strip = null; L.ghosts = []; L.runs = [];
          mark('6-04'); const A = ask('p5-mu-distance', 'มวลเท่าเดิม แรงผลักเท่าเดิม ถ้าพื้นฝืดขึ้น (μ มากขึ้น) กล่องจะไปได้…', ['ไกลขึ้น', 'ใกล้ลง', 'เท่าเดิม', 'ไม่แน่ใจ'],
            { tag:'ทายก่อน', note:'แรงผลัก F = 130 N · มวล m = 40 kg เท่ากันทุกรอบ' });
          say('yuan', '“คราวนี้เปลี่ยนพื้นแทน มวลกับแรงผลักเท่าเดิม ลองทายก่อนนะ”', { wait:false });
          await A.pick();

            <div class="eqMid">(<i>F</i> − <i>f</i>) × 0.8 = <i>f</i> × 3.2</div>
            <div class="fillrow"><i class="math">F</i> = ${fillBox('F', 'แรงผลัก')} N</div>
            <div class="small">ได้ F แล้ว ใส่ลงในช่องแรงผลักบนแผง แล้วกด ผลัก/เล่น</div>`, true, 'wide');
          const B = blanks(), f = 0.15*60*G;
          say('yuan', '“คราวนี้ไม่มีปุ่มให้เลือกแล้ว m = 60 kg, μ = 0.15 ตั้งสมการบนกระดานก่อน แล้วค่อยใส่แรงผลักที่คิดได้”', { wait:false });
          await solve(B, 'f', f, async (v, ok, n, given) => {
            if (ok) return say('yuan', '“ถูก 0.15 × 60 × 9.81 = 88.29 N นี่คือแรงที่พื้นต้านกล่องไว้ตลอดทาง”');
            if (given) return say('yuan', '“0.15 × 60 × 9.81 = 88.29 N นี่คือแรงที่พื้นต้านกล่องไว้ตลอดทาง”');
            if (near(v, 0.15*60)) return say('yuan', '“นายเอา μ คูณ m แล้วลืมคูณ g แรงเสียดทาน f = μmg ต้องคูณ g = 9.81 ด้วย เพราะ mg คือน้ำหนักที่กดลงบนพื้น”');

            if (ok) return say('yuan', '“ใช่ F = 4f + f = 5f ≈ 441 N ลองใส่ค่านี้ในช่องแรงผลักแล้วกดผลักดู”');
            if (given) return say('yuan', '“F − f = 4f ดังนั้น F = 4f + f = 5f ≈ 441 N ลองใส่ค่านี้ในช่องแรงผลักแล้วกดผลักดู”');
            if (near(v, 4*f) || near(v, 4*0.15*60*10)) return say('yuan', '“353.16 N คือ F − f นะ จากสมการ F − f = 4f นายยังไม่ได้บวก f กลับเข้าไป”');

      } else {                                        // free play (6-09)

        track.attempt({ F:p.F, m:p.m, mu:p.mu }, 'nomove');
        await say('ryuka', p.F === 0 ? '“ไม่ผลักเลย ก็ไม่ขยับสิ”'
          : `“ไม่ขยับเลย! แรงผลัก ${p.F} N ยังไม่มากกว่าแรงเสียดทาน ${f.toFixed(1)} N”`);
        L.reset(); continue;
      }
      const r = await waitAny(['stopped', 'gone']);
      track.attempt({ F:p.F, m:p.m, mu:p.mu }, stopOutcome(r), r.name === 'stopped' ? r.data.err : null);
      if (r.name === 'stopped' && r.data.ok){
        fails = 0;
        await celebrate(`“จอดได้! m = ${p.m} kg, μ = ${p.mu.toFixed(2)} ได้ f = ${f.toFixed(1)} N ส่วนแรงผลัก ${p.F} N ≈ ${(p.F/f).toFixed(2)} เท่าของ f”`);
        if (stg === 'calc'){                        // 6-08: where does the 5 come from? (once)
          mark('6-08'); showPanel(null);
          const K = ask('k2-why-five', 'ด่านก่อนก็ต้องผลักประมาณ 5 เท่าของ f ด่านนี้ก็ 5 เท่าอีก เลข 5 มาจากไหน ?',
            ['จากมวลของกล่อง', 'จากความฝืดของพื้น', 'จากระยะทาง: ผลัก 0.8 m แล้วไถลต่อ 3.2 m', 'ไม่แน่ใจ'],
            { tag:'ลองคิดดู', correct:2, reveal:true, tags:['five-from-mass', 'five-from-friction', '', ''] });
          say('yuan', '“ทีนี้ลองตอบอีกข้อบนกระดาน”', { wait:false });
          const k = await K.pick();
          if (k === 2) await say('yuan', '“ใช่เลย เลข 5 มาจากระยะทาง มาดูกันว่าทำไม”');
          else if (k === 3) await say('yuan', '“ไม่เป็นไร มาดูกันว่ามาจากไหน”');
          else await say('yuan', '“มวลกับความฝืดเปลี่ยนไปหลายรอบแล้ว แต่แรงผลักที่พอดีก็ยังเป็น 5 เท่าของ f ทุกครั้ง แปลว่าเลข 5 ไม่ได้มาจากสองอย่างนี้”');
          await say('yuan', '“สังเกตมั้ย ในด่านนี้แรงผลักที่พอดีจะประมาณ <b>5 เท่าของ \\(f\\)</b> เพราะผลัก 0.8 m แล้วไถลต่อ 3.2 m: \\(\\frac{F-f}{m}\\times 0.8=\\frac{f}{m}\\times 3.2\\) ตัด \\(m\\) ออก เหลือ \\(F=5f\\) (ถ้าระยะเปลี่ยน เลข 5 ก็เปลี่ยน)&thinsp;”');
          await say('yuan', '“มวลมากขึ้นหรือพื้นฝืดขึ้น แรงเสียดทาน f = μmg ก็มากขึ้น เลยต้องผลักแรงขึ้นตามไปด้วย”');
          board(null);
        }
        mark('6-09'); const pick = await say('yuan', 'จะลองค่าอื่นอีก หรือไปต่อ?', { choices:['ลองค่าอื่นอีก', 'ไปด่านพิเศษ'] });
        if (pick === 1) break;
        stg = 'free';
        if (!freeTold){
          freeTold = true;
          showPanel('sandbox', { F:p.F, m:p.m, mu:p.mu }, true);
          await say('yuan', '“ปรับ<b>มวล m</b> กับ<b>สัมประสิทธิ์ความเสียดทาน μ</b> ได้ตามใจเลย แล้วหาแรงผลักที่ทำให้กล่องจอดในช่องหน้าธงอีกครั้ง”');
        }
        L.reset();
        continue;
      }
      fails++;
      let msg;                                        // how far off, not which way
      if (r.name === 'gone') msg = p.mu === 0 ? 'μ = 0 ก็คือลานน้ำแข็งแบบแรก ไม่มีแรงเสียดทาน กล่องเลยไม่หยุด' : 'ไถลเลยธงไปไกลมาก';
      else msg = r.data.err < 0 ? `จอดก่อนถึงจุดจอด ${(-r.data.err).toFixed(2)} m` : `จอดเลยจุดจอดไป ${r.data.err.toFixed(2)} m`;
      if (fails >= 3 && p.mu > 0){
        track.hint();
        await say('yuan', `“${msg} ใบ้ให้: ตอนนี้ f = μmg = ${f.toFixed(1)} N ลองใช้สูตรจากพาร์ทสอน (F − f) × 0.8 = f × 3.2”`);
      } else await say('ryuka', `“${msg}”`);
    } catch (e){ await retried(e, L); }
  }
  endLevel();
  board(null);
  showPanel(null);
}

// A board question with options ก ข ค ง (at most four, 'กขคง' has four letters): the board and its option buttons.
function optsBoard(q, opts, tag, note){
  const b = board(`${tag ? `<span class="tag">${tag}</span>` : ''}${q ? `<div class="q">${q}</div>` : ''}<div class="opts">${opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${'กขคง'[i]}. ${o}</button>`).join('')}</div>${note ? `<div class="small">${note}</div>` : ''}`, true);
  return [b, [...b.querySelectorAll('.opt')]];
}
// A pick on the board, raced with the level's try: a retry from the back view must not leave it waiting for ever.
const pickOn = btns => cutTry(new Promise(res => btns.forEach(x => x.onclick = () => res(+x.dataset.i))));
const cutTry = p => tryAbort ? Promise.race([p, tryAbort]) : p;

// tags: the misconception behind each wrong option (logged for the teacher; '' for the right one)
// o.leaveOnWrong: a wrong first pick is answered and ends the quiz (returns false), as in the short lesson
async function quiz(id, q, opts, correct, why, wrong, tags, o = {}){
  const [b, btns] = optsBoard(q, opts);
  b.dataset.qid = id; b.dataset.correct = correct;
  const t0 = performance.now(), picks = [];
  let tFirst = 0;
  while (true){
    say('yuan', 'ตอบคำถามบนกระดานหน่อย', { wait:false });
    const pick = await pickOn(btns);
    if (!picks.length) tFirst = performance.now() - t0;
    picks.push(pick);
    if (pick === correct){
      track.quiz(id, picks, correct, tags, tFirst, performance.now() - t0);
      btns[pick].classList.add('right'); btns.forEach(x => x.disabled = true); snd.fx('right');
      await say('yuan', `ถูกต้อง! ${why}`);
      return true;
    }
    btns[pick].classList.add('wrong'); btns[pick].disabled = true; snd.fx('wrong');
    if (o.leaveOnWrong){
      track.quiz(id, picks, correct, tags, tFirst, performance.now() - t0);
      btns.forEach(x => x.disabled = true);
      await say('yuan', wrong[pick]);
      return false;
    }
    btns.forEach(x => x.classList.add('hold'));       // the feedback line comes first: until it is dismissed the options are visibly off
    await say('yuan', wrong[pick]);
    btns.forEach(x => x.classList.remove('hold'));
  }
}

// A single-shot question: a prediction (o.correct left out: no right answer yet) or a challenge or check question
// (o.correct = the right option). One pick, no second try. The board goes up here; the caller then says the prompt
// (a say() with wait:false, so the line is in the back view with the board) and awaits pick(), then says what follows
// from the answer. Logged as a quiz row under its own id (ASK_IDS), apart from the four scored quizzes.
// o: { tag (chip over the question), correct, tags (misconception per option), reveal (also light the right one) }
function ask(id, q, opts, o = {}){
  const [b, btns] = optsBoard(q, opts, o.tag, o.note);
  b.dataset.qid = id; b.dataset.correct = o.correct == null ? '' : o.correct;
  const t0 = performance.now();
  return { board:b, btns, async pick(){
    const i = await pickOn(btns), ms = performance.now() - t0, right = o.correct != null && i === o.correct;
    btns[i].classList.add(right ? 'right' : 'picked');
    if (o.reveal && o.correct != null && !right) btns[o.correct].classList.add('right');
    btns.forEach(x => x.disabled = true);
    snd.fx(right ? 'right' : 'tick');                 // a wrong answer here is never marked as a mistake
    track.quiz(id, [i], o.correct == null ? null : o.correct, o.tags || [], ms, ms);
    return i;
  } };
}

/* ---------- fill-in blanks on the board ----------
   fillBox(k) is the markup of one blank (a number box and ตรวจ) inside a board's html; an element with data-after="k"
   and class afterok stays hidden until blank k is right. blanks() works the boxes of the board on screen. solve() takes
   one blank to a right answer: it waits for a number, marks it right or wrong (the value is mirrored into the html, so
   the back view shows what was typed), then the caller's respond(val, ok, n, given) says the line for that answer.
   After o.give wrong tries (3) the answer is filled in for the student and respond gets given = true: nobody is stuck. */
const fillBox = (k, label = 'ช่องกรอกตัวเลข') => `<span class="fillbox" data-k="${k}"><input class="fillin" type="text" inputmode="decimal" autocomplete="off" aria-label="${label}" disabled><button class="fillchk" disabled>ตรวจ</button></span>`;
function blanks(b = $('board')){
  const box = k => b.querySelector(`.fillbox[data-k="${k}"]`);
  return {
    check(k){                                    // a number typed into blank k, on ตรวจ or Enter
      const x = box(k), inp = x.querySelector('.fillin'), btn = x.querySelector('.fillchk');
      x.classList.add('now'); inp.disabled = false; btn.disabled = false;
      inp.oninput = () => { inp.setAttribute('value', inp.value); x.classList.remove('wrong'); };
      setTimeout(() => { if (reading == null) inp.focus({ preventScroll:true }); }, 30);
      return cutTry(new Promise(res => {
        const go = () => { const v = parseFloat(inp.value.replace(',', '.').replace('−', '-')); if (isFinite(v)) res(v); else inp.focus(); };
        btn.onclick = e => { e.stopPropagation(); go(); };
        inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); e.stopPropagation(); go(); } };
      }));
    },
    ans(k, a){ box(k).dataset.ans = a; },          // for the debug autopilot
    mark(k, v, ok){
      const x = box(k), inp = x.querySelector('.fillin');
      x.classList.remove('now', 'right', 'wrong'); x.classList.add(ok ? 'right' : 'wrong');
      inp.value = String(v); inp.setAttribute('value', inp.value);
      if (ok){
        inp.disabled = true; inp.setAttribute('disabled', ''); x.querySelector('.fillchk').disabled = true;
        b.querySelectorAll(`[data-after="${k}"]`).forEach(el => el.classList.remove('afterok'));
      }
      snd.fx(ok ? 'right' : 'wrong');
    }
  };
}
// within ±2 % of the answer (o.tol), or of one of o.alt (e.g. the answer with g = 10)
const near = (v, ans, tol = 0.02) => ans === 0 ? Math.abs(v) < 0.005 : Math.abs(v - ans) <= tol*Math.abs(ans);
async function solve(B, k, ans, respond, o = {}){
  const vals = [], t0 = performance.now(), give = o.give || 3;
  B.ans(k, ans);
  while (true){
    const v = await B.check(k);
    vals.push(v);
    const ok = near(v, ans, o.tol) || (o.alt || []).some(a => near(v, a, o.tol));
    const given = !ok && vals.length >= give;
    B.mark(k, given ? +(+ans).toFixed(o.dec == null ? 2 : o.dec) : v, ok || given);
    if (ok || given) track.fill(o.id || k, vals, ok, performance.now() - t0);
    await respond(v, ok, vals.length, given);
    if (ok || given) return ok ? v : ans;
  }
}

// ด่านพิเศษ : การเคลื่อนที่แบบโพรเจกไทล์ (frames 7-01 … 7-06), two stages with their own panel modes:
//   สำรวจ (speedP): after a prediction, preset speeds 2 / 4 / 6 m/s (none lands on the cushion); every flight stays as
//   faint dots, a strip keeps each landing and flight time, then the board ties it to x = v × t.
//   คำนวณ (speedN): blanks for t and v = D/t, then a typed speed; the panel never predicts the landing before launch.
async function bonus(o = {}){

  S.dropStopper();
  await sleep(450);
  snd.fx('thud');
  await say('ryuka', '“ห๊ะ???????????? แล้วคนที่ยืนอยู่บนกล่องล่ะ !?”');
  await say('yuan', '“งั้นจะย้อนเวลาให้ก่อนละกัน”');
  await rewindFx(S);
  await say('yuan', '“คราวนี้เปลี่ยนจากตั้งแรงผลัก มาตั้ง<b>ความเร็ว</b>ของกล่องตอนไถลเข้าหาที่กั้นแทน บนแท่นก็เป็นน้ำแข็ง กล่องเลยไถลด้วยความเร็วคงที่จนชนที่กั้น”');
  await say('yuan', '“กล่องหยุดที่ที่กั้นก็จริง แต่ริวกะไม่ได้ติดกับกล่อง… หาความเร็วที่ทำให้ริวกะลอยไปลงเบาะที่ธงพอดีสิ”');
  await say('yuan', '“ก่อนจะหาคำตอบ ลองดูก่อนว่าความเร็วของกล่องเปลี่ยนอะไรบ้าง ให้จับตาดูสองอย่าง: ริวกะตกไกลแค่ไหน กับลอยอยู่กลางอากาศนานเท่าไหร่”');
  mark('7-02'); const A = ask('p6-speed-distance', 'ถ้ากล่องเร็วเป็น 2 เท่า ริวกะจะตกไกลจากขอบแท่นเป็นกี่เท่า ?', ['เท่าเดิม', '2 เท่า', '4 เท่า', 'ไม่แน่ใจ'], { tag:'ทายก่อน' });
  say('yuan', '“ลองทายก่อน เลือกคำตอบบนกระดานได้เลย”', { wait:false });
  await A.pick();
