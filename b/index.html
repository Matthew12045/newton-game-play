      r.oninput = e => {
        e.stopPropagation();
        const f = +r.value; PD.setF(f); track.moves++;
        r.setAttribute('value', f);               // so the back view shows the slider where it was
        $('pdV').textContent = `${f} N`; $('rowPush').innerHTML = rowPush(f);
        if (f === 2*F){ if (DEBUG) dbg.saw('slide'); r.disabled = true; res(); }
      };
    });
    track.choice(twice, `เลื่อนถึง 2 เท่า (F จาก ${F} เป็น ${2*F} N: a จาก ${a.toFixed(2)} เป็น ${(2*a).toFixed(2)} m/s²)`);
    await say('yuan', '“มวลเท่าเดิม แรงลัพธ์เป็น 2 เท่า ความเร่งก็เป็น 2 เท่า”');

    // the hand lets go: the learner fills in what the same equation gives
    PD.setF(F);
    const fillAsk = 'เติมกฎเอง: มือหลุดแล้ว แรงลัพธ์เป็น 0';
    const fillBoard = () => board(`<span class="tag">แรงในแนวแกน x และความเร่ง</span>
           <div class="row done" id="rowPush">${rowPush(F)}</div>
           <div class="row on" id="rowCoast">มือหลุดแล้ว: <i class="math">F</i><sub>ผลัก</sub> = 0 → ${SF('x')} = <b>0</b><br>
             <span class="math">a</span> = <span class="blank" id="blA">?</span> → ความเร็ว <span class="blank" id="blV">?</span></div>
           <div class="chips" id="chA">${['0', a.toFixed(2), '−' + a.toFixed(2)].map(c => `<button class="chip" data-g="A" aria-pressed="false">${c}</button>`).join('')}</div>
           <div class="chips" id="chV">${['เพิ่มขึ้น', 'คงที่', 'ลดลงจนหยุด'].map(c => `<button class="chip" data-g="V" aria-pressed="false">${c}</button>`).join('')}</div>`);
    fillBoard();
    await say('yuan', '“พอมือหลุดออกจากกล่อง แรงผลักก็หายไปทันที แรงลัพธ์ถึงจะกลับมาเป็น 0”');
    while (true){
      const got = await new Promise(res => {
        const pick = { A:null, V:null };
        $('board').querySelectorAll('.chip').forEach(c => c.onclick = e => {
          e.stopPropagation(); snd.fx('tick');
          const g = c.dataset.g; pick[g] = c.textContent;
          $('ch' + g).querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
          $('bl' + g).textContent = c.textContent;
          if (pick.A && pick.V){
            if (DEBUG) dbg.saw('chips', ['A', 'V'].map(k => [...$('ch' + k).querySelectorAll('.chip')].findIndex(x => x.getAttribute('aria-pressed') === 'true')));
            $('board').querySelectorAll('.chip').forEach(x => x.disabled = true); res(pick);
          }
        });
      });
      track.choice(fillAsk, `a = ${got.A}; ความเร็ว ${got.V}`);
      if (got.A === '0' && got.V === 'คงที่'){ snd.fx('right'); break; }
      snd.fx('wrong');
      await say('yuan', '“ดูลูกศรสีฟ้าตอนมือหลุดอีกทีสิ มันยาวขึ้น สั้นลง หรือเท่าเดิม”');
      fillBoard();
    }
    await sleep(600);

    // the graph of the run, where the game has always had it: now its legend ties the shape to ΣF; then the names
    M = scene = Moving(v1);
    M.cx = 330;
    graphBoard(iceGraph(), 'v');
    await say('yuan', '“วัตถุ<b>ไม่ต้องมีแรงมาคอยดัน</b>ถึงจะเคลื่อนที่ต่อได้ และแรงผลักก็ไม่ได้ถูกเก็บไว้ในกล่องด้วย มือหลุดเมื่อไหร่ แรงก็หมดเมื่อนั้น”');
    board(LAW1_BOARD());
    snd.bark(M.bubble = '“เข้าใจแล้ว แต่ช่วยเค้าก่อน!!”');
    await say('yuan', '“สิ่งที่แรงทิ้งไว้คือ<b>ความเร็วที่เปลี่ยนไปแล้ว</b> พอ ΣF = 0 ก็ไม่มีอะไรมาเปลี่ยนความเร็วนั้นอีก กล่องเลยไปต่อด้วยความเร็วคงที่ นี่แหละ<b>ความเฉื่อย</b>”', { pop:POP.law1 });

    await quiz('q1-inertia',
      'หลังจากมือหลุดจากกล่อง บนลานน้ำแข็ง (ไม่มีแรงเสียดทาน) ข้อใดถูกต้อง ?',
      ['กล่องค่อยๆ ช้าลง เพราะแรงผลักที่ติดอยู่ในกล่องค่อยๆ หมดไป',
       'กล่องเคลื่อนที่ด้วยความเร็วคงที่ เพราะแรงลัพธ์เป็นศูนย์',
       'กล่องหยุดทันที เพราะไม่มีแรงผลักแล้ว',
       'กล่องเร็วขึ้นเรื่อยๆ เพราะยังมีความเร่งเหลืออยู่'],
      1,
      'แรงลัพธ์เป็น 0 ความเร่งก็เป็น 0 ความเร็วจึงคงที่ตามกฎข้อ 1',
      ['แรงไม่ได้ติดอยู่ในกล่อง มันหายไปทันทีที่มือหลุด และถ้าไม่มีแรงต้าน ความเร็วก็ไม่ลดลง ลองใหม่นะ',
       '',
       'แรงลัพธ์เป็นศูนย์แปลว่าความเร็ว “ไม่เปลี่ยน” ไม่ได้แปลว่าหยุด ถ้าจะหยุดต้องมีแรงมาต้าน ลองใหม่นะ',
       'ความเร่งมีได้เฉพาะตอนที่มีแรงลัพธ์ (a = ΣF/m) พอ ΣF = 0 ความเร่งก็เป็น 0 ทันที ลองใหม่นะ'],
      ['force-stored-in-object', '', 'no-force-means-stop', 'acceleration-lingers']
    );
    board(LAW1_BOARD());
  }

  // both ways meet here: the shopping cart stops by itself, the box does not. What is missing on the ice?
  await say('ryuka', '“แต่รถเข็นที่ซูเปอร์ฯ ปล่อยมือแล้วมันก็หยุดเองนี่นา !?”');
  const ask = '“เหมือนจะมีอะไรหายไปสักอย่างนะ ?”';
  const OPT = ['แรงเสียดทานจากพื้น', 'แรงผลักจากมือ', 'น้ำหนักของกล่อง', 'ยังไม่รู้'];
  say('kay', ask, { wait:false });
  const b = board(`${surfacePics(false)}<div class="opts">${OPT.map((t, i) => `<button class="opt" data-i="${i}">${t}</button>`).join('')}</div>`, true);
  b.classList.add('tight');
  const pick = await pickOn(b);
  track.choice(ask, OPT[pick]);
  const friction = '“นั่นเพราะพื้นมี<b>แรงเสียดทาน</b>มาต้าน ซึ่งก็เป็นแรงภายนอกเหมือนกัน ΣF เลยไม่เป็น 0 แต่ลานนี้เป็นน้ำแข็ง แรงเสียดทานแทบเป็นศูนย์ เลยไม่มีอะไรมาหยุดกล่องเลย”';
  if (pick === 0) await say('yuan', friction);
  else {
    if (pick === 1) await say('yuan', '“ตอนปล่อยมือ แรงผลักก็หายไปเหมือนกันทั้งรถเข็นทั้งกล่องนะ แต่รถเข็นหยุด กล่องไม่หยุด ต้องมีอย่างอื่นที่ต่างกัน”');
    if (pick === 2) await say('yuan', '“น้ำหนักยังอยู่ครบทั้งสองที่ แล้วก็หักล้างกับแรงที่พื้นดันไปแล้ว ไม่ได้ทำให้ช้าลง”');
    // foundation: what friction is, as a picture
    board(`<span class="tag">แรงเสียดทาน</span>${surfacePics(true)}<div class="small">ลูกศรม่วง <i class="math">f</i> ชี้สวนกับทางที่ของไถลไป บนน้ำแข็งแทบไม่มี</div>`);
    await say('yuan', '“เวลาของไถลไปบนพื้น ผิวของมันถูกับพื้น พื้นเลยออกแรงต้านสวนกับทางที่ของไถลไป แรงนี้แหละเรียกว่าแรงเสียดทาน”');
    await say('yuan', friction);
  }
  board(null);
}

// The push pointed left (F < 0): say so, whatever happened to the box.
async function wrongWay(F, f, first){
  if (Math.abs(F) <= f){
    await say('ryuka', `“ผลัก F = ${num(F, 0)} N (ไปทางซ้าย) กล่องก็ไม่ขยับ”`);
    if (first) await say('yuan', `“แรงผลักขนาด ${Math.abs(F)} N ยังไม่เกินแรงเสียดทานสูงสุด ${f.toFixed(2)} N พื้นจึงออกแรงเสียดทานสถิต ${Math.abs(F)} N ชี้ไปทาง<b>ขวา</b> สวนกับแรงผลักพอดี ΣF = 0 กล่องจึงนิ่งอยู่ แต่ธงอยู่ทางขวา ต้องผลักด้วยแรงที่เป็นบวกนะ”`);
  } else {
    await say('ryuka', '“ไปผิดทางแล้ว! ธงอยู่ทางขวานะ”');
    if (first) await say('yuan', '“F ติดลบแปลว่าผลักไปทางซ้าย (ทิศ −x) พอกล่องไถลไปทางซ้าย แรงเสียดทานก็ชี้ไปทาง<b>ขวา</b> เพราะแรงเสียดทานมีทิศตรงข้ามกับการเคลื่อนที่ของกล่อง ลองใช้แรงที่เป็นบวกนะ”');
  }
}

// one run on a rough floor, worked out (the tables and the boards show these)
const fricRun = (F, m = 40, mu = 0.1) => {
  const f = mu*m*G, net = F - f, a1 = net/m, v1 = Math.sqrt(2*a1*0.8), a2 = f/m, s2 = v1*v1/(2*a2);
  return { F, m, mu, f, net, a1, v1, a2, s2, dist:0.8 + s2 };
};
// the board "net force in each part of the run": the rows a frame has reached (n of them), the last one lit
const PHASE_ROWS = r => [
  `ช่วงผลัก: ${SF('x')} = <i class="math">F</i> − <i class="math">f</i> = ${r.F} − ${r.f.toFixed(2)} = <b>${r.net.toFixed(2)} N</b><br>
      <span class="math">a</span> = <b>+${r.a1.toFixed(2)} m/s²</b> → เร็วขึ้น`,
  `ปล่อยมือ: ${SF('x')} = −<i class="math">f</i> = <b>−${r.f.toFixed(2)} N</b><br>
      <span class="math">a</span> = <b>−${r.a2.toFixed(2)} m/s²</b> → ช้าลง`,
  `หยุดแล้ว: ไม่ไถลแล้ว แรงเสียดทานจลน์หายไป<br>${SF('x')} = 0 → นิ่งอยู่กับที่`];
const phaseBoard = (r, n, first, all) => board(`<span class="tag">แรงลัพธ์ในแต่ละช่วง</span>
    <div class="eqMid">แกน x : ${SF('x')} = ?</div>` +
    PHASE_ROWS(r).slice(0, n).map((h, i) => `<div class="row ${all || i === n - 1 ? 'on' : 'done'}"${i ? '' : ' id="rowB"'}>${!i && first != null ? first : h}</div>`).join(''));
const stopMiss = r => r.name === 'gone' ? 'ไถลเลยธงไปไกลมาก ลองลดแรงผลัก'
  : r.data.err < 0 ? `จอดก่อนถึงจุดจอด ${(-r.data.err).toFixed(2)} m ลองเพิ่มแรงผลัก`
  : `จอดเลยจุดจอดไป ${r.data.err.toFixed(2)} m ลองลดแรงผลัก`;
const RUN_HEAD = ['F (N)', 'ΣF ช่วงผลัก', 'v ตอนปล่อยมือ', 'ไปได้ไกล'];
const runRow = r => [r.F, r.net.toFixed(2), r.v1.toFixed(2), `${r.dist.toFixed(2)} m`];

// ด่านที่ 2. Two practice runs first (one free up to 90 N, one at twice that, after a guess), with the net force built from
// the arrows of the first run in between; then the real round, where the force is typed in, not slid to.
async function frictionLevel(o = {}){
  setTitle(PART_NAME.fric);
  board(null); scrubOff();
  const L = scene = Level1();
  const S = o.lv ? structuredClone(o.lv) : { stage:'intro', p1:null, p2:null, guess:null, fails:0, hint:0 };
  const f = 0.1*40*G, IN = F => ({ F, m:40, mu:0.1 });
  if (S.stage !== 'intro') L.mu = 0.1;
  if (o.resume){ await rewindFx(L); L.onParam(pval); } else showPanel(null);
  // a push that does not beat friction: the same lines wherever it happens
  const stuck = async (F, outcome) => {
    await waitEvent('nomove');
    track.attempt(IN(F), outcome);
    if (F === 0) await say('ryuka', '“ไม่ผลักเลย ก็ไม่ขยับสิ”');
    else {
      await say('ryuka', `“ผลักตั้ง ${F} N แต่กล่องไม่ขยับเลย!”`);
      await say('yuan', `“แรงผลัก ${F} N ยังไม่มากกว่าแรงเสียดทาน 39.24 N พื้นเลยออกแรงเสียดทานต้านเท่ากับแรงผลักพอดี ΣF = 0 กล่องจึงนิ่งอยู่”`);
    }
    L.reset();
  };
  // Yuan's hints for the real round, in the order the game always gave them; `pre` is what just happened, when a miss brought the hint
  const HINT = [null,
    () => `“ลองเทียบจากตารางดู ${S.p2.F} N ไปได้ ${S.p2.dist.toFixed(2)} m แล้ว 4.0 m เป็นกี่เท่าของ ${S.p2.dist.toFixed(2)} ล่ะ แรงผลักก็ต้องเพิ่มเท่านั้น”`,
    pre => `“${pre}ใบ้ให้: หลังปล่อยมือ กล่องต้องไถลต่ออีก 3.2 m และช้าลงด้วย a = f/m = 0.981 m/s² ตอนปล่อยมือจึงควรมีความเร็ว v = √(2 × 0.981 × 3.2) ≈ 2.5 m/s ลองดูค่า v ในแผงด้านขวา”`,
    pre => `“${pre}ใบ้ให้: ช่วงผลัก (F − f)/m × 0.8 ต้องเท่ากับช่วงไถล f/m × 3.2 โดย f = 39.24 N ลองแก้สมการหา F ดูสิ”`,
    pre => `“${pre}ตัด m ออกจาก (F − f) × 0.8 = f × 3.2 จะได้ F = 5f = 5 × 39.24 ≈ 196 N”`];     // last resort, so nobody is stuck
  await stages(L, S, {
    // the floor changes; the goal
    async intro(){
      showPanel(null); scene = L;
      L.box.x = 9.5; L.ry.x = 9.5; L.ry.y = 0.7;
      await say('yuan', '“งั้นมาลองกันเลย ย้อนเวลากลับไป แล้วเปลี่ยนลานน้ำแข็งเป็นพื้นที่มีแรงเสียดทาน”');
      L.mu = 0.1;
      await rewindFx(L);
      await say('yuan', '“แรงเสียดทานมีทิศ<b>ตรงข้ามกับการเคลื่อนที่</b>ของกล่องเทียบกับพื้น ลองหาแรงผลักที่ทำให้กล่องค่อยๆ ช้าลงแล้วจอดใน<b>ช่องสีเขียวหน้าธง</b>พอดีสิ”');
      return 'p1';
    },
    // practice run 1: any push up to 90 N, to see the box slow down and stop by itself
    async p1(){
      scene = L; L.mu = 0.1; board(null);
      stagePanel('fricP', { F:60 });
      const tab = r => panelTable('ตารางซ้อม', ['รอบ', 'F (N)', 'ไปได้ไกล (m)'], [[1, r ? r.F : '', r ? r.dist.toFixed(2) : ''], [2, '', '']], { hi:0 });
      tab(null);
      lockPanel(false);
      say('kay', '“ซ้อมก่อนสัก 2 รอบดีกว่า ยังไม่ต้องให้ถึงธงก็ได้ ผมอยากรู้ว่าผลักแรงขึ้นแล้วกล่องจะไปได้ไกลขึ้นแค่ไหน”', { wait:false });
      const { F } = await waitPlay();
      lockPanel(true);
      L.start(IN(F));
      if (F <= f){ await stuck(F, 'practice-nomove'); return 'p1'; }
      const r = await waitAny(['stopped', 'gone']);
      track.attempt(IN(F), 'practice', r.name === 'stopped' ? r.data.err : null);
      S.p1 = fricRun(F); tab(S.p1);
      await say('ryuka', `“${stopMiss(r)}”`);
      return 'build';
    },
    // that run again, slowly, stopped while the hand still pushes: the learner taps the two horizontal forces and the net force grows term by term
    async build(){
      showPanel(null); scene = L; L.mu = 0.1;
      const r = S.p1, got = [], order = [];
      const row = () => got.length === 2 ? PHASE_ROWS(r)[0]
        : `ช่วงผลัก: ${SF('x')} = ${got.includes('F') ? '<i class="math">F</i> ' : ''}${got.includes('f') ? '− <i class="math">f</i> ' : ''}<span class="blank">?</span>` +
          (got.length ? `<br><span class="small">${got[0] === 'F' ? `F = ${r.F} N ชี้ไปข้างหน้า` : `f = ${r.f.toFixed(2)} N ชี้ถอยหลัง`}</span>` : '');
      phaseBoard(r, 1, row());
      const ask = '“ตอนกำลังผลัก มีแรงแนวราบกี่แรงนะ นายลองแตะลูกศรดูสิ”';
      say('kay', ask, { wait:false });
      L.taps = ['F', 'f'];
      L.start(IN(r.F), { hold:'push', note:`ของรอบที่ผลัก ${r.F} N` });
      await waitEvent('held');
      while (got.length < 2){
        const k = await waitTap();
        if (got.includes(k)) continue;
        order.push(k);
        if (k === 'N' || k === 'mg'){
          await say('yuan', '“N กับ mg อยู่แนวดิ่ง หักล้างกันไปแล้ว ตอนนี้ดูแค่แนวราบพอ”');
          say('kay', ask, { wait:false });
          continue;
        }
        got.push(k); L.taps = ['F', 'f'].filter(x => !got.includes(x));
        const el = $('rowB'); if (el) el.innerHTML = row();
      }
      track.choice(ask, 'แตะ ' + order.join(' → '));
      await say('yuan', '“ตอนผลัก ต้องออกแรงมากกว่าแรงเสียดทาน แรงลัพธ์ถึงจะชี้ไปข้างหน้า กล่องจึงเร็วขึ้น”', { pop:POP.sumFx });
      return 'q2';
    },
    // the replay runs on until the box is sliding by itself: which way does the net force point now? (quiz 2, asked before it is explained)
    async q2(){
      showPanel(null); scene = L; L.mu = 0.1;
      const r = S.p1;
      L.taps = [];
      if (L.slow && L.held && L.phase === 'push') L.release('coast');
      else L.start(IN(r.F), { hold:'coast', note:`ของรอบที่ผลัก ${r.F} N` });
      await waitEvent('held');
      await cutP(quiz('q2-friction-direction',
        'ขณะที่กล่องกำลังไถลช้าลงหลังปล่อยมือ แรงลัพธ์ที่กระทำต่อกล่องมีทิศทางใด ?',
        ['ไปข้างหน้า ทิศเดียวกับที่กล่องเคลื่อนที่',
         'ถอยหลัง สวนทางกับที่กล่องเคลื่อนที่',
         'เป็นศูนย์ เพราะไม่มีใครผลักแล้ว',
         'เปลี่ยนไปเรื่อยๆ ตามความเร็วของกล่อง'],
        1,
        'แรงลัพธ์คือแรงเสียดทานที่ชี้ถอยหลัง ความเร่งจึงสวนทางกับความเร็ว กล่องเลยช้าลง',
        ['กล่องกำลังเคลื่อนที่ไปข้างหน้าก็จริง แต่ไม่มีแรงไหนดันไปข้างหน้าแล้ว การเคลื่อนที่ไม่จำเป็นต้องมีแรงในทิศนั้น ลองใหม่นะ',
         '',
         'ถ้าแรงลัพธ์เป็นศูนย์ ความเร็วจะคงที่ แต่กล่องกำลังช้าลง แปลว่ายังมีแรงลัพธ์อยู่ ลองใหม่นะ',
         'แรงเสียดทานจลน์ f = μmg มีขนาดคงที่ ไม่ขึ้นกับความเร็ว และมีทิศตรงข้ามกับการเคลื่อนที่ของกล่อง ลองใหม่นะ'],
        ['motion-needs-forward-force', '', 'slowing-means-zero-net-force', 'friction-depends-on-speed']
      ));
      phaseBoard(r, 2);
      L.release(null);                              // and the box slows down to a stop while the line is read
      await say('yuan', `“พอปล่อยมือ เหลือแค่แรงเสียดทานที่ชี้ถอยหลัง แรงลัพธ์จึงสวนทางการเคลื่อนที่ ความเร็วลดลงวินาทีละ ${r.a2.toFixed(2)} m/s จนเหลือ 0”`);
      board(null);
      await rewindFx(L);
      return 'predict';
    },
    // practice run 2: twice the push, locked. A guess first, then the run, then the table answers
    async predict(){
      scene = L; L.mu = 0.1; board(null);
      const F2 = 2*S.p1.F, r2 = fricRun(F2);
      if (panelMode !== 'fricL' || pval.F !== F2) showPanel('fricL', { F:F2 });
      const tab = done => panelTable('ตารางซ้อม', RUN_HEAD, [runRow(S.p1), done ? runRow(r2) : [F2, r2.net.toFixed(2), '?', '?']],
        { hi:1, foot:`ความเร่งช่วงไถลเท่ากันทุกรอบ: −${r2.a2.toFixed(2)} m/s²` });
      tab(false);
      lockPanel(true);
      S.guess = await say('kay', `“รอบสองลองผลักแรงขึ้นเป็น 2 เท่าดูมั้ย ${F2} N นายว่ากล่องจะไปได้ไกลแค่ไหน ทายก่อนนะ”`,
        { choices:['ไกลเท่าเดิม', 'ไกลขึ้นราว 2 เท่า', 'ไกลขึ้นมากกว่า 2 เท่า'] });
      lockPanel(false);
      await waitPlay();
      lockPanel(true);
      L.start(IN(F2));
      const r = await waitAny(['stopped', 'gone']);
      track.attempt(IN(F2), 'practice', r.name === 'stopped' ? r.data.err : null);
      S.p2 = r2; tab(true);
      await say('ryuka', `“${stopMiss(r)}”`);
      const d1 = S.p1.dist.toFixed(2), d2 = r2.dist.toFixed(2);
      await say('yuan', S.guess === 1 ? `“ใช่ แรงผลัก 2 เท่า กล่องก็ไปได้ไกล 2 เท่าพอดี จาก ${d1} m เป็น ${d2} m”`
                                      : `“ดูตารางสิ จาก ${d1} m เป็น ${d2} m ไกลขึ้น 2 เท่าพอดีเลย”`);
      return 'typed';
    },
    // the real round: the push is typed in. ขอตัวช่วย gives the next hint without a miss first
    async typed(){
      scene = L; L.mu = 0.1; board(null);
      stagePanel('fricT');
      panelTable('ตารางซ้อม', RUN_HEAD, [runRow(S.p1), runRow(S.p2), ['?', '', '', '4.00 m']], { hi:2 });
      lockPanel(false);
      say('ryuka', '“คราวนี้ต้องจอดหน้าธงให้ได้นะ”', { wait:false });
      const w = await Promise.race([waitPlay().then(d => ({ F:d.F })), waitEvent('help').then(() => ({ help:true }))]);
      lockPanel(true);
      if (w.help){
        S.hint = Math.min(4, S.hint + 1);
        track.hint(); track.choice('ขอตัวช่วย: ด่านแรงเสียดทาน', `คำใบ้ขั้นที่ ${S.hint}`);
        await say('yuan', HINT[S.hint](''));
        return 'typed';
      }
      const F = w.F;
      L.start(IN(F));
      if (F <= f){ await stuck(F, 'nomove'); return 'typed'; }
      const r = await waitAny(['stopped', 'gone']);
      track.attempt(IN(F), stopOutcome(r), r.name === 'stopped' ? r.data.err : null);
      if (r.name === 'stopped' && r.data.ok){
        memo.fric = { F };
        await celebrate(`“เยี่ยม! ผลัก ${F} N กล่องค่อยๆ ช้าลงแล้วจอดคลาดจากจุดจอดแค่ ${Math.abs(r.data.err).toFixed(2)} m”`);
        return null;
      }
      S.fails++;
      const msg = stopMiss(r);
      S.hint = Math.max(S.hint, S.fails === 1 ? 1 : S.fails === 2 ? 2 : S.fails <= 4 ? 3 : 4);
      track.hint();
      if (S.hint === 1){ await say('ryuka', `“${msg}”`); await say('yuan', HINT[1]()); }
      else await say('yuan', HINT[S.hint](msg + ' '));
      return 'typed';
    }
  });
  showPanel(null); board(null);
}

// the run that parked on the rough floor, as the lesson's graph: push, slide, at rest
function fricGraph(r){
  const tp = r.v1/r.a1, tc = r.v1/r.a2, tMax = (tp + tc)*1.12;
  return {
    tMax, tTicks:[tp, tp + tc],
    segs:[{ t0:0, t1:tp, a:r.a1, v0:0, x0:0, name:'ผลัก', fill:'#FFF1E0', ink:'#8a4d00' },
          { t0:tp, t1:tp + tc, a:-r.a2, v0:r.v1, x0:0.8, name:'ไถล', fill:'#F3EAF7', ink:'#6c3483' },
          { t0:tp + tc, t1:tMax, a:0, v0:0, x0:0.8 + r.s2, name:'หยุด', fill:'#EEF1F4', ink:'#56606e' }],
    yTicks:{ v:[r.v1], a:[r.a1, -r.a2], x:[0.8, 0.8 + r.s2] },
    legend:{ v:['ผลัก: ΣF = F − f > 0 ความเร็วเพิ่มขึ้น', 'ไถล: ΣF = −f < 0 ความเร็วลดลงจนเป็น 0', 'หยุด: ΣF = 0 นิ่งอยู่กับที่'],
             a:[`ผลัก: a = (F − f)/m = +${r.a1.toFixed(2)} m/s²`, `ไถล: a = −f/m = −${r.a2.toFixed(2)} m/s² (ทิศสวนกับความเร็ว จึงช้าลง)`, 'หยุด: a = 0'],
             x:['ผลัก: เส้นโค้งที่ชันขึ้น = เร็วขึ้น', 'ไถล: เส้นโค้งที่ค่อยๆ แบนลง = ช้าลง', 'หยุด: เส้นแนวนอน ความชันเป็น 0 = นิ่ง'] },
    caption:k => `กราฟ ${k}–t ของรอบที่นายผลักด้วยแรง ${r.F} N; ${GRAPH_TIP[k]}${k === 'v' ? ` ≈ ${(0.8 + r.s2).toFixed(1)} m` : ''}`
  };
}

// บทเรียน : แรงเสียดทาน. The first two rows of its board were built by the learner in the level; here come the third row,
// the graph of the run that parked (with a guess before the x–t tab opens), where f comes from, and the stopping-point board.
async function frictionLesson(){
  setTitle(PART_NAME.fricLesson);
  showPanel(null); scrubOff();
  const r = fricRun((memo.fric && memo.fric.F) || 196);
  const D = scene = Diagram(); D.fric = true; D.showF = false; D.label = 'หลังปล่อยมือ';
  // why it stopped
  phaseBoard(r, 3, null, true);
  await say('yuan', '“พอกล่องหยุด ผิวไม่ได้ไถลกันแล้ว แรงเสียดทานจลน์ก็หมดไป ΣF = 0 กล่องจึงนิ่งอยู่ตรงนั้น ไม่ได้ถอยหลังกลับ”', { pop:POP.sumFx });
  await say('ryuka', '“สรุปว่ากล่องหยุดเพราะแรงเสียดทาน ไม่ใช่เพราะเลิกผลัก!”');
  // the graph of that run: the shape of x–t while it slows down is guessed before its tab opens
  const g = fricGraph(r); g.lock = ['x'];
  const gb = graphBoard(g, 'v');
  await say('kay', '“กราฟ v–t ช่วงไถลเอียงลงจนถึง 0 แล้วกราฟ x–t ช่วงเดียวกันจะหน้าตาเป็นยังไงนะ นายทายก่อนค่อยกด”',
    { choices:['เส้นตรงเอียงขึ้น', 'โค้งชันขึ้นเรื่อยๆ', 'โค้งค่อยๆ แบนลง'] });
  g.lock = null;
  graphView(gb, g, (gb.querySelector('.gtabs [aria-pressed="true"]') || {}).dataset?.k || 'v');
  await say('yuan', '“ลองกดดูกราฟ x–t ด้วย ช่วงไถลเส้นจะค่อยๆ แบนลง เพราะความเร็ว (ความชัน) ลดลงจนเป็น 0 แล้วก็เป็นเส้นแนวนอนตอนหยุด”');
  // where friction comes from: f = μmg, with m and μ to slide
  D.showF = true; D.label = 'ตอนกำลังผลัก'; D.mass = '40 kg';
  const fb = board(`<span class="tag">แรงเสียดทาน</span>
    <div class="eqMid"><i>f</i> = <i>μN</i> = <i>μmg</i></div>
    <div class="cap" id="flCap">= 0.10 × 40 × 9.81 = <b>39.24 N</b></div>
    <div class="small">เกิดจากผิวกล่องไถลถูกับพื้น<br>มีทิศ<b>ตรงข้ามกับการเคลื่อนที่</b>ของกล่องเทียบกับพื้น</div>
    <div class="def"><i class="math">μ</i> = พื้นฝืดแค่ไหน (น้ำแข็งเกือบ 0); <i class="math">N</i> = แรงที่พื้นดันกล่อง<br>ลองเลื่อน <i class="math">m</i> กับ <i class="math">μ</i> ทีละตัว ดูว่า <i class="math">f</i> เปลี่ยนยังไง</div>
    <div class="bslider"><span><i class="math">m</i></span><input type="range" class="rng" id="flM" min="20" max="80" step="1" value="40" aria-label="มวลรวม">
      <span><i class="math">μ</i></span><input type="range" class="rng" id="flMu" min="0" max="0.25" step="0.01" value="0.1" aria-label="สัมประสิทธิ์ความเสียดทาน"></div>`);
  fb.classList.add('tight');
  const slid = [];
  const onSlide = e => {
    e.stopPropagation();
    const m = +$('flM').value, mu = +$('flMu').value, f = mu*m*G;
    $('flCap').innerHTML = `= ${mu.toFixed(2)} × ${m} × 9.81 = <b>${f.toFixed(2)} N</b>`;
    D.fScale = Math.min(3.2, f/39.24); D.mass = `${m} kg`;
    const k = e.target.id === 'flM' ? 'm' : 'μ'; if (slid[slid.length - 1] !== k) slid.push(k);

  ['flM', 'flMu'].forEach(id => { $(id).addEventListener('input', onSlide); $(id).addEventListener('click', e => e.stopPropagation()); });
  await say('yuan', '“แรงเสียดทานเกิดจากผิวกล่องไถลถูกับพื้น ขนาด f = μN และบนพื้นราบ N = mg จึงได้ f = μmg”', { pop:POP.friction });
  await say('yuan', '“พื้นนี้มีสัมประสิทธิ์ความเสียดทาน μ = 0.10 กล่องกับริวกะมีมวลรวม 40 kg แรงเสียดทานจึงเป็น f = μmg = 0.10 × 40 × 9.81 = 39.24 N”');
  track.choice('กระดานแรงเสียดทาน: ตัวเลื่อน m กับ μ', slid.length ? `เลื่อน (${slid.join(' → ')}; จบที่ m = ${$('flM') ? $('flM').value : '?'}, μ = ${$('flMu') ? (+$('flMu').value).toFixed(2) : '?'})` : 'ไม่ได้เลื่อน');
  D.fScale = 1; D.mass = null;
  // the stopping point can be worked out before pushing; the last row is why "twice the push, twice as far"
  board(`<span class="tag">หาจุดจอดของกล่อง</span>
    <div class="cap">ใช้ <span class="math">v² = u² + 2as</span> ทีละช่วง</div>
    <div class="row on">ช่วงผลัก: <span class="math">v² = 0 + 2(${r.a1.toFixed(2)})(0.8)</span><br>→ <span class="math">v</span> = <b>${r.v1.toFixed(2)} m/s</b> ตอนปล่อยมือ</div>
    <div class="row on">ช่วงไถล: <span class="math">0 = v² − 2(${r.a2.toFixed(2)})s</span><br>→ <span class="math">s</span> = <b>${r.s2.toFixed(2)} m</b></div>
    <div class="cap">รวม 0.8 + ${r.s2.toFixed(2)} = <b>${(0.8 + r.s2).toFixed(2)} m</b> <span class="small">(จุดจอดอยู่ห่างจุดเริ่ม 4.0 m)</span></div>
    <div class="def">สองช่วงใช้ <i class="math">v</i> ตัวเดียวกัน จึงได้ (<i class="math">F</i> − <i class="math">f</i>) × 0.8 = <i class="math">f</i> × <i class="math">s</i><br>ระยะรวม 0.8 + <i class="math">s</i> = 0.8 × <i class="math">F</i> ÷ <i class="math">f</i></div>`).classList.add('tight', 'sums');
  await say('yuan', '“ใช้สูตร v² = u² + 2as ทีละช่วง ก็คำนวณได้ก่อนเลยว่ากล่องจะไปจอดตรงไหน ไม่ต้องเดา”', { pop:POP.suvat });
  board(null);
}

// ด่านท้าทาย. A problem to work out first (m = 60 kg, μ = 0.15: no practice run, no slider for the push), with a board
// that sets the equation up step by step after a miss or on request; then free play with all three sliders, as before.
async function sandbox(o = {}){
  setTitle(PART_NAME.sandbox);
  board(null); scrubOff();
  const L = scene = Level1();
  L.showMass = true; L.live = true; L.m = 60; L.mu = 0.15; L.reset();
  const S = o.lv ? structuredClone(o.lv) : { stage:'intro', fails:0, help:null, pre:null, won:null, explained:false, wins:[], wrongs:0, freeFails:0 };
  if (o.resume){ L.m = pval.m; L.mu = pval.mu; await rewindFx(L); L.onParam(pval); } else { showPanel(null); Object.assign(pval, { m:60, mu:0.15 }); }
  const miss = (r, mu) => r.name === 'gone' ? (mu === 0 ? 'μ = 0 ก็คือลานน้ำแข็งแบบแรก ไม่มีแรงเสียดทาน กล่องเลยไม่หยุด' : 'ไถลเลยธงไปไกลมาก ลองลดแรงผลัก')
    : r.data.err < 0 ? `จอดก่อนถึงจุดจอด ${(-r.data.err).toFixed(2)} m ลองเพิ่มแรงผลัก` : `จอดเลยจุดจอดไป ${r.data.err.toFixed(2)} m ลองลดแรงผลัก`;
  const hintLine = (pre, f) => `“${pre ? pre + ' ' : ''}ใบ้ให้: ตอนนี้ f = μmg = ${f.toFixed(1)} N ลองใช้สูตรจากพาร์ทสอน (F − f) × 0.8 = f × 3.2”`;
  const parked = (p, f) => celebrate(`“จอดได้! m = ${p.m} kg, μ = ${p.mu.toFixed(2)} ได้ f = ${f.toFixed(1)} N ส่วนแรงผลัก ${p.F} N ≈ ${(p.F/f).toFixed(2)} เท่าของ f”`);
  const onward = () => say('yuan', 'จะลองค่าอื่นอีก หรือไปต่อ?', { choices:['ลองค่าอื่นอีก', 'ไปด่านพิเศษ'] });
  // free play's table: the runs that parked (the last three), and the setting on the sliders now
  const freeTable = () => {
    const runs = [memo.fric ? { m:40, mu:0.1, F:memo.fric.F } : null, S.won != null ? { m:60, mu:0.15, F:S.won } : null, ...S.wins].filter(Boolean).slice(-3);
    const row = (x, F) => [x.m, x.mu.toFixed(2), (x.mu*x.m*G).toFixed(2), F];
    panelTable('รอบที่จอดได้', ['m', 'μ', 'f (N)', 'F (N)'], [...runs.map(x => row(x, x.F)), row(pval, '?')], { hi:runs.length });
  };
  await stages(L, S, {
    async intro(){
      showPanel(null); scene = L;
      await say('kay', '“คราวนี้ขนของใส่กล่องเพิ่ม แล้วเปลี่ยนเป็นพื้นที่ฝืดกว่าเดิมดีกว่า”');
      await say('yuan', '“มวลรวมเป็น 60 kg พื้นใหม่ μ = 0.15 คราวนี้ไม่มีรอบซ้อมนะ ลองคำนวณก่อนว่าต้องผลักกี่นิวตัน แล้วพิมพ์ลงไป”');
      return 'typed';
    },
    // the problem: F is typed, m and μ are fixed. A miss (or ขอตัวช่วย) opens the helper board
    async typed(){
      scene = L; board(null); $('params').oninput = null;
      stagePanel('sandT', { m:60, mu:0.15 });
      L.m = 60; L.mu = 0.15;
      lockPanel(false);
      say('ryuka', '“ตั้งค่าเสร็จแล้วกดผลักได้เลย”', { wait:false });
      const w = await Promise.race([waitPlay().then(p => ({ p })), waitEvent('help').then(() => ({ help:true }))]);
      lockPanel(true);
      if (w.help){
        track.choice('ขอตัวช่วย: ด่านท้าทาย', S.help === 'done' ? 'ดูตัวช่วยตั้งสมการอีกครั้ง' : 'เปิดตัวช่วยตั้งสมการ');
        S.pre = null;
        return 'helper';
      }
      const p = { F:w.p.F, m:60, mu:0.15 };
      L.start(p);
      const f = L.f();
      if (p.F <= f){
        await waitEvent('nomove');
        track.attempt(p, 'nomove');
        await say('ryuka', p.F === 0 ? '“ไม่ผลักเลย ก็ไม่ขยับสิ”' : `“ไม่ขยับเลย! แรงผลัก ${p.F} N ยังไม่มากกว่าแรงเสียดทาน ${f.toFixed(1)} N”`);
        L.reset(); return 'typed';
      }
      const r = await waitAny(['stopped', 'gone']);
      track.attempt(p, stopOutcome(r), r.name === 'stopped' ? r.data.err : null);
      if (r.name === 'stopped' && r.data.ok){
        S.won = p.F;
        await parked(p, f);
        if (!S.explained){
          await say('yuan', '“สังเกตมั้ย ในด่านนี้แรงผลักที่พอดีจะประมาณ <b>5 เท่าของ \\(f\\)</b> เพราะผลัก 0.8 m แล้วไถลต่อ 3.2 m: \\(\\frac{F-f}{m}\\times 0.8=\\frac{f}{m}\\times 3.2\\) ตัด \\(m\\) ออก เหลือ \\(F=5f\\) (ถ้าระยะเปลี่ยน เลข 5 ก็เปลี่ยน)&thinsp;”');
          await say('yuan', '“มวลมากขึ้นหรือพื้นฝืดขึ้น แรงเสียดทาน f = μmg ก็มากขึ้น เลยต้องผลักแรงขึ้นตามไปด้วย”');
          S.explained = true;
        }
        return (await onward()) === 1 ? null : 'freeIntro';
      }
      S.fails++;
      if (S.help !== 'done'){ S.pre = miss(r, 0.15); await cutP(sleep(700)); return 'helper'; }   // the first miss: set the equation up together
      track.hint();
      await say('yuan', hintLine(miss(r, 0.15), f));
      return 'typed';
    },
    // the helper: two steps on the board, one blank at a time; a wrong blank gets its own explanation
    async helper(){
      showPanel(null);
      const D = scene = Diagram(); D.fric = true; D.mass = '60 kg'; D.label = ''; D.note = 'โจทย์: m = 60 kg, μ = 0.15';
      const f = 0.15*60*G, ANS = [f, 4*f, 5*f], NAME = ['① f', '② F − f', '② F'], done = S.help === 'done';
      const box = i => `<input class="bnum${done ? ' ok' : ''}" id="hb${i}" type="number" step="any" inputmode="decimal" aria-label="${NAME[i]}"${done ? ` value="${ANS[i].toFixed(2)}"` : ''}${done || i ? ' disabled' : ''}>`;
      board(`<span class="tag">ตั้งสมการทีละขั้น</span>
        <div class="row on helpRow">① แรงเสียดทาน<br><span class="math">f = μmg</span> = 0.15 × 60 × 9.81 = ${box(0)} N</div>
        <div class="row${done ? ' on' : ''} helpRow" id="hbRow2">② ผลัก 0.8 m แล้วไถลต่อ 3.2 m<br>(<i class="math">F</i> − <i class="math">f</i>) × 0.8 = <i class="math">f</i> × 3.2<br>
          <i class="math">F</i> − <i class="math">f</i> = ${box(1)} → <i class="math">F</i> = ${box(2)} N</div>
        <div class="small">เติมทีละช่อง ผิดช่องไหน ยูอันอธิบายช่องนั้น</div>`).classList.add('tight');
      const line = hintLine(S.pre, f);
      S.pre = null;
      track.hint();
      if (done){ await say('yuan', line); board(null); return 'typed'; }
      say('yuan', line, { wait:false });
      [0, 1, 2].forEach(i => {
        const el = $('hb' + i);
        el.addEventListener('change', () => emit('fill', { i, v:parseFloat(el.value) }));
        el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); e.stopPropagation(); el.blur(); } });
        el.addEventListener('click', e => e.stopPropagation());
      });
      $('hb0').focus({ preventScroll:true });
      for (let i = 0; i < 3;){
        const e = await waitEvent('fill');
        if (e.i !== i || !isFinite(e.v)) continue;
        const el = $('hb' + i), ok = Math.abs(e.v - ANS[i]) <= ANS[i]*0.0015;
        el.classList.toggle('ok', ok); el.classList.toggle('no', !ok);
        track.choice('ตัวช่วยตั้งสมการ ช่อง ' + NAME[i], `${ok ? 'ถูก' : 'ผิด'} (${e.v})`);
        if (!ok){
          snd.fx('wrong');
          say('yuan', i === 0 ? '“μ บอกว่าพื้นฝืดแค่ไหน m คือมวลรวม ลองคูณใหม่อีกที 0.15 × 60 × 9.81”'
                              : '“ย้าย 0.8 ไปหารก่อนสิ จะได้ F − f = f × 3.2 ÷ 0.8 แล้วค่อยบวก f กลับเข้าไป”', { wait:false });
          el.focus({ preventScroll:true }); el.select();
          continue;
        }
        snd.fx('right'); el.disabled = true; i++;
        if (i === 1) $('hbRow2').classList.add('on');
        if (i < 3){ const n = $('hb' + i); n.disabled = false; n.focus({ preventScroll:true }); }
      }
      S.help = 'done';
      await cutP(sleep(1300));
      board(null);
      return 'typed';
    },
    // free play: all three sliders, any number of runs; the table keeps the ones that parked
    async freeIntro(){
      scene = L; board(null);
      stagePanel('sandbox', { F:S.won || 441, m:60, mu:0.15 });
      L.m = pval.m; L.mu = pval.mu;
      freeTable(); $('params').oninput = freeTable;
      lockPanel(true);
      await say('yuan', '“ปรับ<b>มวล m</b> กับ<b>สัมประสิทธิ์ความเสียดทาน μ</b> ได้ตามใจเลย แล้วหาแรงผลักที่ทำให้กล่องจอดในช่องหน้าธงอีกครั้ง”');
      return 'free';
    },
    async free(){
      scene = L; board(null);
      stagePanel('sandbox', { F:S.won || 441, m:60, mu:0.15 });
      L.m = pval.m; L.mu = pval.mu;
      freeTable(); $('params').oninput = freeTable;
      lockPanel(false);
      say('ryuka', '“ตั้งค่าเสร็จแล้วกดผลักได้เลย”', { wait:false });
      const p = await waitPlay();
      lockPanel(true);
      L.start(p);
      const f = L.f(), IN = { F:p.F, m:p.m, mu:p.mu };
      if (p.F < 0){
        const held = -p.F <= f;
        await (held ? waitEvent('nomove') : waitAny(['stopped', 'gone']));
        track.attempt(IN, held ? 'nomove' : 'wrong-way');
        if (p.mu === 0 && !S.wrongs) await say('ryuka', '“μ = 0 ก็คือลานน้ำแข็ง ผลักไปทางซ้ายก็ไถลไปทางซ้ายไม่หยุดเลย!”');
        else await wrongWay(p.F, f, !S.wrongs);
        S.wrongs++;
        L.reset(); return 'free';
      }
      if (p.F <= f){
        await waitEvent('nomove');
        track.attempt(IN, 'nomove');
        await say('ryuka', p.F === 0 ? '“ไม่ผลักเลย ก็ไม่ขยับสิ”'
          : `“ไม่ขยับเลย! แรงผลัก ${p.F} N ยังไม่มากกว่าแรงเสียดทาน ${f.toFixed(1)} N”`);
        L.reset(); return 'free';
      }
      const r = await waitAny(['stopped', 'gone']);
      track.attempt(IN, stopOutcome(r), r.name === 'stopped' ? r.data.err : null);
      if (r.name === 'stopped' && r.data.ok){
        S.wins.push({ m:p.m, mu:p.mu, F:p.F }); S.freeFails = 0; freeTable();
        await parked(p, f);
        if ((await onward()) === 1) return null;
        L.reset(); return 'free';
      }
      S.freeFails++;
      const msg = miss(r, p.mu);
      if (S.freeFails >= 3 && p.mu > 0){ track.hint(); await say('yuan', hintLine(msg, f)); }
      else await say('ryuka', `“${msg}”`);
      return 'free';
    }
  });
  $('params').oninput = null;
  showPanel(null); board(null);
}

// tags: the misconception behind each wrong option (logged for the teacher; '' for the right one)
// o.ask [who, html]: the line that asks, the first time; o.held(pick): a prediction, the first pick waits (marked, not yet
// judged) while this runs, then the quiz goes on as usual: right away if it was right, with its own wrong line if not
async function quiz(id, q, opts, correct, why, wrong, tags, o = {}){
  const b = board(`<div class="q">${q}</div><div class="opts">${opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${'กขคง'[i]}. ${o}</button>`).join('')}</div>`, true);
  const btns = [...b.querySelectorAll('.opt')];
  const t0 = performance.now(), picks = [];
  let tFirst = 0;
  while (true){
    if (!picks.length && o.ask) say(o.ask[0], o.ask[1], { wait:false });
    else say('yuan', 'ตอบคำถามบนกระดานหน่อย', { wait:false });
    const pick = await new Promise(res => btns.forEach(x => x.onclick = () => { if (DEBUG) dbg.saw('opt', +x.dataset.i); res(+x.dataset.i); }));
    if (!picks.length) tFirst = performance.now() - t0;
    picks.push(pick);
    if (picks.length === 1 && o.held){
      btns.forEach(x => x.disabled = true); btns[pick].classList.add('held'); snd.fx('tick');
      await o.held(pick);
      btns[pick].classList.remove('held'); btns.forEach(x => x.disabled = false);
    }
    if (pick === correct){
      track.quiz(id, picks, correct, tags, tFirst, performance.now() - t0);
      btns[pick].classList.add('right'); btns.forEach(x => x.disabled = true); snd.fx('right');
      await say('yuan', `ถูกต้อง! ${why}`);
      return;
    }
    btns[pick].classList.add('wrong'); btns[pick].disabled = true; snd.fx('wrong');
    btns.forEach(x => x.classList.add('hold'));       // the feedback line comes first: until it is dismissed the options are visibly off
    await say('yuan', wrong[pick]);
    btns.forEach(x => x.classList.remove('hold'));
  }
}

    await say('yuan', '“งั้นจะย้อนเวลาให้ก่อนละกัน”');
    await rewindFx(J);
    await say('yuan', '“คราวนี้เปลี่ยนจากตั้งแรงผลัก มาตั้ง<b>ความเร็ว</b>ของกล่องตอนไถลเข้าหาที่กั้นแทน บนแท่นก็เป็นน้ำแข็ง กล่องเลยไถลด้วยความเร็วคงที่จนชนที่กั้น”');

  const note = (name, v) => `${name} v = ${v.toFixed(1)} m/s: ลอย ${tl.toFixed(2)} s ตกห่างขอบแท่น ${(v*tl).toFixed(2)} m`;
  const HINT = pre => `${pre}ใบ้ให้: เมื่อพุ่งออกในแนวราบ เวลาที่ลอยอยู่กลางอากาศขึ้นกับความสูงอย่างเดียว t = √(2h/g) = √(2×1.9/9.81) ≈ 0.62 s แล้ว D = v·t`;
  await stages(J, S, {
    // the first run is only watched: the speed is set and locked
    async first(){

        ['เวลาตกไม่ขึ้นกับความเร็วแนวนอน เพราะแกน y มีแค่แรงโน้มถ่วงเหมือนเดิม ลองใหม่นะ',

    <div class="eqMid"><span class="vec">F</span><sub class="math">ที่กั้น→กล่อง</sub> = −<span class="vec">F</span><sub class="math">กล่อง→ที่กั้น</sub></div>
    <div class="small">กฎข้อ 3: ขนาดเท่ากัน ทิศตรงข้าม<br>และกระทำกับวัตถุ<b>คนละก้อน</b> จึงไม่หักล้างกันเอง</div>`);
  await say('yuan', '“ตอนชน ที่กั้นออกแรงดันกล่อง และกล่องก็ดันที่กั้นกลับด้วยแรงขนาดเท่ากัน ทิศตรงข้าม นี่คือกฎข้อ 3 แรงที่ที่กั้นดันกล่องคือแรงที่ทำให้กล่องหยุด”', { pop:POP.law3 });
  await say('yuan', '“แต่ที่กั้นไม่ได้แตะริวกะเลย และผิวกล่องก็ลื่น ไม่มีแรงในแนวนอนมากระทำกับริวกะ ริวกะเลยพุ่งต่อด้วยความเร็วเดิม กฎข้อ 1 อีกแล้ว!”');
  await say('ryuka', '“แปลว่าไม่มีใครผลักเค้าออกไปเลยหรอ… เค้าแค่ไม่ได้หยุดตามกล่อง”');
  // the flight: every dot is 0.05 s after the one before, and can be tapped for its numbers
  J.showPair = false; J.showGuides = true;
  const land = waitEvent('relanded');
  J.release();
  await land;
  const tapped = [];
  board(`<span class="tag">ระหว่างลอยกลางอากาศ</span>
    <div class="cap">ระหว่างลอย มีแรงเดียวคือ <b>น้ำหนัก <i class="math">mg</i></b> ลงล่าง</div>
    <table class="tbl">
      <tr><th></th><th>แรง</th><th>ความเร่ง</th><th>ตำแหน่ง</th></tr>
      <tr><td class="up">แกน x</td><td>ΣF<sub>x</sub> = 0</td><td>a<sub>x</sub> = 0</td><td>x = v t</td></tr>
      <tr><td class="up">แกน y</td><td>ΣF<sub>y</sub> = mg</td><td>a<sub>y</sub> = g</td><td>Δy = ½ g t²</td></tr>
    </table>
    <div class="small">(ไม่คิดแรงต้านอากาศ) จุดบนฉากถ่ายทุก 0.05 s<br>t ในตาราง = เวลาลอย (นับจากตอนหลุดจากขอบแท่น); x = 0 ที่ขอบแท่น</div>
    <div class="def" id="dotRow">แตะจุดบนเส้นทางของริวกะ เพื่อดูตัวเลขของจุดนั้น</div>`).classList.add('tight');
  J.tapDots = true;
  J.onTap = i => {
    const t = i*0.05, el = $('dotRow');
    J.pick = i; tapped.push(t.toFixed(2));
    if (el) el.innerHTML = `จุดที่ <i class="math">t</i> = ${t.toFixed(2)} s: &nbsp;<i class="math">x</i> = <i class="math">v t</i> = ${v.toFixed(1)} × ${t.toFixed(2)} = <b>${(v*t).toFixed(2)} m</b><br>
      Δ<i class="math">y</i> = ½ <i class="math">g t</i>² = ½ × 9.81 × ${t.toFixed(2)}² = <b>${(0.5*G*t*t).toFixed(2)} m</b>`;
  };
  await say('yuan', '“ดูจุดที่ถ่ายไว้ทุก 0.05 วินาที ระยะห่างแนวนอนเท่ากันทุกช่วง เพราะแกน x ไม่มีแรง v<sub>x</sub> เลยคงที่ แต่ระยะแนวดิ่งห่างขึ้นเรื่อยๆ เพราะแรงโน้มถ่วงเร่งให้ตกเร็วขึ้น”', { pop:POP.flight });
  await say('yuan', '“ริวกะไม่ได้พุ่งตรงไปก่อนแล้วค่อยร่วงแบบในการ์ตูน และก็ไม่ได้ลอยขึ้นด้วย ตอนหลุดจากกล่องความเร็วแนวดิ่งเป็น 0 จึงเริ่มตกทันที เส้นทางเลยเป็นพาราโบลา”');
  track.choice('จุดบนเส้นทางลอย: แตะดูตัวเลข', tapped.length ? `แตะ (${tapped.length} ครั้ง: t = ${tapped.slice(0, 8).join(', ')}${tapped.length > 8 ? ', …' : ''} s)` : 'ไม่ได้แตะ');
  J.tapDots = false; J.onTap = null; J.pick = null;
  // the time in the air depends on the height alone: h can be slid, and t in the equation follows
  let slidH = null;
  board(`<span class="tag">หาเวลาลอยและความเร็ว</span>
    <div class="eqMid">h = ½ g t² &nbsp;→&nbsp; t = √(2h/g)</div>
    <div class="cap" id="tLine">t = √(2 × 1.9 / 9.81) ≈ <b>0.62 s</b></div>
    <div class="eqMid">D = v t &nbsp;→&nbsp; v = D / t</div>
    <div class="cap" id="vLine">v = 3.0 / 0.62 ≈ <b>4.8 m/s</b></div>
    <div class="small">เมื่อพุ่งออกในแนวราบ เวลาลอยขึ้นกับความสูงเท่านั้น<br>ไม่ขึ้นกับความเร็วแนวราบ</div>
    <div class="bslider"><span><i class="math">h</i></span><input type="range" class="rng" id="hR" min="0.5" max="3.5" step="0.1" value="1.9" aria-label="ความสูง h"><span class="math" id="hV">1.9 m</span></div>`).classList.add('tight');
  $('hR').addEventListener('input', e => {
    e.stopPropagation();
    const h = +$('hR').value, t = Math.sqrt(2*h/G);
    $('hV').textContent = `${h.toFixed(1)} m`;
    $('tLine').innerHTML = `t = √(2 × ${h.toFixed(1)} / 9.81) ≈ <b>${t.toFixed(2)} s</b>`;
    $('vLine').innerHTML = `v = 3.0 / ${t.toFixed(2)} ≈ <b>${(3/t).toFixed(1)} m/s</b>`;
    slidH = h; track.moves++;
  });
  $('hR').addEventListener('click', e => e.stopPropagation());
  await say('yuan', '“คิดแบบนี้ก็ได้คำตอบโดยไม่ต้องเดาเลย แกน x กับแกน y แยกกันคิดได้ ผูกกันด้วยเวลา t ตัวเดียวกัน”', { pop:POP.projectile });
  track.choice('กระดานเวลาลอย: ตัวเลื่อน h', slidH == null ? 'ไม่ได้เลื่อน' : `เลื่อน (จบที่ h = ${slidH.toFixed(1)} m)`);
  board(null);
}

async function ending(){
  showPanel(null); board(null); $('dialog').hidden = true; setTitle('');
  if (!track.feedbackDone) await feedback();
  snd.fx('finale');
  overlay(`<h2>สรุปสิ่งที่ริวกะได้เรียนรู้ (แบบเจ็บตัว)</h2>
    <div class="sumGrid">
      <div class="law"><b>กฎข้อ 1</b> ถ้า ΣF = 0 ความเร็วไม่เปลี่ยน นิ่งก็นิ่งต่อ วิ่งก็วิ่งต่อด้วยความเร็วคงที่ กล่องบนน้ำแข็งเลยไม่หยุดเอง</div>
      <div class="law"><b>แรงเสียดทาน</b> f = μmg ชี้สวนทางการเคลื่อนที่ ทำให้กล่องช้าลงจนหยุด กล่องหยุดเพราะแรงเสียดทาน ไม่ใช่เพราะเลิกผลัก</div>
      <div class="law"><b>กฎข้อ 2</b> ΣF = ma แรงลัพธ์ทำให้ความเร็ว<i>เปลี่ยน</i> ไม่ได้ถูกเก็บไว้ในวัตถุ หมดแรงลัพธ์เมื่อไหร่ ความเร่งก็เป็น 0</div>
      <div class="law"><b>สมการการเคลื่อนที่</b> เมื่อความเร่งคงที่: v = u + at; s = ut + ½at²; v² = u² + 2as ใช้ทีละช่วงที่แรงลัพธ์คงที่</div>
      <div class="law"><b>กฎข้อ 3</b> กล่องดันที่กั้น = ที่กั้นดันกล่อง (ขนาดเท่ากัน ทิศตรงข้าม) กระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน</div>
      <div class="law"><b>โพรเจกไทล์</b> แกน x: x = v t (ไม่มีแรง); แกน y: Δy = ½ g t²; เมื่อพุ่งออกในแนวราบ เวลาลอย t = √(2h/g) ขึ้นกับความสูงอย่างเดียว</div>
    </div>
    <div class="links"><button id="againBonus">เล่นด่านพิเศษอีกรอบ</button><button id="home">กลับหน้าหลัก</button></div>`);
  $('againBonus').onclick = () => run(['bonus', 'end'], 'replay:bonus');
  $('home').onclick = () => { track.restart(); Object.assign(memo, MEMO_START); titleScreen(); };
}

// End-of-game survey for the teacher (once per session), on three pages: the six aspects in FB_RATE, then the
// overall questions, then the two boxes to type in. Every answer is optional. ข้าม ends the survey: answers on the
// pages already left with ต่อไป are saved, the current page's are not, and with none at all the row is just
// "skipped". Each FB_RATE key is a Feedback column in the sheet.
const FB_RATE = [['theme', 'ความน่าสนใจของธีมเกมและโทนสี'], ['clarity', 'ความเข้าใจของคำอธิบาย'], ['flow', 'ความต่อเนื่องของเนื้อเรื่องและคำอธิบาย'],
  ['ui', 'ความง่ายของการใช้ UI'], ['teaching', 'เข้าใจการสอนมั้ย'], ['visual', 'องค์ประกอบ visual โดยรวม']];
function feedback(){
  const parts = track.visited.filter(k => k !== 'end');
  // LEVEL: what each step of the six ratings means, shown over the five columns of the first page
  const LEVEL = ['น้อยที่สุด', 'น้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];
  const scale = (k, label, lo, hi) => `<div class="scale lv" data-k="${k}" role="group" aria-label="${label}">${[1, 2, 3, 4, 5].map(n =>
      `<button data-v="${n}" aria-pressed="false"${lo ? '' : ` aria-label="${n} ${LEVEL[n - 1]}" title="${LEVEL[n - 1]}"`}>${n}</button>`).join('')}</div>${lo ? `<small>1 = ${lo}; 5 = ${hi}</small>` : ''}`;
  const ans = {}, num = k => +ans[k] || '';
  const pages = [
    { html:`<div class="fb rate"><div class="fbRow" aria-hidden="true"><span></span><div class="scaleHead">${LEVEL.map(w => `<span>${w}</span>`).join('')}</div></div>
          ${FB_RATE.map(([k, label]) => `<div class="fbRow"><span>${label}</span>${scale(k, label)}</div>`).join('')}</div>`,
      read:() => Object.fromEntries(FB_RATE.map(([k]) => [k, num(k)])) },
    { html:`<div class="fb">
          <div class="fbRow"><span>เกมนี้ยากแค่ไหน</span>${scale('difficulty', 'เกมนี้ยากแค่ไหน', 'ง่ายมาก', 'ยากมาก')}</div>
          <div class="fbRow"><span>สนุกแค่ไหน</span>${scale('enjoyment', 'สนุกแค่ไหน', 'ไม่สนุกเลย', 'สนุกมาก')}</div>
          <div class="fbRow"><span>ส่วนไหนยากที่สุด</span><div class="scale" data-k="hardest" role="group" aria-label="ส่วนไหนยากที่สุด">${parts.map(k =>
            `<button data-v="${k}" aria-pressed="false">${PART_NAME[k]}</button>`).join('')}</div></div></div>`,
      read:() => ({ difficulty:num('difficulty'), enjoyment:num('enjoyment'), hardest:ans.hardest ? PART_NAME[ans.hardest] : '' }) },
    { html:`<div class="fb type">
          <div class="fbRow"><label for="fbQ">ยังสงสัยอะไรอยู่ไหม</label><textarea id="fbQ" maxlength="300" placeholder="ส่วนที่ยังไม่เข้าใจ หรือสิ่งที่อยากถาม (ไม่บังคับ)"></textarea></div>
          <div class="fbRow"><label for="fbC">คิดยังไงกับเกมนี้</label><textarea id="fbC" maxlength="500" placeholder="คอมเมนต์มาได้เต็มที่เลยน้า พวกเรายินดีน้อมรับ และจะนำทุก ๆ คำแนะนำไปพัฒนาต่อนะ&#10;ขอบคุณครับ/ค่ะ"></textarea></div></div>`,
      read:() => ({ question:$('fbQ').value.trim(), comment:$('fbC').value.trim() }) }
  ];
  return new Promise(res => {
    const kept = {};                                   // answers from the pages left with ต่อไป
    const done = row => { track.feedback(row); res(); };
    const show = i => {
      const P = pages[i], last = i === pages.length - 1;
      overlay(`<h2>ก่อนดูสรุป ช่วยตอบสั้นๆ หน่อยนะ</h2>${P.html}
        <div class="startRow"><button class="btnDark" id="fbNext">${last ? 'ส่ง แล้วดูสรุป' : 'ต่อไป'}</button><button class="btnGhost" id="fbSkip">ข้าม</button></div>`);
      $('overlay').querySelectorAll('.scale').forEach(g => g.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        ans[g.dataset.k] = b.dataset.v;
      }));
      $('fbNext').onclick = () => { Object.assign(kept, P.read()); if (last) done({ ...kept, skipped:false }); else show(i + 1); };
      $('fbSkip').onclick = () => { if (DEBUG) dbg.saw('form'); return done(Object.values(kept).some(v => v !== '') ? { ...kept, skipped:false } : { skipped:true }); };
    };
    show(0);
  });
}

const STEPS = { ch1:chapter1, lesson, fric:frictionLevel, fricLesson:frictionLesson, sandbox, bonus, end:ending };
async function run(list, entry = 'replay', o = {}){
  if (DEBUG) dbg.ran();
  overlay(null); waiters = {}; endLevel(); runId++; snd.hush();
  const th = $('thumb'); if (th) th.remove();
  if (o.resume){                               // back into an earlier level from the back view (tracking was armed there)
    rewinding = true; playQueued = !!o.play; track.keepArm = true;
  } else { clearLines(); track.begin(entry); }
  $('backBtn').hidden = lines.length < 2;
  for (const [n, k] of list.entries()){
    stepNow = k; snd.part(); snd.music(k === 'end' ? 'title' : k === 'lesson' || k === 'fricLesson' ? 'lesson' : 'play', k === 'lesson' || k === 'fricLesson' ? 0.6 : 1);
    track.enter(k);
    await STEPS[k](n === 0 ? o : {});
    track.leave(true);
    track.saveProgress(FULL_RUN[FULL_RUN.indexOf(k) + 1] || null);
  }
}

function titleScreen(){
  snd.music('title');
  showPanel(null); board(null); $('dialog').hidden = true; setTitle(''); clearLines();
  scene = null;
  overlay(`<h1>ริวกะกับกล่องที่ไม่ยอมหยุด</h1>
    <h2><span class="buildWrap">กฎการเคลื่อนที่ของนิวตัน${BUILD_LABEL ? `<span class="buildTag">แบบ ${esc(BUILD_LABEL)}</span>` : ''}</span></h2>
    <div class="cast">
      <div class="ice"></div>
      <div class="slide">
        <div class="castName">ริวกะ</div>
        <img src="${ART.ryuka}" alt="ริวกะ" style="height:calc(118px*var(--k))">
        <div class="castBox"></div>
        <div class="vArrow" aria-hidden="true"><span class="vec">v</span></div>
      </div>
      <div class="stand" style="left:calc(50% - 165px*var(--k))"><img src="${ART.yuan}" alt="ยูอัน" style="height:calc(158px*var(--k))"><div class="castName">ยูอัน</div></div>
      <div class="stand" style="left:calc(50% + 165px*var(--k))"><img src="${ART.kay}" alt="เคย์" style="height:calc(146px*var(--k))"><div class="castName">เคย์</div></div>
    </div>
    <div class="who">
      <label>ชื่อ <input id="whoName" maxlength="40" autocomplete="off" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น"></label>
      <label>ชั้น <input id="whoRoom" maxlength="12" autocomplete="off" placeholder="เช่น ม.4/2"></label>
    </div>
    <div class="whoHint" id="whoHint" aria-live="polite"></div>
    <div class="startRow"><button class="btnDark" id="start">เริ่มเล่น</button><button class="btnGhost" id="resume" hidden></button></div>
    <div class="chapters"><button class="more" id="chapToggle" aria-controls="chapList"></button>
      <div class="list" id="chapList">${FULL_RUN.filter(k => k !== 'end').map(k => `<button data-from="${k}">${PART_NAME[k]}</button>`).join('')}</div></div>`, 'ts');
  // The chapter list starts folded away, so a new player sees one way in. It is not opened for a device with
  // saved progress: on a shared computer that would be every student after the first, and เล่นต่อ covers them.
  const setChapters = open => {
    $('chapList').hidden = !open; $('overlay').classList.toggle('open', open);
    $('chapToggle').setAttribute('aria-expanded', open);
    $('chapToggle').textContent = open ? 'เลือกบท ▴' : 'เลือกบท ▾';
  };
  $('chapToggle').onclick = () => setChapters($('chapList').hidden);
  setChapters(false);
  // The boxes start empty even when someone has played on this device before: on a shared computer the
  // next student would otherwise play, and be logged, under the previous student's name. The last player
  // can still carry on with the เล่นต่อ button, which says whose progress it is.
  const nameEl = $('whoName'), roomEl = $('whoRoom'), last = track.student;
  const clean = s => s.replace(/\s+/g, ' ').trim();
  const who = () => ({ name:clean(nameEl.value), room:clean(roomEl.value) });
  const NOTE = 'เกมนี้บันทึกชื่อ ชั้น และการเล่นของคุณ เพื่อใช้ในวิชาเรียนและปรับปรุงเกม · ใช้ชื่อเล่นแทนชื่อจริงได้';
  const hint = msg => { const h = $('whoHint'); h.textContent = msg || NOTE; h.classList.toggle('note', !msg); };
  const short = t => t.length > 18 ? t.slice(0, 17) + '…' : t;
  let resumeAs = null;                      // whose saved progress the เล่นต่อ button continues
  const showResume = () => {
    const w = who(), b = $('resume'), typing = !!(w.name || w.room);
    const st = typing ? w : last, p = track.progressOf(st);
    resumeAs = p && p.next && p.next !== 'ch1' ? st : null;
    b.hidden = !resumeAs;
    if (resumeAs) b.textContent = typing ? `เล่นต่อ: ${PART_NAME[p.next]}`
      : `เล่นต่อของ ${short(st.name)} (${short(st.room)}): ${PART_NAME[p.next]}`;
  };
  [nameEl, roomEl].forEach(el => el.addEventListener('input', () => {
    el.classList.remove('err'); hint(''); showResume();
  }));
  hint(''); showResume();
  const go = (from, entry, as) => {
    const w = as || who();
    nameEl.classList.toggle('err', !w.name); roomEl.classList.toggle('err', !w.room);
    if (!w.name || !w.room){
      hint('กรอกชื่อและชั้นก่อนเริ่มเล่นนะ');
      (w.name ? roomEl : nameEl).focus();
      return;
    }
    track.student = w; store.set('student', w);
    snd.fx('start');
    run(FULL_RUN.slice(FULL_RUN.indexOf(from)), entry);
  };
  $('start').onclick = () => go('ch1', 'start');
  // Enter does what เริ่มเล่น does; after a name with no class yet, it moves on to the class box.
  // stopPropagation: the same key press must not also reach the page's handler and skip the first line.
  [nameEl, roomEl].forEach(el => el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.repeat) return;
    e.preventDefault(); e.stopPropagation();
    if (el === nameEl && who().name && !who().room) roomEl.focus();
    else go('ch1', 'start');
  }));
  $('resume').onclick = () => {
    const st = resumeAs, p = track.progressOf(st);
    if (!p || !p.next) return;
    Object.assign(memo, p.memo || {});      // the lessons reuse the student's own numbers from earlier levels
    go(p.next, 'resume:' + p.next, st);
  };
  $('overlay').querySelectorAll('[data-from]').forEach(b => b.onclick = () => go(b.dataset.from, b.dataset.from === 'ch1' ? 'start' : 'skip:' + b.dataset.from));
  nameEl.focus();
}

/* =========================================================
   Debug mode (hidden): ↑ ↑ ↓ ↓ ← → ← → B A switches it on, and off again. Nothing on screen points to it.
   While it is on (a DEBUG badge shows, for this browser tab only) nothing of what is played is kept or sent:
   store.set, track.queue, track.flush and track.saveProgress do nothing. The panel behind the badge lists every
   frame of the storyboard with every state it describes and opens any of them; shows every line and board text

    const i = FULL_RUN.indexOf(trail.part), pp = i > 0 ? FULL_RUN[i - 1] : null;
    if (!pp){ start('title'); return true; }
    if (!done[pp]){ WARP = 1; start(pp, {}); await drive({}, { endOf:pp }); WARP = 0; sync(); }      // find out how that part goes
    const d = done[pp];
    await replay(pp, d ? d.acts.slice(0, -1) : [], d && d.memo);
    return true;
  });

  /* ---------- every line and board text of the part being played ----------
     The part is played through once the story's own way, then once for every state of its frames that answers
     differently: the lines only that state brings are listed where they are said, with the state as their condition. */
  async function record(part, plan, stop){
    WARP = 1; start(part, plan.lane ? { lane:plan.lane } : {});
    await drive(plan, stop);
    WARP = 0;
    return lines.filter(l => l.step === part).map((l, n) => ({ who:l.who, text:plain(l.html), board:l.board ? plain(l.board.html) : '', title:l.title, n }));
  }
  const script = guard(async () => {
    sync();
    const part = trail.part === 'title' ? 'ch1' : trail.part, key = part + '|' + cfg.lane;
    if (!cache[key]){
      const back = { part:trail.part, acts:trail.acts.slice(), memo:trail.memo };
      const mainPlan = { lane:cfg.lane }, out = (await record(part, mainPlan, { endOf:part })).map(l => ({ ...l, cond:'', plan:mainPlan }));
      for (const f of FRAMES) if (f.run === part) for (const st of f.states){
        if (!Object.keys(st.plan).some(k => k !== 'lane' || st.plan.lane !== cfg.lane)) continue;      // the main way has it already
        const rec = await record(part, st.plan, st.stop);
        let at = -1, ins = -1;                      // at: the last line this state shares with what is listed; ins: where its own lines go
        for (const l of rec){
          const j = out.findIndex(o => o.who === l.who && o.text === l.text);
          if (j >= 0){ at = j; ins = -1; continue; }
          if (ins < 0){ ins = at + 1; while (out[ins] && out[ins].cond) ins++; }       // after the lines other states already put there
          out.splice(ins++, 0, { ...l, cond:`เฟรม ${String(f.no).padStart(2, '0')} · ${st.n}`, plan:st.plan });
        }
      }
      cache[key] = { part, rows:out };
      if (back.part === 'title') start('title'); else await replay(back.part, back.acts, back.memo);      // back to where the reader was
    }
    return rows = cache[key];
  });
  const pick = guard(async i => {                 // jump to a line of the script
    const r = rows && rows.rows[i];
    if (!r) return false;
    WARP = 1; start(rows.part, r.plan.lane ? { lane:r.plan.lane } : {});
    const ok = await drive(r.plan, { lines:r.n + 1, part:rows.part });
    WARP = 0;
    return ok;
  });

  /* ---------- the panel ---------- */
  const esc2 = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
  function paintPos(){
    if (!ui) return;
    const p = where();
    $('dbgPos').textContent = `${trail.part === 'title' ? 'หน้าแรก' : PART_NAME[trail.part].split(' : ')[0]} · ขั้นที่ ${trail.acts.length + 1}${p ? ' · รอ: ' + p.key : ''}`;
  }
  function paint(){
    if (!ui) return;
    paintPos();
    ui.querySelectorAll('.dTabs [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
    const body = $('dbgBody');
    if ($('dbgPanel').hidden) return;
    if (tab === 'frames'){
      let h = '', part = '';
      FRAMES.forEach((f, fi) => {
        if (f.part !== part){ part = f.part; h += `<h4>${part === 'title' ? 'หน้าแรก' : esc2(PART_NAME[part])}</h4>`; }
        h += `<div class="dF"><b>${String(f.no).padStart(2, '0')}</b> ${esc2(f.title)} <i>${LANE[f.lane]}</i></div><div class="dS">` +
          f.states.map((s, si) => `<button data-go="${fi},${si}">${esc2(s.n)}</button>`).join('') + '</div>';
      });
      body.innerHTML = h;
    } else if (tab === 'script'){
      if (!rows || rows.part !== (trail.part === 'title' ? 'ch1' : trail.part)){ body.innerHTML = '<p class="dNote">กด “อ่านบทของตอนนี้” เกมจะเล่นตอนนี้ทุกทางแบบข้ามภาพ (ไม่กี่วินาที) แล้วกลับมาที่เดิม</p><button data-do="script">อ่านบทของตอนนี้</button>'; return; }
      let h = `<p class="dNote">${esc2(PART_NAME[rows.part])} · ${rows.rows.length} บรรทัด · กดบรรทัดเพื่อไปที่นั่น</p>`, board = null, title = '';
      rows.rows.forEach((r, i) => {
        if (r.title !== title){ title = r.title; h += `<h4>${esc2(title)}</h4>`; }
        if (r.board !== board){ board = r.board; if (board) h += `<div class="dB">กระดาน: ${esc2(board)}</div>`; }
        h += `<button class="dL${r.cond ? ' c' : ''}" data-line="${i}">${r.cond ? `<i>${esc2(r.cond)}</i>` : ''}<b>${CAST[r.who]}</b> ${esc2(r.text)}</button>`;
      });
      body.innerHTML = h;
    } else {
      const sel = (k, opts) => `<select data-k="${k}">${opts.map(([v, t]) => `<option value="${v}"${cfg[k] === v ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
      const numIn = (k, ph) => `<input type="number" step="any" data-k="${k}" value="${cfg[k] == null ? '' : cfg[k]}" placeholder="${ph}">`;
      body.innerHTML = `<p class="dNote">ใช้กับปุ่ม ◀ ▶ (หรือปุ่ม [ และ ]) และกับการเปิดตอนใหม่ การเปิดสถานะจากแท็บ “ฉาก” ใช้ค่าตัวอย่างของสตอรีบอร์ดเสมอ</p>
        <label>ทางของบทเรียนแรก ${sel('lane', [['base', 'ทางปูพื้น'], ['fast', 'ทางลัด']])}</label>
        <label>คำถามและควิซ ${sel('ans', [['right', 'ตอบถูก'], ['wrong', 'ตอบผิดก่อน แล้วถูก']])}</label>
        <label>รอบจริงของด่าน ${sel('run', [['hit', 'เข้าเป้า'], ['short', 'พลาดก่อน: ไม่ถึง'], ['long', 'พลาดก่อน: เลย']])}</label>
        <label>ช่องเติมของตัวช่วย ${sel('blank', [['right', 'เติมถูก'], ['wrong', 'เติมผิดก่อน แล้วถูก']])}</label>
        <label>แรงผลัก F (N) ${numIn('F', 'ตามสตอรีบอร์ด')}</label>
        <label>มวล m (kg) ${numIn('m', '60')}</label>
        <label>μ ${numIn('mu', '0.20')}</label>
        <label>ความเร็ว v (m/s) ${numIn('v', '4.8')}</label>
        <label>ภาพเคลื่อนไหว ${sel('speed', [['skip', 'ข้าม (ทันที)'], ['x4', 'เร็ว ×4'], ['normal', 'ปกติ']])}</label>
        <p class="dNote">F, m, μ, v ที่ใส่ไว้ใช้กับรอบผลักถัดไป (เว้นว่าง = ค่าของสตอรีบอร์ด) · ขณะเปิดโหมดนี้ เกมไม่บันทึกและไม่ส่งอะไรเลย</p>`;
    }
  }
  function build(){
    ui = document.createElement('div'); ui.id = 'dbg';
    ui.innerHTML = `<button id="dbgBadge" title="แผงดีบัก">DEBUG</button>
      <div id="dbgBar"><button data-do="prev" title="ก่อนหน้า  [">◀</button><button data-do="next" title="ถัดไป  ]">▶</button><span id="dbgPos"></span></div>
      <div id="dbgPanel" hidden><div class="dTabs"><button data-tab="frames">ฉาก</button><button data-tab="script">บทพูด</button><button data-tab="set">ตั้งค่า</button><button data-do="close" title="ปิดแผง">✕</button></div><div id="dbgBody"></div></div>`;
    stage.append(ui);
    ['keydown', 'pointerdown', 'wheel'].forEach(t => ui.addEventListener(t, e => e.stopPropagation()));
    ui.addEventListener('click', async e => {
      e.stopPropagation();
      const b = e.target.closest('button'); if (!b) return;
      if (b.id === 'dbgBadge' || b.dataset.do === 'close'){ $('dbgPanel').hidden = !$('dbgPanel').hidden; paint(); }
      else if (b.dataset.tab){ tab = b.dataset.tab; paint(); }
      else if (b.dataset.do === 'next') next();
      else if (b.dataset.do === 'prev') prev();
      else if (b.dataset.do === 'script'){ $('dbgBody').innerHTML = '<p class="dNote">กำลังอ่านบท…</p>'; await script(); paint(); }
      else if (b.dataset.go){ const [fi, si] = b.dataset.go.split(',').map(Number); go(fi, si); }
      else if (b.dataset.line) pick(+b.dataset.line);
    });
    ui.addEventListener('change', e => {
      const k = e.target.dataset && e.target.dataset.k; if (!k) return;
      cfg[k] = e.target.type === 'number' ? (e.target.value === '' || !isFinite(+e.target.value) ? null : +e.target.value) : e.target.value;
      RATE = cfg.speed === 'x4' ? 4 : 1;
    });
    paint();
  }
  function set(v){
    DEBUG = v;
    try { if (v) sessionStorage.setItem('nmg.debug', '1'); else sessionStorage.removeItem('nmg.debug'); } catch (e){}
    if (v){
      bornIn = track.session ? track.sessionId : null; moved = false;
      trail = fresh(); given = {}; sync();
      RATE = cfg.speed === 'x4' ? 4 : 1;
      build();
    } else {
      if (ui){ ui.remove(); ui = null; }
      RATE = 1; WARP = 0;
      // What was done in debug mode cannot go on as a recorded play: unless nothing was moved and a play was already
      // under way when it was switched on, the game goes back to the title screen with a clean slate.
      if (!(bornIn && !moved && track.sessionId === bornIn)){
        Object.assign(track, { sessionId:uid(), session:null, sec:null, visited:[], feedbackDone:false, activeMs:0, lastInputs:{}, armed:null, student:store.get('student', null) });
        start('title');
      }
    }
  }
  // ] and [ step on and back (not while typing in a box)
  addEventListener('keydown', e => {
    if (!DEBUG || e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement, fwd = e.key === ']' || e.code === 'BracketRight', bwd = e.key === '[' || e.code === 'BracketLeft';
    if (!(fwd || bwd) || (a && a.matches && a.matches('input, textarea, select'))) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (fwd) next(); else prev();
  }, true);
  /* The code. From the first ← on, its keys are swallowed: ← → would step the back view and B A would be typed into
     a focused box. The four keys before that are let through (↑ and ↓ are needed by number boxes and sliders); a box
     that had the focus gets its value and caret back when the code is complete. */
  const CODE = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'], PHYS = { b:'KeyB', a:'KeyA' };
  let at = 0, snap = null;
  const take = () => { const a = document.activeElement; snap = a && a.matches && a.matches('input, textarea') ? { a, v:a.value, s:a.selectionStart, e:a.selectionEnd } : null; };
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey){ at = 0; return; }
    const want = CODE[at], ok = e.key === want || e.key.toLowerCase() === want || e.code === PHYS[want];
    if (!ok){ at = e.key === 'ArrowUp' ? (at === 2 ? 2 : 1) : 0; if (at === 1) take(); return; }
    if (at === 0) take();
    at++;
    if (at > 4){ e.preventDefault(); e.stopImmediatePropagation(); }
    if (at < CODE.length) return;
    at = 0;
    if (snap && snap.a.isConnected){
      if (snap.a.value !== snap.v){ snap.a.value = snap.v; snap.a.dispatchEvent(new Event('input', { bubbles:true })); }
      try { snap.a.setSelectionRange(snap.s, snap.e); } catch (err){}
    }
    set(!DEBUG);
  }, true);

  return { saw, dirty(){ trail.dirty = true; moved = true; }, ran(){ moved = true; }, boot(){ if (DEBUG){ bornIn = null; build(); } },
    go, next, prev, script, pick, cfg, where, get on(){ return DEBUG; },
    get frames(){ return FRAMES.map(f => ({ no:f.no, part:f.part, lane:f.lane, title:f.title, states:f.states.map(s => s.n) })); },
    get trail(){ return { part:trail.part, steps:trail.acts.length }; } };
})();

titleScreen();
dbg.boot();
</script>
